 screen.innerHTML=back()+'<div class="card"><h2>🧭 Diagnostyka łączona: silnik + elektryka + CVT</h2><div class="diag-sub">Biblioteka: '+knowledgeCases.length+' kart. Powiązane objawy prowadzą do innych kart; korelacja nie potwierdza sama przyczyny.</div><p style="font-size:12px;color:var(--dim);line-height:1.55">Szukaj po objawie, części, przyczynie lub teście. Filtruj po kategorii i statusie źródła. Niepotwierdzony wpis to trop, a nie pewna diagnoza.</p><input id="knowledgeFilter" placeholder="Szukaj: gaśnie, brak mocy, impulsator, O-ring, pasek…" oninput="filterKnowledge()"><div class="grid2"><select id="knowledgeCategory" aria-label="Filtr kategorii" onchange="filterKnowledge()"><option value="">Wszystkie kategorie</option>'+categories.map(cat=>'<option value="'+escapeHtml(cat)+'">'+escapeHtml(cat)+'</option>').join('')+'</select><select id="knowledgeEvidence" aria-label="Filtr statusu dokumentacji" onchange="filterKnowledge()"><option value="">Wszystkie statusy</option><option value="confirmed">Potwierdzone w instrukcji</option><option value="partial">Częściowo potwierdzone</option><option value="unlinked">Bez przypisanej serwisówki</option></select></div><small id="knowledgeCount" style="display:block;color:var(--dim);margin:0 0 8px"></small><div class="btn" onclick="nav(\'engine\',\'CVT\')">🔄 Przejdź do mechaniki CVT</div><div class="btn" onclick="nav(\'wiring\',\'2T\')">⚡ Przejdź do instalacji 2T</div><div class="btn" onclick="nav(\'multimeter\')">📏 Procedury multimetrem</div></div><div id="knowledgeCards">'+cards+'</div><div class="card"><h2>📚 Źródła i zasady potwierdzania</h2><p style="font-size:12px;line-height:1.5">Serwisówka potwierdza tylko model i procedurę, którą opisuje. Ustal model, rocznik i kod silnika przed porównaniem pomiarów.</p><div class="entry"><b>Piaggio NRG Power PureJet — Workshop Manual</b><small>Kontrola ciśnienia powietrza, nieszczelności i O-ring przy wtryskiwaczu.</small><a href="https://www.49ccscoot.com/manuals/Piaggio-NRG-Power-Purejet_Shop_Manual.pdf" target="_blank" rel="noopener noreferrer">Otwórz instrukcję PDF</a></div><div class="entry"><b>Yamaha YQ50 5BS-AE2 — Service Manual (1997)</b><small>Orientacja tłoka, świeca, układ zapłonowy i kontrola CVT dla tej wersji.</small><a href="https://scootergrisen.org/scooterhjemmeside/download/yamaha_aerox_servicemanual.pdf" target="_blank" rel="noopener noreferrer">Otwórz instrukcję PDF</a></div><div class="entry"><b>Dell’Orto E.C.S. EURO 4 — short user manual</b><small>Rodzina sterowników i ograniczenia pinoutu do konkretnego wariantu; nie zastępuje serwisówki OEM.</small><a href="https://www.immo-tools.lt/site/files/failai/ASW-NEXT/DELLORTO_ECS_UM.pdf" target="_blank" rel="noopener noreferrer">Otwórz instrukcję PDF</a></div><div class="entry"><b>Materiały społecznościowe</b><small>Pomagają znaleźć tropy, lecz nie potwierdzają same z siebie specyfikacji OEM.</small><a href="https://www.reddit.com/r/scooters/" target="_blank" rel="noopener noreferrer">Społeczność skuterowa</a></div></div>';

function filterKnowledge(){
 const q=(document.getElementById('knowledgeFilter')?.value||'').toLowerCase().trim(),category=document.getElementById('knowledgeCategory')?.value||'',evidence=document.getElementById('knowledgeEvidence')?.value||'';
 const cards=[...document.querySelectorAll('#knowledgeCards .knowledge-case-card')];let shown=0;
 cards.forEach(c=>{const text=(c.innerText||'').toLowerCase(),ok=(!q||text.includes(q))&&(!category||c.dataset.category===category)&&(!evidence||c.dataset.evidence===evidence);c.style.display=ok?'':'none';if(ok)shown++;});
 const count=document.getElementById('knowledgeCount');if(count)count.textContent='Wyniki: '+shown+' / '+cards.length+' kart przypadków';
}
function jumpToKnowledge(id){const q=document.getElementById('knowledgeFilter');if(q)q.value='';const cat=document.getElementById('knowledgeCategory');if(cat)cat.value='';const ev=document.getElementById('knowledgeEvidence');if(ev)ev.value='';filterKnowledge();const target=document.querySelector('#knowledgeCards [data-knowledge-id="'+id+'"]');if(target)target.scrollIntoView({behavior:'smooth',block:'start'});}
// ---------- BLOKADA PIN ----------
let pin = (load('naprawnik_pin')[0]) || null;
let pinEntry = '';
let pinSetupStep = null; // null | 'new' | 'confirmNew'
let pinSetupFirst = '';
const lockEl = $('#lockScreen');
const frameEl = document.querySelector('.frame');

function pinPadHtml(title, sub, showForgot){
  const dots = [0,1,2,3].map(i=>`<div style="width:16px;height:16px;border-radius:8px;margin:0 6px;background:${i<pinEntry.length?'var(--accent)':'transparent'};border:2px solid var(--accent);display:inline-block"></div>`).join('');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  const keysHtml = keys.map(k=>k===''?'<div style="width:70px;height:56px"></div>':
    `<div onclick="pinKey('${k}')" style="width:70px;height:56px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:var(--text);cursor:pointer">${k}</div>`).join('');
  return `<div style="text-align:center;max-width:280px">
    <div style="color:var(--yellow);font-size:22px;font-weight:bold;text-shadow:0 0 8px var(--yellow);margin-bottom:6px">🔒 ${title}</div>
    ${sub?`<div style="color:var(--dim);font-size:12px;margin-bottom:16px">${sub}</div>`:''}
    <div style="margin:16px 0">${dots}</div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center">${keysHtml}</div>
    ${showForgot?`<div onclick="forgotPinWipe()" style="color:var(--dim);font-size:11px;margin-top:20px;cursor:pointer">Nie pamiętam PIN-u</div>`:''}
    ${pinSetupStep?`<div onclick="cancelPinSetup()" style="color:var(--dim);font-size:11px;margin-top:20px;cursor:pointer">Anuluj</div>`:''}
  </div>`;
}
function showLock(){
  frameEl.style.display='none'; lockEl.style.display='flex';
  if(pinSetupStep==='new') lockEl.innerHTML = pinPadHtml('Ustaw nowy PIN','Wpisz 4 cyfry.', false);
  else if(pinSetupStep==='confirmNew') lockEl.innerHTML = pinPadHtml('Powtórz PIN','Wpisz te same 4 cyfry jeszcze raz.', false);
  else lockEl.innerHTML = pinPadHtml('Wpisz PIN','Blokada ekranu — nie jest to szyfrowanie danych.', true);
}
function hideLock(){ lockEl.style.display='none'; frameEl.style.display='flex'; }
function pinKey(d){
  if(d==='⌫'){ pinEntry = pinEntry.slice(0,-1); showLock(); return; }
  pinEntry = (pinEntry + d).slice(0,4);
  if(pinSetupStep==='new'){
    if(pinEntry.length===4){ pinSetupFirst=pinEntry; pinEntry=''; pinSetupStep='confirmNew'; }
    showLock(); return;
  }
  if(pinSetupStep==='confirmNew'){
    if(pinEntry.length===4){
      if(pinEntry===pinSetupFirst){ pin=pinEntry; save('naprawnik_pin',[pin]); pinSetupStep=null; pinEntry=''; hideLock(); alert('PIN ustawiony. Będzie wymagany przy każdym uruchomieniu aplikacji.'); renderSettings(); }
      else { alert('Nie zgadza się. Wpisz PIN jeszcze raz.'); pinSetupStep='new'; pinSetupFirst=''; pinEntry=''; showLock(); }
    } else showLock();
    return;
  }
  // weryfikacja przy odblokowywaniu
  if(pinEntry.length===4){
    if(pinEntry===pin){ pinEntry=''; hideLock(); nav('home'); }
    else { alert('Zły PIN. Spróbuj ponownie.'); pinEntry=''; showLock(); }
  } else showLock();
}
function startPinSetup(){ pinSetupStep='new'; pinSetupFirst=''; pinEntry=''; showLock(); }
function cancelPinSetup(){ pinSetupStep=null; pinEntry=''; hideLock(); }
function disablePin(){
  if(!confirm('Aplikacja nie będzie już wymagać kodu przy starcie.')) return;
  pin=null; save('naprawnik_pin',[null]); renderSettings();
}
function forgotPinWipe(){
  if(!confirm('Bez PIN-u nie da się odzyskać dostępu do danych w tym trybie offline. Jedyna opcja to całkowite wyczyszczenie aplikacji — wszystkie pojazdy, naprawy, notatki oraz zdjęcia i przypadki asystenta AI zostaną usunięte. Kontynuować?')) return;
  NAPRAWNIK_STORAGE_KEYS.forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});
  pin=null; pinEntry=''; vehicles=[]; repairs=[]; paWipeDb();
  hideLock(); nav('home');
}

try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e))); }
if(pin){ showLock(); } else { nav('home'); }
