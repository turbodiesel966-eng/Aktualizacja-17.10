STRIPE_PRICE_PRO_MONTHLY = "price_1UUd5LJgi8iwHKRbDlIkpQJo"
STRIPE_PRICE_PRO_YEARLY = "price_1UUd5MJgi8iwHKRbRS7WOdWM"
STRIPE_PRICE_WARSZTAT_MONTHLY = "price_1UUOrKJgi8iwHKRbHtsxzDcU"
STRIPE_PRICE_WARSZTAT_YEARLY = "price_1UUOrQJgi8iwHKRbIkeq1sUY"
STRIPE_PRICE_PRO_3D = "price_1UUfEJJgi8iwHKRbpU3ivTbn"
