workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "naprawnik-subscriptions-live"
database_id = "a2da4f07-f769-45f0-9ead-3bd67c385e85"
migrations_dir = "migrations"

[vars]
PRODUCTION_ENABLED = "true"
STRIPE_EXPECT_LIVEMODE = "true"
