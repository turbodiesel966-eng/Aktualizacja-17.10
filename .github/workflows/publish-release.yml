name: Publish NAPRAWNIK Web + APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naprawnik-release-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, verify and publish one release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled web app
        run: npm run mobile:prepare

      - name: Bundle native Android bridge
        run: npm run mobile:bundle-native

      - name: Generate Android project
        run: npx cap add android

      - name: Generate branded launcher and splash
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK contents
        run: python3 scripts/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare existing download page with the new APK and checksum
        run: python3 scripts/prepare-download-release.py --apk android/app/build/outputs/apk/debug/app-debug.apk --output site

      - name: Check required Cloudflare credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token with Cloudflare Pages edit/deploy permission."
            exit 1
          fi

      - name: Publish download page and APK to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "57d36ef5874a9d0df63d78eee95e74e3"
          command: pages deploy site --project-name=naprawnik-download --branch=main

      - name: Upload APK release artifact
        uses: actions/upload-artifact@v4
        with:
          name: naprawnik-android-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
