name: Validate NAPRAWNIK HTML

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Sprawdź JavaScript w index.html
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("Nie znaleziono wbudowanych skryptów JS.")
          for i, script in enumerate(scripts):
              Path(f"/tmp/naprawnik-inline-{i}.js").write_text(script, encoding="utf-8")
          case_block = html.split("const knowledgeCases = [", 1)[1].split("const KNOW_LINKS={", 1)[0]
          ids = re.findall(r"""\{\s*["']?id["']?\s*:\s*["']([^"']+)["']""", case_block)
          if len(ids) < 70 or len(ids) != len(set(ids)):
              raise SystemExit(f"Nieprawidłowa liczba/unikalność kart (wymagane co najmniej 70): {len(ids)}")
          for token in ("KNOW_CATEGORY_BY_ID", "KNOW_EVIDENCE_LABELS", "function filterKnowledge()", "function jumpToKnowledge(id)"):
              if token not in html:
                  raise SystemExit(f"Brak elementu: {token}")
          print(f"OK: {len(ids)} unikalnych kart, {len(scripts)} skryptów wbudowanych.")
          PY
          for file in /tmp/naprawnik-inline-*.js; do
            node --check "$file"
          done
      - name: Sprawdź moduł płatności
        run: node --check billing.js
      - name: Sprawdź katalog techniczny
        run: node --check katalog-techniczny.js
      - name: Sprawdź Service Workera aplikacji
        run: node --check sw.js
      - name: Sprawdź składnię Cloudflare Worker
        run: node --check workers/subscriptions/src/index.mjs
      - name: Testy regresyjne aplikacji i backendu
        run: node --test tests/*.test.cjs workers/subscriptions/security.test.mjs workers/subscriptions/admin-promos.test.mjs workers/subscriptions/stripe-diagnostics.test.mjs workers/subscriptions/photo-budget.test.mjs workers/subscriptions/one-time-packages.test.mjs
