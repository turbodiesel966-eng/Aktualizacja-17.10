name: Update NAPRAWNIK download page scan information

on:
  push:
    branches:
      - main
    paths:
      - "scripts/prepare-download-release.py"
      - ".github/workflows/update-download-page.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naprawnik-download-page-main
  cancel-in-progress: false

jobs:
  update-download-page:
    name: Update scan link without rebuilding APK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4

      - name: Download the currently published APK
        run: curl --fail --location --silent --show-error https://naprawnik-download.pages.dev/app-debug.apk --output current-app-debug.apk

      - name: Verify and update the page while preserving the current APK
        run: python3 scripts/prepare-download-release.py --apk current-app-debug.apk --output site --require-existing-checksum

      - name: Check required Cloudflare credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Publish updated download page
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "57d36ef5874a9d0df63d78eee95e74e3"
          command: pages deploy site --project-name=naprawnik-download --branch=main
