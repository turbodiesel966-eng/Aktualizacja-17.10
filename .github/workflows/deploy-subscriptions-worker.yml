name: Deploy Cloudflare Subscriptions Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/subscriptions/**"
      - ".github/workflows/deploy-subscriptions-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-subscriptions:
    name: Deploy naprawnik-subscriptions-live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify syntax and backend tests
        run: |
          node --check workers/subscriptions/src/index.mjs
          node --test workers/subscriptions/*.test.mjs

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "57d36ef5874a9d0df63d78eee95e74e3"
          workingDirectory: "workers/subscriptions"
          command: deploy
