name: NAPRAWNIK billing smoke test

on:
  push:
    branches:
      - fix/live-stripe-subscriptions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdź health produkcyjnego API
        shell: bash
        run: |
          set -euo pipefail
          API="https://naprawnik-subscriptions-live.turbodiesel966.workers.dev"
          HEALTH="$(curl --fail --silent --show-error "$API/health")"
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.ok || d.enabled!==true) { console.error("API nie jest aktywne"); process.exit(1); }' "$HEALTH"
          echo "Health OK; API aktywne."
      - name: Sprawdź rejestrację i odczyt konta
        shell: bash
        run: |
          set -euo pipefail
          API="https://naprawnik-subscriptions-live.turbodiesel966.workers.dev"
          REG="$(curl --fail --silent --show-error -X POST "$API/api/register" -H "Content-Type: application/json" -d '{}')"
          TOKEN="$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.token) process.exit(1); process.stdout.write(d.token);' "$REG")"
          ME="$(curl --fail --silent --show-error "$API/api/me" -H "Authorization: Bearer $TOKEN")"
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.user || d.user.tier!=="amator") { console.error("Niepoprawny odczyt konta"); process.exit(1); }' "$ME"
          echo "Rejestracja i odczyt konta OK."
      - name: Sprawdź utworzenie sesji Stripe bez płatności
        shell: bash
        run: |
          set -euo pipefail
          API="https://naprawnik-subscriptions-live.turbodiesel966.workers.dev"
          REG="$(curl --fail --silent --show-error -X POST "$API/api/register" -H "Content-Type: application/json" -d '{}')"
          TOKEN="$(node -e 'const d=JSON.parse(process.argv[1]); if(!d.token) process.exit(1); process.stdout.write(d.token);' "$REG")"
          KEY="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RESULT="$(curl --fail --silent --show-error -X POST "$API/api/checkout" -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: $KEY" -d '{"tier":"pro","interval":"month"}')"
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.url || !d.url.startsWith("https://checkout.stripe.com/") || !d.sessionId) { console.error("Stripe Checkout nie utworzył sesji"); process.exit(1); }' "$RESULT"
          echo "Sesja Stripe utworzona poprawnie. Żadna płatność nie została wykonana."
