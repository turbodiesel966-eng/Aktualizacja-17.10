name: Build NAPRAWNIK Android APK

on:
  push:
    branches:
      - main
      - fix/mobile-admin-access-capacitor-apk-20261026
      - apk/admin-pairing-ui-20261026
      - apk/owner-content-editor-20261028
      - fix/apk-back-navigation-20261030
      - fix/restore-apk-fault-editor-calculators-20261030
      - work/naprawnik-admin-trial-hardening-20261030
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'capacitor.config.json'
      - 'index.html'
      - 'billing.js'
      - 'mobile-admin-pairing.js'
      - 'mobile-diagnostic-content.js'
      - 'mobile-workshop-calculators.js'
      - 'tests/**'
      - 'katalog-techniczny.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'scripts/prepare-mobile.mjs'
      - 'scripts/configure-android-build.mjs'
      - 'scripts/verify-apk.py'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: naprawnik-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Check Android-only JavaScript syntax
        run: node --check mobile-admin-pairing.js && node --check mobile-diagnostic-content.js && node --check mobile-workshop-calculators.js && node --check scripts/prepare-mobile.mjs

      - name: Prepare bundled web app
        run: npm run mobile:prepare

      - name: Bundle native Android bridge
        run: npm run mobile:bundle-native

      - name: Generate Android project
        run: npx cap add android

      - name: Set package identity, version and optional persistent signing
        run: node scripts/configure-android-build.mjs

      - name: Generate branded NAPRAWNIK launcher and splash
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify packaged app features and branded icon
        run: python3 scripts/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: naprawnik-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check persistent release-signing secrets
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Release signing is intentionally disabled during DEBUG testing."

      - name: Build stable signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signed release APK and migration package ID
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          python3 scripts/verify-apk.py "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep -F "package: name='pl.turbodiesel.naprawnik.mobile'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload stable signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: naprawnik-android-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Verify migration build package identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='pl.turbodiesel.naprawnik.mobile'"

