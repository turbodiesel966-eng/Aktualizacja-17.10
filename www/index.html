// ---------- SYSTEM SZYBKICH AKTUALIZACJI APLIKACJI ----------
const CURRENT_APP_VERSION = "5.29.0";
const CURRENT_APP_BUILD = 1730572000000;
let isAppUpdateAvailable = false;
let initialAppETag = null;
let initialAppLastModified = null;

function triggerUpdateState(){
  if (isAppUpdateAvailable) return;
  isAppUpdateAvailable = true;
  const btn = document.getElementById("btnAppUpdate");
  const txt = document.getElementById("updateBtnText");
  const icon = document.getElementById("updateBtnIcon");
  if (btn) {
    btn.classList.remove("normal");
    btn.classList.add("update-ready");
  }
  if (icon) {
    icon.textContent = "🚨";
  }
  if (txt) {
    txt.textContent = "Rób Aktualizacje ten pojeb znów coś wymyślił i dodał!!!!";
  }
}

async function checkForAppUpdates(manual){
  try {
    // 1. Sprawdź Service Worker
    if ("serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) {
        reg.update().catch(() => {});
        if (reg.waiting) {
          triggerUpdateState();
          return true;
        }
      }
    }

    // 2. Sprawdź plik version.json (wymuszenie świeżości parametrem _chk)
    try {
      const vRes = await fetch("./version.json?_chk=" + Date.now(), { cache: "no-store" });
      if (vRes.ok) {
        const remote = await vRes.json();
        if (remote && (remote.version !== CURRENT_APP_VERSION || (remote.build && remote.build > CURRENT_APP_BUILD))) {
          triggerUpdateState();
          return true;
        }
      }
    } catch (_) {}

    // 3. Sprawdź ETag / Last-Modified głównego pliku index.html
    try {
      const headRes = await fetch("./index.html?_chk=" + Date.now(), { method: "HEAD", cache: "no-store" });
      if (headRes.ok) {
        const etag = headRes.headers.get("ETag");
        const lastMod = headRes.headers.get("Last-Modified");
        if (!initialAppETag && etag) initialAppETag = etag;
        if (!initialAppLastModified && lastMod) initialAppLastModified = lastMod;

        if ((initialAppETag && etag && etag !== initialAppETag) ||
            (initialAppLastModified && lastMod && lastMod !== initialAppLastModified)) {
          triggerUpdateState();
          return true;
        }
      }
    } catch (_) {}
  } catch (err) {
    if (manual) console.warn("Błąd podczas sprawdzania aktualizacji:", err);
  }
  return false;
}

async function handleAppUpdateClick(){
  const btn = document.getElementById("btnAppUpdate");
  const txt = document.getElementById("updateBtnText");

  if (isAppUpdateAvailable) {
    if (txt) txt.textContent = "⏳ Instaluję aktualizację...";
    try {
      if ("serviceWorker" in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg && reg.waiting) {
          reg.waiting.postMessage({ action: "skipWaiting" });
        }
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch (_) {}
    setTimeout(() => {
      window.location.reload(true);
    }, 350);
    return;
  }

  if (txt) txt.textContent = "🔍 Sprawdzam aktualizacje...";
  const hasUpdate = await checkForAppUpdates(true);
  if (!hasUpdate) {
    if (txt) txt.textContent = "✅ Aplikacja jest aktualna";
    setTimeout(() => {
      if (!isAppUpdateAvailable && txt) txt.textContent = "Aktualizuj";
    }, 2500);
  }
}

window.npCheckForUpdates = checkForAppUpdates;
window.npTriggerUpdateState = triggerUpdateState;
window.handleAppUpdateClick = handleAppUpdateClick;

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      if (reg.waiting) triggerUpdateState();
      reg.addEventListener("updatefound", () => {
        const newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener("statechange", () => {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              triggerUpdateState();
            }
          });
        }
      });
    }).catch(e => console.warn("SW:", e));
  });
}

// Sprawdzanie cykliczne w tle co 25 sekund (bez wysyłania powiadomień)
if (typeof setInterval === "function") {
  setInterval(() => {
    if (!isAppUpdateAvailable) checkForAppUpdates(false);
  }, 25000);
}

// Sprawdzanie po powrocie do aplikacji / przywróceniu karty
if (typeof document !== "undefined" && typeof document.addEventListener === "function") {
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !isAppUpdateAvailable) {
      checkForAppUpdates(false);
    }
  });
}
if (typeof window !== "undefined" && typeof window.addEventListener === "function") {
  window.addEventListener("focus", () => {
    if (!isAppUpdateAvailable) checkForAppUpdates(false);
  });
}

// Pierwsze sprawdzenie w tle 1.5s po uruchomieniu
if (typeof setTimeout === "function") {
  setTimeout(() => {
    checkForAppUpdates(false);
  }, 1500);
}
