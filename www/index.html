  {"id":"clutch_bell_overheated","title":"Dzwon sprzęgła ma fioletowy kolor, skuter drży i rwie przy ruszaniu","tags":"cvt sprzęgło dzwon fioletowy przegrzanie okładziny sprężynki","areas":[["Przegrzanie hutnicze stali dzwonu","Fioletowe, niebieskie lub czarne odbarwienia na zewnętrznej powierzchni dzwonu sprzęgła to bezdyskusyjny dowód na osiągnięcie temperatury powyżej 300°C! Dzieje się tak przy długotrwałej jeździe na półsprzęgle (np. podjazd pod strome wzniesienia z pasażerem) lub gdy pękła jedna ze sprężynem szczęk sprzęgła."],["Zwichrowanie i utrata geometrii (bicie owalne)","Po przegrzaniu stalowy dzwon traci idealną okrągłość (staje się owalny). Szczęki sprzęgła chwytają go pulsacyjnie, co wywołuje silne drgania całego zespołu napędowego odczuwalne na kierownicy i podnóżku."],["Naprawa","Przegrzany, zniekształcony dzwon sprzęgła należy bezwzględnie WYMIENIĆ na nowy. Okładziny szczęk sprzęgła należy zmatowić papierem ściernym o gradacji 120, a sprężynki sprzęgła wymienić na nowe o odpowiedniej twardości."]]},
  {"id":"starter_bendix_screech","title":"Głośny metaliczny pisk lub zgrzyt przy rozruchu elektrycznym","tags":"rozrusznik bendix wieniec zębaty tulejka smarowanie zęby","areas":[["Zacierający się mechanizm bendixa","Bendix w skuterach 50/125 to zespół sprzęgła jednokierunkowego i koła zębatego ze ślimakiem. Jeśli do mechanizmu dostanie się pył z paska napędowego lub stary smar zaschnie, zębatka nie wysuwa się płynnie i trafia w wieniec zębaty wariatora z opóźnieniem, ścinając krawędzie zębów."],["Zużycie mosiężnych tulejek w karterze i pokrywie","Bendix opiera się w karterze oraz w pokrywie napędu na małych tulejkach ślizgowych z brązu. Wyrobienie tych tulejek powoduje przekoszenie osi bendixa pod obciążeniem i potężny metaliczny pisk."],["Serwis","Wymyj bendix w nafcie/zmywaczu, skontroluj stan sprężyny powrotnej. Wymień tulejki w pokrywie. Zęby wieńca i bendixa nasmaruj minimalną ilością suchego smaru teflonowego (PTFE) lub smaru litowego — nadmiar smaru natychmiast zanieczyści pasek napędowy!"]]},
  {"id":"variator_roller_flat_spots","title":"Wyraźna \"dziura\" w przyspieszeniu i spadek prędkości maksymalnej","tags":"rolki wariator płaskie ślizgi v-max dziura obroty","areas":[["Spłaszczone rolki wariatora (\"kwadratowe rolki\")","Rolki wariatora podczas pracy obracają się i przesuwają w bieżniach pod wpływem siły odśrodkowej. Po przebiegu 3000–6000 km powłoka teflonowa wyciera się w jednym punkcie, tworząc płaską powierzchnię. Gdy rolka zatrzyma się na ścięciu, wariator nie może płynnie wypchnąć paska na wyższe przełożenie."],["Wytarte ślizgi wariatora (trójkąciki)","Plastikowe ślizgi płytki oporowej stabilizują wariator na wielowypuście. Ich luz powoduje kantowanie się talerza wariatora i drgania."],["Wymiana","Zamontuj nowy komplet rolek o zalecanej masie i wymiarze (np. 15x12 mm dla Minarelli, 16x13 mm dla Piaggio/GY6, 19x17 mm dla 125cc). Bieżnie wariatora dokładnie wyczyść na sucho — NIGDY nie wolno smarować rolek ani bieżni smarem (zbiera pył i blokuje ruch)!"]]}
,
  {"id":"sheared_woodruff_key","title":"Ścięty klin koła magnesowego (Woodruff Key) — iskra jest, a nie odpala","tags":"klin wał magneto zapłon strzały iskra wydech gaźnik obrócone","areas":[["Mechanizm usterki","Koło magnesowe (wirnik zapłonu) jest osadzone na stożku wału korbowego, a mały klin ustalający (Woodruff key) ustala jego precyzyjną pozycję kątową względem czopa wału. Jeśli nakrętka magneta nie została dokręcona właściwym momentem (lub użyto starej nakrętki), siła bezwładności ścina klin. Koło obraca się na stożku o kilkadziesiąt stopni."],["Charakterystyczny objaw","Iskra na świecy jest idealna i silna, kompresja wysoka, paliwo dochodzi, a silnik w ogóle nie odpala lub podczas kręcenia gwałtownie strzela w wydech albo w filtr powietrza (\"odbija w kickstarter\"). Dzieje się tak, ponieważ iskra przeskakuje np. 60° po GMP zamiast 15° przed GMP!"],["Weryfikacja i naprawa","Odkręć nakrętkę koła magnesowego i zdejmij podkładkę. Obejrzyj rowek wpustowy wału i rowek koła. Jeśli rowki nie są w jednej linii — klin jest ścięty. Użyj ściągacza do magneta, usuń resztki starego klina, odtłuść stożki zmywaczem, zamontuj nowy hartowany klin i dokręć nakrętkę z podkładką sprężystą właściwym momentem (zwykle 35–45 Nm)."]]},
  {"id":"intake_manifold_crack","title":"Pęknięty gumowy króciec ssący (lewe powietrze pod obejmą)","tags":"króciec dolot guma pęknięcie lewe powietrze gaźnik wysokie obroty","areas":[["Objaw usterki","Silnik po nagrzaniu samoczynnie wkręca się na bardzo wysokie obroty lub obroty nie chcą opadać po puszczeniu manetki gazu. Mieszanka staje się skrajnie uboga, co grozi dziurą w tłoku (przegrzanie denka). Objaw często nasila się przy skręcaniu kierownicą lub wjechaniu na krawężnik (drgania silnika napinają króciec)."],["Ukryta natura mikropęknięć","Guma króćca pod wpływem benzyny, ciepła i promieniowania UV starzeje się i parcieje. Pęknięcia powstają najczęściej od spodu lub bezpośrednio pod metalową opaską zaciskową gaźnika i są całkowicie niewidoczne, dopóki nie odegnie się gaźnika ręką na boki!"],["Sposób kontroli","Na pracującym na wolnych obrotach silniku pędzelkiem nasączonym wodą z mydłem lub delikatnie preparatem do wykrywania nieszczelności nanieś płyn na gumę króćca. Jeśli obroty gwałtownie spadną lub silnik zmieni ton pracy — nieszczelność została zlokalizowana. Wymień króciec na nowy, sprawdzając także stan O-ringa uszczelniającego przy karterze."]]},
  {"id":"oil_pump_airlock_2t","title":"Zapowietrzony dozownik oleju 2T po zalaniu zbiornika lub remoncie","tags":"2t dozownik pompa oleju powietrze pęcherz odpowietrzenie zatarcie","areas":[["Śmiertelne niebezpieczeństwo dla nowego cylindra","Po spuszczeniu oleju, wymianie przewodów lub montażu nowego silnika w pompce dozownika oraz w wężyku zasilającym znajduje się powietrze. Pompka dozownika podaje mikroskopijne dawki (ułamki mililitra na minutę). Zanim pęcherz powietrza przepchnie się przez wężyk do gaźnika, silnik pracuje na czystej benzynie i ulega zatarciu w ciągu pierwszych 2–3 kilometrów!"],["Procedura odpowietrzania","Każda pompka dozownika (np. Mikuni w Minarelli czy Piaggio) posiada małą śrubkę odpowietrzającą M4/M5 na korpusie z czerwoną lub miedzianą podkładką. Należy odkręcić tę śrubkę o 2 obroty i poczekać, aż olej ze zbiornika zacznie wypływać czystym strumieniem bez żadnych bąbelków powietrza, po czym dokręcić śrubkę."],["Złota zasada pierwszego zbiornika","Do pierwszego zbiornika paliwa po remoncie ZAWSZE wlej wstępną mieszankę 1:50 (20 ml dobrego oleju 2T na 1 litr benzyny) bezpośrednio do baku! Zapewnia to 100% smarowania, dopóki układ dozownika nie zostanie w pełni zweryfikowany."]]},
  {"id":"coolant_airlock_lc","title":"Zapowietrzony układ chłodzenia po wymianie płynu (Silnik LC)","tags":"chłodzenie zapowietrzenie płyn wrzenie bąbel odpowietrznik głowica","areas":[["Poduszka powietrzna w głowicy","W skuterach chłodnica znajduje się z przodu czaszy, a silnik nisko z tyłu, połączony długimi przewodami biegnącymi w podłodze. Przy nalewaniu płynu do zbiorniczka w komorze głowicy cylindra zostaje uwięziony pęcherz powietrza. Ponieważ czujnik temperatury i wirnik pompy znajdują się w powietrzu zamiast w cieczy, pompa kręci się \"na sucho\", a głowica osiąga 130°C w 3 minuty mimo zimnej chłodnicy."],["Śruba odpowietrzająca głowicy","W silnikach takich jak Minarelli LC (Aerox) na szczycie głowicy obok świecy znajduje się mosiężna lub stalowa śrubka odpowietrzająca M6. Należy ją odkręcić podczas napełniania układu i zakręcić dopiero wtedy, gdy płyn chłodniczy zacznie z niej wypływać ciągłą strugą bez pęcherzy."],["Prawidłowa procedura","Zalewaj płyn powoli. Ugniataj ręką gruby dolny wąż chłodnicy. Odpowietrz głowicę śrubką. Uruchom silnik z otwartym korkiem zbiorniczka na 2 minuty na wolnych obrotach, obserwując czy po otwarciu termostatu poziom płynu lekko opadnie (uzupełnij do MAX)."]]},
  {"id":"vacuum_petcock_leak","title":"Pęknięta membrana kranika podciśnieniowego paliwa","tags":"kranik podciśnienie membrana zalewanie bak filtr gaźnik","areas":[["Niewidoczna droga zalewania silnika","Kranik podciśnieniowy posiada dwa wężyki: gruby (paliwowy do gaźnika) oraz cienki (podciśnieniowy do króćca dolotowego). Gdy gumowa membrana kranika pęknie, paliwo jest wysysane podciśnieniem prosto przez cienki wężyk wprost do gardzieli ssącej cylindra, całkowicie omijając gaźnik, pływak i dysze!"],["Typowe objawy","Świeca jest stale mokra, silnik zalewa się natychmiast po uruchomieniu, z wydechu kapie czarna maź benzynowa, a po zgaszeniu silnika benzyna spływa do skrzyni korbowej lub miski olejowej."],["Prosty test","Zdejmij cienki wężyk podciśnienia z króćca gaźnika. Jeśli w wężyku znajduje się benzyna lub po zassaniu strzykawką pojawia się w niej paliwo — kranik ma pękniętą membranę i nadaje się wyłącznie do wymiany."]]},
  {"id":"brake_switch_no_start","title":"Rozrusznik nie kręci, brak reakcji na przycisk START (Czujnik STOP)","tags":"stop klamka czujnik hamulec rozrusznik włącznik przekaźnik","areas":[["Blokada bezpieczeństwa rozruchu","W 99% skuterów układ elektryczny posiada zabezpieczenie: rozrusznik elektryczny zadziała TYLKO wtedy, gdy naciśnięta jest klamka hamulca lewego lub prawego. Prąd na cewkę przekaźnika rozrusznika płynie przez ten sam obwód, który zapala tylne światło STOP."],["Diagnoza w 5 sekund","Włącz stacyjkę i naciśnij klamkę hamulca przedniego, a następnie tylnego. Spójrz na tylną lampę. Jeśli światło STOP się NIE ŚWIECI — rozrusznik nie ma prawa zakręcić! Przyczyną nie jest rozrusznik ani akumulator, lecz zaśniedziały lub połamany mikroprzełącznik przy dźwigni hamulca."],["Naprawa","Zdejmij osłonę kierownicy, zsuń konektorki z czujnika klamki i zepnij je ze sobą na krótko kawałkiem drutu. Jeśli światło stop się zapali i rozrusznik natychmiast zakręci — wymień włącznik klamki (koszt kilka złotych)."]]},
  {"id":"timing_chain_slack_4t","title":"Wyciągnięty łańcuszek rozrządu i zacięty napinacz (Silnik 4T)","tags":"4t rozrząd łańcuszek napinacz grzechotanie znaki gmp przeskoczenie","areas":[["Hałas grzechotania z prawej strony cylindra","W silnikach 4T (GY6, Piaggio Leader, Honda eSP) łańcuszek rozrządu napędza wałek w głowicy. Gdy łańcuszek wyciągnie się ponad dopuszczalny limit lub automatyczny napinacz zębatkowy zatnie się w prowadnicy, łańcuch zaczyna uderzać o aluminiowe ścianki karteru, generując metaliczne grzechotanie nasilające się przy dodawaniu i odpuszczaniu gazu."],["Ryzyko przeskoczenia o ząb","Luźny łańcuszek przy gwałtownym hamowaniu silnikiem przeskakuje na zębatce wałka rozrządu o 1 lub 2 zęby. Silnik natychmiast traci moc, strzela w dolot, a w skrajnym przypadku tłok uderza w otwarte zawory, zginając trzonki zaworowe i niszcząc głowicę."],["Kontrola napinacza","Wykręć napinacz rozrządu (dwie śruby M6). Sprawdź na ile ząbków wysunął się trzpień. Jeśli napinacz wysunął się do samego końca skali (brak dalszego skoku napinania) — łańcuszek rozrządu jest wyciągnięty i bezwzględnie wymaga wymiany na nowy wraz ze ślizgami."]]},
  {"id":"fork_seal_leak_brakes","title":"Wyciek oleju z lag teleskopowych prosto na tarczę i klocki","tags":"zawieszenie lagi uszczelniacz olej hamulec klocki tarcza poślizg","areas":[["Zanik hamowania przedniego koła","Gdy gumowy uszczelniacz olejowy (simering) przedniego widelca teleskopowego popęka od brudu lub kamieni, olej hydrauliczny 10W/15W spływa po rurze widelca wprost na zacisk hamulcowy, tarcze i porowatą strukturę klocków hamulcowych. Skuteczność hamowania spada niemal do zera, klamka robi się twarda, a skuter nie zatrzymuje się."],["Zeszklone i zaolejone klocki","Okładziny cierne klocków wchłaniają olej hydrauliczny w głąb swojej struktury. Mycie zmywaczem do hamulców daje efekt tylko powierzchniowy — po rozgrzaniu olej ponownie wypływa na powierzchnię tarcia."],["Naprawa kompleksowa","1) Wymień uszczelniacze olejowe i pyłowe w obu lagach widelca (wypoleruj rury nośne drobnoziarnistym papierem 2000 z olejem, usuwając zadziory). 2) Zalej nową zalecaną ilość oleju do zawieszeń (Fork Oil). 3) Tarczę odtłuść zmywaczem, a zaolejone klocki hamulcowe bezwzględnie WYMIEŃ na nowe."]]},
  {"id":"injector_clogged_efi","title":"Zanieczyszczony wtryskiwacz benzyny (EFI) — uboga dawka i dławienie","tags":"wtrysk efi wtryskiwacz ciśnienie paliwo sitko myjka ultradźwięki","areas":[["Objawy zanieczyszczenia mikrootworów wtryskiwacza","Nowoczesne wtryskiwacze (np. Keihin w Hondzie/Yamaha czy Magneti Marelli w Piaggio) posiadają 4 do 10 mikroskopijnych otworków rozpylających paliwo na stożkową mgiełkę. Wytrącające się z benzyny żywice i osady zatykają część otworków. Zamiast idealnej mgiełki wtryskiwacz \"leje grubymi kroplami\" lub podaje za mało paliwa."],["Dławienie przy próbie ruszenia","Na biegu jałowym silnik może pracować względnie równo, ale przy gwałtownym dodaniu gazu w cylindrze powstaje chwilowa mieszanka skrajnie uboga (lambda > 1.3), powodując zduszenie silnika (\"dziura w gazie\")."],["Czyszczenie i test","Wyjmij wtryskiwacz, wymontuj mikrositko wstępne i umieść wtryskiwacz w myjce ultradźwiękowej z podaniem impulsów otwierających 12V (generator PWM). Sprawdź kształt stożka rozpylania. Zmierz rezystancję cewki wtryskiwacza (zwykle 10–14 Ω przy 20°C)."]]},
  {"id":"torque_driver_bearing_fail","title":"Chrobot i gwizd z tylnego napędu — zużyte łożysko korektora momentu","tags":"cvt korektor łożysko igiełkowe chrobot gwizd luz sprzęgło","areas":[["Łożysko igiełkowe i kulkowe w talerzu ruchomym korektora","Wewnątrz ruchomego koła pasowego korektora momentu (pod sprzęgłem) znajdują się dwa łożyska: igiełkowe oraz kulkowe zamknięte. Pracują one z ogromną prędkością obrotową podczas postoju na światłach (gdy wał silnika kręci się na jałowym, a koło stoi w miejscu). Brak smaru wysokotemperaturowego prowadzi do zatarcia igiełek."],["Rozpoznanie","Dźwięk szumu, chrobotu lub terkotania dobiega z tylnej części przekładni CVT przy pracującym silniku na postoju i ZANIKA natychmiast po ruszeniu ze świateł (gdy prędkość talerzy zrównuje się z prędkością wałka). Drugi test: zgaś silnik i zakręć tylnym kołem na stopce centralnej — opór lub szum wskazuje na korektor."],["Wymiana","Zdemontuj zespół sprzęgła, ściśnij sprężynę centralną, wyjmij kołki prowadzące korektora. Wymień oba łożyska i dwa wewnętrzne O-ringi uszczelniające. Zastosuj specjalny smar do korektorów momentu o podwyższonej odporności na siłę odśrodkową i temperaturę (np. Malossi MRG Grease)."]]},
  {"id":"transmission_oil_seal_am6","title":"Silnik 2T dymi na biało-szaro i ubywa oleju ze skrzyni (AM6 / D50B0)","tags":"2t am6 d50b0 uszczelniacz karter skrzynia olej dymienie gryzący","areas":[["Wyciek oleju przekładniowego przez prawy uszczelniacz wału","W silnikach z manualną skrzynią biegów prawy czop wału korbowego graniczy z komorą sprzęgła i kół zębatych zalaną 650–750 ml oleju silnikowego. Gdy prawy simering wału ulegnie stwardnieniu lub wyskoczy z gniazda, podciśnienie w karterze zasysa gęsty olej przekładniowy prosto pod tłok i do komory spalania."],["Charakterystyczne symptomy","1) Z wydechu wydobywa się potężna chmura gęstego, biało-szarego dymu o gryzącym, mdłym zapachu spalonego oleju przekładniowego (zupełnie inny zapach niż świeży olej 2T). 2) Świeca natychmiast zarasta mokrym, czarnym nagarem. 3) Po odkręceniu śruby kontrolnej poziomu oleju w skrzyni biegów stwierdza się znaczny ubytek płynu."],["Wymiana","Zdejmij prawą pokrywę silnika, zdemontuj kosz sprzęgła i koło zębate wału korbowego. Wydłub stary simering (zwróć uwagę na kierunek wargi uszczelniającej). Wbij nowy uszczelniacz wykonany z fluoroelastomeru (FKM/Viton), odporny na wysokie obroty i temperaturę."]]},
  {"id":"engine_mount_bushings_loose","title":"Skuter \"pływa\" w zakrętach, wrażenie pękniętej ramy lub odkręconego koła","tags":"zawieszenie tuleje wahacz silnik silentblock pływanie luz","areas":[["Wytłuczone tuleje metalowo-gumowe (Silentbloki) zawieszenia silnika","Cały zespół silnika wraz z przekładnią CVT stanowi jednocześnie wahacz tylnego koła, połączony z ramą potężną osią i dwiema tulejami metalowo-gumowymi (często z dodatkowym łącznikiem tzw. subframe). Po przebiegu 15 000–25 000 km guma wulkanizowana w tulejach parcieje i pęka."],["Niebezpieczne zachowanie na drodze","Przy wejściu w zakręt silnik przemieszcza się poprzecznie względem ramy o 1–3 cm! Kierowca ma wrażenie, jakby tylne koło było zupełnie bez powietrza lub odkręcone od osi, a skuter gwałtownie zmienia tor jazdy przy dodaniu i odjęciu gazu."],["Sprawdzenie luzu","Postaw skuter na stopce centralnej tak, aby tylne koło wisiało w powietrzu. Chwyć mocno za tylne koło lub obudowę filtra powietrza i szarpnij energicznie w bok (prostopadle do osi pojazdu). Jeśli w rejonie mocowania silnika wyczuwalny jest jakikolwiek stuk lub luz poprzeczny — silentbloki wymagają wymiany przy użyciu ściągacza tulei."]]},
  {"id":"brake_disc_warped_pulsing","title":"Pulsowanie dźwigni hamulca przedniego i szarpanie przodem skuterka","tags":"hamulec tarcza bicie zwichrowana klamka pulsowanie przegrzanie","areas":[["Zwichrowanie termiczne tarczy hamulcowej (Brake Disc Runout)","Podczas gwałtownego hamowania tarcza nagrzewa się do 250–400°C. Jeśli w tym momencie kierowca wjedzie w głęboką kałużę (szok termiczny) lub tarcza została dokręcona nierównomiernym momentem bez klucza dynamometrycznego, dochodzi do trwałego zwichrowania płaszczyzny tarczy."],["Objaw na klamce","Zwichrowana tarcza przy każdym obrocie koła odpycha tłoczek w zacisku hamulcowym, co powoduje wyczuwalne, rytmiczne pulsowanie (\"odpychanie\") klamki hamulca oraz poszarpywanie przodu skuterka tuż przed samym zatrzymaniem."],["Pomiar czujnikiem zegarowym","Zamocuj czujnik zegarowy na goleni widelca z końcówką opartą o bieżnię tarczy. Obracaj powoli kołem. Dopuszczalne bicie osiowe wynosi maksymalnie 0.10 mm (w sportowych 0.08 mm). Jeśli bicie przekracza 0.15 mm — tarcza kwalifikuje się do wymiany wraz z nowymi śrubami i podkładkami."]]},
  {"id":"flywheel_magnet_loose","title":"Odklejony magnes w kole zamachowym — chrobot i zniszczenie cewek statora","tags":"magneto koło zamachowe magnes odklejony stator chrobot szuranie","areas":[["Wada starszych i tuningowych kół magnesowych","W wielu kołach zamachowych magnesy stałe są wklejane od wewnątrz na żywicę epoksydową. Pod wpływem wibracji, uderzeń kluczem pneumatycznym lub starości klej puszcza. Luźny segment magnetyczny przesuwa się w stronę rdzenia statora pod wpływem siły odśrodkowej."],["Objawy katastrofy pod pokrywą","Początkowo słychać głośne tarcie/szuranie pod pokrywą magneta, nasilające się z obrotami. Jeśli silnik nie zostanie natychmiast zgaszony, obracający się odklejony magnes uderza w rdzenie cewek statora oraz czujnik impulsatora, ścinając uzwojenia i niszcząc cały stator na drobne kawałki."],["Naprawa","Zdejmij koło magnesowe ściągaczem. Obejrzyj wnętrze czaszy koła. Jeśli magnes jest pęknięty lub rusza się pod palcem — wymień koło na fabrycznie nowe lub koło z magnesem zalanym w jednolitej tulei stalowej. Dokładnie oczyść karter z opiłków neodymowych przed montażem nowego statora."]]},
  {"id":"fuel-pump-strainer-efi","title":"Zapchane sitko / filtr pompy paliwa w baku — dławienie przy odkręcaniu gazu w 4T na wtrysku","tags":"pompa paliwa wtrysk efi sitko filtr dławienie brak mocy zbiornik ciśnienie paliwa","category":"Wtrysk paliwa EFI","evidence":"confirmed","related":["fuel-starvation-high-rpm","efi-idle-surge"],"areas":[["Mechanizm usterki","W skuterach i motocyklach z wtryskiem paliwa (EFI) pompa zanurzona w zbiorniku posiada nylonowe sitko wstępne o mikroskopijnych oczkach. Brud, woda i osady z dna baku zatykają sitko, przez co pompa nie jest w stanie utrzymać wydatku i ciśnienia 2.5–3.0 bar przy otwarciu przepustnicy."],["Objawy w warsztacie","Silnik idealnie odpala i równo pracuje na wolnych obrotach, ale przy próbie ruszenia lub gwałtownym odkręceniu manetki dusi się, szarpie, strzela w dolot lub gaśnie. Na nóżce centralnej wkręca się, a pod obciążeniem traci siłę."],["Diagnostyka i pomiary","Wepnij manometr paliwowy z trójnikiem przed wtryskiwacz. Ciśnienie musi wynosić stabilne 2.8–3.2 bar zarówno na biegu jałowym, jak i przy pełnym otwarciu przepustnicy. Spadek ciśnienia poniżej 2.2 bar podczas przegazówki jednoznacznie wskazuje na zatkane sitko lub zużyty wirnik pompy."],["Naprawa","Zdemontuj moduł pompy ze zbiornika paliwa, wymyj bak z osadów, zdejmij i wyczyść sitko w myjce ultradźwiękowej lub wymień na nowe. Sprawdź szczelność wężyka karbowanego wewnątrz kosza pompy."]]},
  {"id":"valve-stem-seals-4t","title":"Zużyte uszczelniacze zaworowe — niebieski dym rano przy rozruchu, ubywanie oleju silnikowego","tags":"uszczelniacze zaworowe 4t niebieski dym rano dymienie olej ubywa nagar głowica","category":"Silnik 4T","evidence":"confirmed","related":["oil-smoke","compression-low"],"areas":[["Objaw zimnego rozruchu","Niebieskawy, gryzący dym z tłumika pojawia się natychmiast po uruchomieniu zimnego silnika po nocy i znika po 1–2 minutach pracy, gdy olej spłynie i dopali się w komorze."],["Dlaczego uszczelniacze zawodzą","Guma fluorowa lub silikonowa uszczelniaczy pod wpływem setek godzin pracy w temperaturze 130°C twardnieje, staje się krucha i traci wargę uszczelniającą trzonek zaworu. Po zgaszeniu silnika gorący rzadki olej spływa z klawiatury po trzonkach prosto do cylindra."],["Rozróżnienie od pierścieni tłokowych","Uszczelniacze zaworowe: dymi głównie po dłuższym postoju oraz przy gwałtownym puszczeniu gazu z wysokich obrotów (wysokie podciśnienie w dolocie zasysa olej po trzonku ssącym). Zużyte pierścienie: dymienie ciągłe, nasilające się pod obciążeniem pod górę wraz z przedmuchami do karteru."],["Wymiana","Wymiana uszczelniaczy nie wymaga demontażu cylindra — po podaniu sprężonego powietrza przez otwór świecy (blokada zaworów) można rozpiąć zamki zaworowe bez zdejmowania głowicy."]]},
  {"id":"spark-plug-cap-puncture","title":"Przebicie fajki świecy zapłonowej lub kabla WN — gaśnięcie w kałużach / wilgoci","tags":"fajka świecy kabel WN przebicie iskra wilgoć deszcz kałuża szarpie kopie prądem","category":"Elektryka i zapłon","evidence":"confirmed","related":["engine-dies-after-wash","spark-intermittent-bumps"],"areas":[["Objawy w deszczu","Pojazd jeździ bezbłędnie w suchy słoneczny dzień, ale wjechanie w kałużę, jazda w deszczu lub mycie myjką ciśnieniową powoduje nagłe dławienie, przerywanie lub całkowity zanik iskry aż do wyschnięcia."],["Mechanizm przebicia","Fajka świecy zapłonowej ma rezystor przeciwzakłóceniowy 5 kΩ wewnątrz bakelitowej lub gumowej obudowy. Mikropęknięcie obudowy w połączeniu z warstwą wilgoci i kurzu tworzy ścieżkę o niższym oporze niż szczelina świecy — wyładowanie 15–20 kV ucieka po zewnątrz prosto na żebra cylindra."],["Test w zaciemnionym garażu","Uruchom silnik w ciemnym garażu i spryskaj okolice fajki i przewodu WN mgiełką wody z atomizera. Jeśli widoczne są fioletowe wyładowania snopowe (iskry pełzające) lub silnik natychmiast zgaśnie, fajka ma permanentne przebicie."],["Rozwiązanie","Wymień fajkę na markową, wodoszczelną z podwójnymi wargami silikonowymi (np. NGK LB05F lub TB05EMA). Sprawdź stan przewodu WN wkręcanego w cewkę zapłonową."]]},
  {"id":"manifold-false-air-leak","title":"Pęknięty króciec ssący / fałszywe lewe powietrze — wiszące obroty jałowe, biała świeca","tags":"króciec ssący lewe powietrze obroty wiszą gaźnik uboga mieszanka przegrzewanie guma","category":"Paliwo i gaźnik","evidence":"confirmed","related":["idle-hangs-two-stroke","intake-high-idle"],"areas":[["Objaw zawieszania obrotów","Po odpuszczeniu gazu silnik nie schodzi od razu na wolne obroty, lecz zawiesza się na 3000–4000 obr/min przez kilka sekund, po czym powoli opada lub gaśnie."],["Przyczyna w gumowym króćcu","Króciec łączący gaźnik z głowicą (4T) lub zaworem membranowym (2T) pracuje pod ciągłym obciążeniem wibracyjnym. Guma parcieje od benzyny i pęka na załamaniach od spodu — pęknięcie rozwiera się pod wpływem ruchów silnika na wahaczu."],["Zagrożenie zatarciem","Lewe powietrze drastycznie zuboża mieszankę paliwowo-powietrzną. W silniku 2T oznacza to natychmiastowy brak smarowania i stopienie denka tłoka w ciągu kilkunastu minut szybkiej jazdy."],["Szybki test szczelności","Na pracującym silniku na wolnych obrotach psiknij zmywaczem do hamulców lub pędzelkiem nanieś benzynę na gumowy króciec. Jeśli obroty natychmiast wzrosną lub silnik się przydławi — nieszczelność jest zlokalizowana."]]},
  {"id":"cooling-airlock-bleed-lc","title":"Zapowietrzony układ chłodzenia cieczą (LC) — gotowanie w zbiorniczku, zimna chłodnica","tags":"chłodzenie ciecz LC gotowanie zapowietrzenie odpowietrznik pompa wody temperatura korek","category":"Chłodzenie","evidence":"confirmed","related":["coolant-overheating","coolant-loss"],"areas":[["Typowy błąd po wymianie płynu","Po zalaniu nowego płynu chłodniczego do zbiornika wyrównawczego pęcherz powietrza zostaje uwięziony w głowicy cylindra. Pompa wody nie jest w stanie przetłoczyć poduszki powietrznej."],["Objawy awarii","Wskaźnik temperatury lub kontrolka przegrzania wchodzi na czerwone pole po 3 minutach pracy, płyn w zbiorniczku gwałtownie bulgocze i wywala korkiem, a przednia chłodnica i dolny wąż pozostają całkowicie zimne!"],["Procedura odpowietrzania","Układ chłodzenia w skuterach LC MUSI być odpowietrzany dedykowaną śrubą na szczycie głowicy cylindra (zwykle śruba M6 z mosiężną podkładką). Odkręcaj śrubę powoli przy pracującym silniku, aż wypłynie jednolity strumień płynu bez pęcherzyków piany."],["Weryfikacja","Oba węże dochodzące do chłodnicy muszą stać się równomiernie gorące po otwarciu termostatu (ok. 75–85°C)."]]},
  {"id":"starter-bendix-grind","title":"Zużyty bendix rozrusznika — metaliczny zgrzyt bez obracania wałem korbowym","tags":"bendix rozrusznik zgrzyt ślizga się nie kręci wałem wieniec zębatka cvt","category":"Elektryka i rozruch","evidence":"confirmed","related":["starter-spins-no-crank","starter-clicks"],"areas":[["Objaw zgrzytu","Po wciśnięciu przycisku START słychać głośny, metaliczny zgrzyt, terkotanie lub świst szybko kręcącego się silniczka elektrycznego, ale silnik spalinowy nie wykonuje ani jednego obrotu."],["Mechanizm bendixa","Sprzęgiełko jednokierunkowe (Bendix) wysuwa się po gwincie śrubowym pod wpływem siły bezwładności i zazębia z wieńcem wariatora. Zużycie rolek sprzęgła jednokierunkowego, pęknięta sprężynka lub zalepienie starym pyłem z paska CVT powoduje uślizg rolek na bieżni."],["Inspekcja wieńca zębatego","Zdejmij pokrywę napędu CVT. Sprawdź stan zębów na wieńcu wariatora — wyłamane lub zaokrąglone zęby uniemożliwią zazębienie nowego bendixa."],["Regeneracja i montaż","Wymyć bendix w benzynie ekstrakcyjnej i sprawdzić, czy mechanizm blokuje się natychmiast w jednym kierunku, a w drugim obraca lekko. Tulejki montażowe w karterze i pokrywie CVT nasmarować minimalną ilością smaru miedziowego/syntetycznego (nadmiar smaru chwyta pył z paska!)."]]},
  {"id":"clutch-pads-glazed-cvt","title":"Zeszklone okładziny sprzęgła odśrodkowego — wycie silnika i silne szarpanie przy ruszaniu","tags":"sprzęgło cvt zeszklone szarpanie dzwon przegrzany wibracje ruszanie okładziny","category":"CVT i napęd","evidence":"confirmed","related":["revs_no_speed","clutch-bell-blue"],"areas":[["Objaw szarpania (judder)","Podczas ruszania z miejsca skuter wpada w silne wibracje, szarpie całym nadwoziem i piszczy, a płynne powolne toczenie się w korku jest niemożliwe."],["Zeszlenie okładzin ciernych","Długotrwała jazda na półsprzęgle pod górę lub z pasażerem rozgrzewa sprzęgło powyżej 250°C. Żywica wiążąca okładziny wytapia się i tworzy na powierzchni gładką, szklistą warstwę o znikomym współczynniku tarcia."],["Fioletowy dzwon sprzęgła","Niebieskie lub fioletowe przebarwienia na zewnętrznej powierzchni dzwonu świadczą o przegrzaniu stali i możliwym zwichrowaniu (utracie geometrii kołowej dzwonu)."],["Regeneracja warsztatowa","Zmatowić okładziny cierne gruboziarnistym papierem ściernym (P80–P120), przeczyścić rowki odprowadzające pył brzeszczotem. Wewnętrzną powierzchnię dzwonu odtłuścić i przeszlifować na krzyż. Jeśli dzwon ma bicie osiowe/promieniowe >0.15 mm — bezwzględna wymiana."]]},
  {"id":"clutch-shoe-spring-broken","title":"Pęknięta sprężynka szczęki sprzęgła CVT — skuter natychmiast rusza po odpaleniu","tags":"sprężynka sprzęgła pęknięta rusza sam gaśnie na hamulcu wolne obroty cvt","category":"CVT i napęd","evidence":"confirmed","related":["cvt-no-engage","rear-wheel-binding"],"areas":[["Objaw usterki","Skuter odpalony na nóżce centralnej natychmiast kręci tylnym kołem z pełną siłą na wolnych obrotach. Po postawieniu na koła pojazd sam wyrywa do przodu, a wciśnięcie hamulca dusi i natychmiast gasi silnik."],["Przyczyna mechaniczna","Jedna z trzech małych sprężynek powrotnych szczęk sprzęgła odśrodkowego pękła ze zmęczenia materiału. Bez przeciwdziałania sprężynki siła odśrodkowa (lub nawet grawitacja) dociska pojedynczą szczękę do dzwonu już przy 1200 obr/min."],["Diagnostyka","Po zdjęciu dzwonu sprzęgła jedna ze szczęk luźno lata w dłoni bez jakiegokolwiek oporu sprężyny."],["Wymiana","Wymieniać ZAWSZE komplet 3 sprężynek na nowe o identycznej twardości (kolorze), aby zapewnić zrównoważone załączanie napędu bez bicia."]]},
  {"id":"drive-chain-shark-teeth","title":"Wyciągnięty łańcuch napędowy i zębatki „rekinie zęby” — przeskakiwanie pod obciążeniem","tags":"łańcuch zębatki rekinie zęby przeskakuje naciąg luz stuki napęd","category":"Napęd łańcuchowy","evidence":"confirmed","related":["chain-noise","gear-jumps"],"areas":[["Objawy wyeksploatowania","Metaliczne strzały i przeskakiwanie napędu przy gwałtownym dodaniu gazu na 1. i 2. biegu, nierównomierny naciąg łańcucha podczas obracania kołem (w jednym punkcie napięty jak struna, w innym wisi)."],["Profil zębów rekina","Zużyta zębatka zdawcza i tylna traci symetryczny kształt zębów — zęby pochylają się w kierunku obrotu, przypominając płetwy rekina. Na takiej zębatce rolki łańcucha wspinają się na wierzchołki pod obciążeniem."],["Test odciągania łańcucha","Chwyć łańcuch na tylnej zębatce na godzinie 3:00 i pociągnij poziomo do tyłu. Jeśli odsłania się więcej niż pół wysokości zęba zębatki — zestaw napędowy kwalifikuje się do natychmiastowej wymiany."],["Zasada bezpieczeństwa","NIGDY nie wymieniaj samego łańcucha na stare zębatki (lub odwrotnie)! Nowy łańcuch dopasuje się do zjechanych zębów i zniszczy w 500 km. Wymieniaj zawsze komplet: łańcuch + zębatka przód + zębatka tył."]]},
  {"id":"vacuum-petcock-fuel-in-oil","title":"Pęknięta membrana kranika podciśnieniowego — benzyna spływa do oleju silnikowego 4T","tags":"kranik podciśnieniowy membrana benzyna w oleju rzadki olej poziom rośnie kranik","category":"Paliwo i gaźnik","evidence":"confirmed","related":["vacuum-petcock-diaphragm","oil-leak-crankcase"],"areas":[["Objaw wysokiego poziomu oleju","W silniku 4T poziom na bagnecie olejowym nagle podnosi się ponad stan MAX, a olej jest rzadki jak woda i intensywnie pachnie surową benzyną."],["Skąd benzyna w karterze","Gdy pęknie mikrogumowa membrana kranika podciśnieniowego, paliwo jest zasysane pod ciśnieniem bezpośrednio przez cienki wężyk podciśnienia do króćca ssącego, zalewa komorę spalania na postoju i przez pierścienie spływa prosto do miski olejowej."],["Śmiertelne zagrożenie dla silnika","Olej rozcieńczony benzyną traci film smarny — jazda w takim stanie prowadzi do zatarcia panewek, czopów wału korbowego i łożysk w ciągu 10 km!"],["Test kranika","Zdejmij wężyk podciśnieniowy z króćca gaźnika. Jeśli wypływa z niego chociaż jedna kropla benzyny — kranik ma pękniętą membranę i natychmiast kwalifikuje się do wymiany. Po naprawie obowiązkowa wymiana oleju i filtra!"]]},
  {"id":"wheel-bearing-hub-play","title":"Luz i szum łożysk koła — niestabilność w zakręcie, ocieranie tarczy hamulcowej o klocki","tags":"łożysko koła luz szum buczenie tarcza ociera klamka miękka piasta","category":"Podwozie i hamulce","evidence":"confirmed","related":["wheel-bearing","warped-brake-disc-pulsing"],"areas":[["Objawy podczas jazdy","Pływanie pojazdu w zakrętach, wrażenie jakby tylne koło było przebite mimo prawidłowego ciśnienia, głuche huczenie wzrastające wraz z prędkością."],["Objaw hamulcowy (rozpychanie klocków)","Luz boczny koła powoduje, że tarcza hamulcowa kołysze się na boki i rozpycha klocki w zacisku. Skutek: pierwsze naciśnięcie klamki hamulca wpada miękko do samej manetki, a dopiero drugie hamuje normalnie!"],["Sprawdzanie na podnośniku","Złap koło oburącz na godzinie 12 i 6 i energicznie poruszaj na przemian. Wyczuwalny jakikolwiek stuk lub luz poprzeczny oznacza wybite łożyska kulkowe piasty."],["Wymiana","Wymieniać zawsze parę łożysk na osi wraz z nowymi uszczelniaczami wargowymi (simeringami piasty) chroniącymi przed wodą z myjki."]]},
  {"id":"stator-charge-coil-ground-short","title":"Zwarcie uzwojenia ładowania statora do masy — grzejący się regulator, brak ładowania","tags":"stator ładowanie zwarcie do masy cewki regulator gorący akumulator rozładowany","category":"Elektryka i ładowanie","evidence":"confirmed","related":["charging-no-rise","charging-overvoltage"],"areas":[["Objaw braku prądu","Akumulator rozładowuje się po 2 dniach jazdy, napięcie na zaciskach na obrotach nie przekracza 12.2 V, a regulator napięcia po 5 minutach jest tak gorący, że parzy w palce."],["Zwarcie termiczne w statorze","Drut nawojowy cewek ładowania pod wpływem wibracji i temperatury przeciera emalię izolacyjną o rdzeń stojana, powodując zwarcie fazy ładowania do masy silnika."],["Test multimetrem na odłączonej wtyczce statora","1. Zmierz rezystancję między żółtymi przewodami (powinno być 0.4–1.2 Ω). 2. NAJWAŻNIEJSZE: Zmierz oporność między każdym żółtym przewodem a masą silnika! Multimetr MUSI pokazać całkowity brak przejścia (OL / nieskończoność). Jakakolwiek wartość poniżej 1 MΩ oznacza przebicie statora do masy."],["Wymiana","Wymiana statora na nowy. Sprawdź czy kable nie zostały przycięte pod pokrywą magneta."]]},
  {"id":"throttle-cable-frayed-sticking","title":"Postrzępiona linka gazu blokująca się w pancerzu — niebezpieczne wiszenie obrotów","tags":"linka gazu zacięta pancerz przepustnica nie odbija wisi gaz wypadek bezpieczeństwo","category":"Paliwo i gaźnik","evidence":"confirmed","related":["intake-high-idle","idle-hangs-two-stroke"],"areas":[["Śmiertelne niebezpieczeństwo","Zacięcie linki gazu w pozycji otwartej podczas dojeżdżania do skrzyżowania uniemożliwia wyhamowanie pojazdu ze sprzęgłem odśrodkowym CVT (silnik ciągnie mimo hamowania)."],["Mechanizm zacierania","Pojedynczy pęknięty drucik splotu stalowej linki zwija się w pancerzu w sprężynkę, która blokuje ruch powrotny pod wpływem słabej sprężyny przepustnicy gaźnika."],["Test bezpieczeństwa (kliknięcie)","Odkręć manetkę do końca i gwałtownie puść dłoń — manetka MUSI natychmiast z impetem uderzyć w zderzak, a w gaźniku musi być słyszalne wyraźne, metaliczne 'klik' uderzenia przepustnicy o śrubę wolnych obrotów. Jeśli powrót jest leniwy lub manetka zostaje — zakaz jazdy!"],["Wymiana","Wymiana kompletnego wkładu linki z pancerzem teflonowym. Nie naprawiać postrzępionej linki prowizorycznie."]]},
  {"id":"head-gasket-hydro-lock","title":"Wydmuchana uszczelka pod głowicą LC — płyn chłodniczy w cylindrze, zablokowany wał (hydro-lock)","tags":"uszczelka głowicy płyn chłodniczy hydro-lock zablokowany rozrusznik nie kręci biały dym","category":"Silnik / chłodzenie","evidence":"confirmed","related":["coolant-loss","compression-low"],"areas":[["Objaw zablokowania obrotu","Rozrusznik po nocy robi pół obrotu i staje z głuchym uderzeniem, kopniak jest twardy jak zaspawany. Po wykręceniu świecy z otworu tryska fontanna płynu chłodniczego, a wał natychmiast zaczyna obracać się lekko."],["Zjawisko hydro-locka","Ciecz jest nieściśliwa. Gdy przez uszkodzoną uszczelkę płyn chłodniczy napełni komorę spalania na postoju, tłok idący w górę zapiera się o słup wody, co grozi wygięciem korbowodu przy próbach odpalania na siłę!"],["Dodatkowe objawy podczas pracy","Potężne kłęby gęstego, słodko pachnącego białego dymu z rury wydechowej oraz wyrzucanie płynu przez korek zbiorniczka wyrównawczego pod wpływem ciśnienia sprężania."],["Naprawa","Wymiana uszczelki głowicy oraz obowiązkowe splanowanie przylgni głowicy na płycie traserskiej z papierem ściernym."]]},
  {"id":"clogged-tank-vent-vacuum","title":"Zatkane odpowietrzenie korka wlewu paliwa — silnik gaśnie po 2 km, głośny syk przy otwieraniu baku","tags":"odpowietrzenie korek paliwa podciśnienie w baku gaśnie po 2 km syk kranik","category":"Paliwo i gaźnik","evidence":"confirmed","related":["fuel-starvation","fuel-starvation-high-rpm"],"areas":[["Charakterystyczny objaw dystansu","Pojazd rusza z pełną mocą, jedzie idealnie przez około 1.5–3 km, po czym zaczyna słabnąć, dławić się i gaśnie. Po 5 minutach postoju znów odpala na dotyk i gaśnie po kolejnych 2 kilometrach."],["Zjawisko próżni w zbiorniku","W miarę zużywania benzyny w szczelnym zbiorniku bez odpowietrzenia powstaje podciśnienie. Gdy siła podciśnienia zrówna się z ciśnieniem hydrostatycznym słupa paliwa, benzyna przestaje spływać do gaźnika mimo pełnego baku."],["Błyskawiczny test diagnostyczny","W chwili gdy silnik zgaśnie na trasie, natychmiast otwórz korek wlewu paliwa. Jeśli usłyszysz głośny, wyraźny syk zasysanego powietrza (jak przy otwieraniu puszki kawy próżniowej), a silnik po zakręceniu od razu zapali — diagnoza jest w 100% pewna."],["Rozwiązanie","Udrożnij zaworek labiryntowy w korku wlewu paliwa lub przedmuchaj gumowy wężyk odpowietrzenia biegnący pod owiewkami."]]},
  {"id":"killswitch_safety_diode","title":"Dioda logiczna obwodu rozruchu uszkodzona — rozrusznik kręci tylko na biegu","tags":"dioda instalacja neutral luz klamka stacyjka zabezpieczenie","areas":[["Rola diody separującej w instalacji","W skuterach i motocyklach z manualną skrzynią (np. TZR, RS, Senda) w wiązce elektrycznej znajduje się mała dioda prostownicza (Interlock Diode) w obudowie bezpiecznika lub pod taśmą wiązki. Oddziela ona obwód czujnika biegu jałowego (luz N), czujnika sprzęgła i stopki bocznej, aby masa z jednego czujnika nie wracała na inne kontrolki."],["Dziwne zachowanie instalacji","Gdy dioda ulegnie przebiciu (zwarcie w obie strony) lub przepaleniu: rozrusznik kręci tylko przy wciśniętym sprzęgle mimo wrzuconego luzu, kontrolka luzu żarzy się przy wciskaniu sprzęgła lub silnik gaśnie po wrzuceniu jedynki mimo złożonej stopki bocznej."],["Test multimetrem","Znajdź diodę blokad w skrzynce bezpieczników lub przy module. Przełącz multimetr w tryb testu diody. W jednym kierunku miernik powinien pokazać spadek napięcia 0.5–0.7 V, a po odwróceniu sond nieskończoność (OL). Jakikolwiek inny wynik (0.00 V zwarcie lub OL w obie strony) oznacza uszkodzenie diody."]]}
,
{
    id: "ground_strap_voltage_drop",

      ["Objawy w warsztacie", "Rozrusznik kręci ciężko i powoli, jakby akumulator był rozładowany, mimo że na klemach jest 12.8 V. Podczas próby rozruchu kontrolki na liczniku przygasają prawie do zera, a przewód ssania lub linka gazu robi się gorąca (prąd rozruchowy 40A szuka alternatywnej drogi masowej przez pancerz linki!)."],
      ["Przyczyna usterki", "Silnik skutera zawieszony jest na gumowych tulejach (silentblockach), które izolują go elektrycznie od ramy. Jedynym połączeniem masowym jest przewód oczkowy lub miedziana plecionka przykręcona do karteru. Wypłukanie smaru, sól drogowa i korozja śruby powodują oporność styku rzędu 0.5–2 Ω, co przy prądzie rozruchu generuje spadek nawet 8–10 V!"],
      ["Procedura pomiaru multimetrem (Test spadku napięcia)", "Ustaw multimetr na zakres 20 V DC. Czarną sondę przyłóż do ujemnego bieguna akumulatora, a czerwoną bezpośrednio do czystego metalu bloku silnika (np. śruba pokrywy wariatora). Wciśnij przycisk rozrusznika. Odczyt: spadek napięcia podczas kręcenia nie może przekraczać 0.20–0.30 V. Jeśli miernik wskazuje 1.5 V, 3.0 V lub więcej — masa silnika jest skorodowana lub urwana."],
      ["Rozwiązanie", "Odkręć kabel masowy, przeszlifuj oczko i gniazdo w karterze papierem ściernym do czystego aluminium, przesmaruj wazeliną techniczną lub smarem miedzianym i mocno dokręć. Najlepsza praktyka warsztatowa: dołożenie dodatkowego przewodu masowego 4–6 mm² bezpośrednio z minusa akumulatora pod śrubę rozrusznika."]
    ]
  },
  {

    areas: [

      ["Mechanizm działania gaźnika CV", "W gaźnikach stałopodciśnieniowych (Constant Velocity - Keihin CVK, chińskie GY6 4T) linka gazu otwiera tylko przepustnicę motylkową. Główna przepustnica tłoczkowa z iglicą unosi się pod wpływem podciśnienia wytwarzanego nad gumową membraną. Gdy w gumie pojawi się mikrodziurka o średnicy 0.5 mm, podciśnienie ucieka i tłoczek z iglicą nie podnosi się w górę, nie dawkując paliwa z dyszy głównej."],
      ["Weryfikacja uszkodzenia", "Odkręć górny czarny/metalowy dekielek gaźnika (uważaj na sprężynę powrotną). Wyjmij membranę z tłoczkiem. Rozciągnij delikatnie gumę palcami i obejrzyj ją pod mocne światło lampy warsztatowej. Szukaj pęknięć w załamaniach fałdy. Drugi test: wsuń tłoczek palcem do góry i zatkaj palcem górny otwór podciśnieniowy na wlocie gaźnika — sprawny tłoczek powinien opadać powoli z oporem poduszki powietrznej."],
      ["Rozwiązanie", "Wymiana membrany na nową (koszt 15–25 zł). Upewnij się, że występ ustalający (języczek) membrany idealnie leży w rowku korpusu gaźnika przed dokręceniem dekielka — przycięcie rantu to najczęstszy błąd montażowy."]
    ]

  {
    id: "variator_sliders_wear",

    tags: "slizgi wariator cvt trojkaty dzwonienie naped pasek szarpanie luz plytka dociskowa",
    areas: [

      ["Przyczyna", "Trzy plastikowe ślizgi (prowadnice trójkątne) stabilizują stalową płytkę dociskową wariatora na aluminiowych prowadnicach korpusu. Po przebiegu 5000–8000 km plastik wyciera się, tworząc luz roboczy. Płytka zaczyna dzwonić o krawędzie wariatora, a pod obciążeniem kosi się i zacina, blokując płynny ruch rolek."],

      ["Rozwiązanie", "Wymiana kompletu 3 ślizgów (koszt 8–15 zł). Przy montażu nie stosować żadnego smaru (wariator pracuje na sucho, smar przyciąga pył z paska tworząc pastę ścierną)."]

      ["Objawy w warsztacie", "Silnik 2T (Minarelli, Piaggio, Peugeot) ma ogromne problemy z rozruchem, zwłaszcza po krótkim postoju. Z wlotu gaźnika cofa się mgła paliwowa, która zalewa wkład filtra powietrza czarną mieszanką benzyny z olejem. Brak stabilnych obrotów jałowych — silnik albo gaśnie, albo wymaga wkręcenia śruby obrotów do oporu."],
      ["Przyczyna", "Zawór membranowy (zawór płytkowy) pełni rolę jednokierunkowego zaworu ssącego silnika dwusuwowego. Wskutek zmęczenia materiału płytki (stalowe, z włókna szklanego lub karbonowe) odkształcają się, pękają na krawędzi lub tracą sprężystość, pozostawiając szczelinę 0.2–0.5 mm w stanie spoczynku. Podczas ruchu tłoka w dół sprężana w karterze mieszanka cofa się z powrotem przez gaźnik do filtra."],
      ["Test szczelności zaworu", "Zdemontuj króciec i wyjmij zawór membranowy. Spójrz przez niego pod mocne światło lampy — między płytkami a gumowanym korpusem nie może być ANI JEDNEJ szczeliny świetlnej! Drugi test: przyłóż usta do wlotu zaworu i zaciągnij powietrze — zawór powinien natychmiast się przyssać i utrzymać podciśnienie."],
      ["Naprawa", "Wymiana płytek membranowych (karbonowe Stage6/Malossi 0.30 lub 0.35 mm dla serii i sportu). Obrócenie wygiętej płytki na drugą stronę to patent wyłącznie na awaryjny dojazd, gdyż odwrócone naprężenia doprowadzą do jej odłamania i wpadnięcia fragmentu pod tłok."]

    areas: [
      ["Objawy usterki", "Po wciśnięciu przycisku START słychać głośny, wysoki świst silnika elektrycznego rozrusznika, ale wał korbowy nie wykonuje ani jednego obrotu. Czasami bendix zazębia dopiero po 3–4 próbach z głośnym metalicznym zgrzytem."],
      ["Zasada działania i usterka", "Bendix rozrusznika (zespół sprzęgający) działa bezwładnościowo: spiralny wielowypust pod wpływem nagłego obrotu wirnika wyrzuca zębatkę w stronę wieńca zębatego wariatora. Wewnątrz znajduje się sprzęgło jednokierunkowe rolkowe chroniące rozrusznik przed obrotami odpalanego silnika. Nagromadzony pył ze startego paska napędowego miesza się ze smarem, tworząc gęstą maź blokującą wyrzut zębatki na osi."],
      ["Diagnostyka w warsztacie", "Zdejmij pokrywę napędu. Wyjmij bendix i sprawdź ręką, czy zębatka wysuwa się płynnie i bez zacięć po energicznym skręceniu palcami. Następnie chwyć za małą zębatkę kombinerkami: w jedną stronę powinna obracać się ze stałym oporem, a w drugą blokować na sztywno bez najmniejszego uślizgu. Jeśli ślizga się w obie strony — rolki wewnętrznego sprzęgła jednokierunkowego są zatarte lub popękały ich sprężynki."],

    ]

    areas: [

      ["Przyczyna", "Pompa wody w silnikach LC (np. Minarelli LC, Piaggio 2T/4T LC) uszczelniona jest za pomocą ceramiczno-węglowego uszczelniacza mechanicznego (Mechanical Seal). Po przegrzaniu, jeździe na czystej wodzie z kranu (kamień kotłowy) lub zużyciu łożysk wałka pompy, ceramiczne pierścienie ślizgowe pękają, a płyn pod ciśnieniem 1.0 bara przedostaje się wzdłuż wałka wprost do karteru."],

  {
    id: "pickup_coil_gap_fault",
    title: "Zbyt duża szczelina impulsatora zapłonu — silnik pali tylko z kopnika, brak iskry z rozrusznika",
    tags: "impulsator pickup szczelina stator iskrownik cewka iskra czujnik polozenia walu cdi",
    areas: [

      ["Fizyka zjawiska", "Impulsator (Pick-up coil) jest czujnikiem reluktancyjnym generującym impuls napięcia zmiennego w chwili przejścia wypustki na kole magnesowym. Napięcie generowane przez impulsator zależy wprost proporcjonalnie od prędkości obrotowej i odległości czujnika od wypustki. Przy rozruchu z rozrusznika wał kręci się wolno (ok. 350–450 rpm). Gdy szczelina jest zbyt duża (>0.8 mm), wygenerowany impuls ma zaledwie 0.3 V — moduł CDI go nie wykrywa. Kopniak daje chwilowo 800 rpm i wyższy impuls 1.2 V, dlatego odpala."],
      ["Pomiar szczelinomierzem", "Zdejmij osłonę magneta. Obróć wał tak, by metalowy wypust (znacznik) koła magnesowego znalazł się dokładnie naprzeciw rdzenia impulsatora. Wsuń niemagnetyczny szczelinomierz listkowy. Prawidłowa szczelina: 0.35–0.50 mm. Jeśli szczelina wynosi 0.9–1.2 mm, impulsator jest odsunięty."],

      ["Przyczyna", "Pływak gaźnika unosi się wraz z poziomem paliwa i za pośrednictwem małego zaworka iglicowego z gumowym stożkiem (Viton) zamyka dopływ benzyny z baku. Zacięcie następuje wskutek: 1. Ziarenka piasku lub rdzy ze zbiornika, które wpadło w gniazdo zaworka, 2. Odkształcenia gumowego stożka iglicy (rowek wytarty od drgań), 3. Rozszczelnienia plastikowego pływaka (paliwo wlewa się do środka pływaka i tonie na dnie komory)."],

    areas: [

      ["Zasada działania SAS/PAIR", "Układ Secondary Air System (SAS / PAIR) wdmuchuje świeże powietrze z filtra do kanału wydechowego głowicy, aby dopalić niespalone węglowodory (HC) pod kątem norm emisji spalin. W momencie gwałtownego hamowania silnikiem podciśnienie w dolocie powinno ZAMKNĄĆ membranowy zawór odcięcia powietrza (Air Cut-off Valve). Gdy sparciała membrana pęknie, świeże powietrze jest zasysane do wydechu w sposób ciągły. Wzbogacona mieszanka przy puszczeniu gazu w kontakcie z tlenem gwałtownie eksploduje w kolanku wydechu."],

    areas: [

      ["Działanie czujnika ECT", "Czujnik temperatury silnika/cieczy (Engine Coolant Temperature) jest termistorem NTC (Negative Temperature Coefficient) — jego rezystancja maleje wraz ze wzrostem temperatury. Gdy czujnik zawiesi się na stałej wartości np. 80°C (zwarcie wewnętrzne), sterownik ECU myśli, że silnik jest gorący i nie zwiększa dawki rozruchowej ani kąta wyprzedzenia zapłonu na zimno."],

      ["Przyczyna", "W układach trójfazowych (statory 8, 11 i 12-cewkowe z trzema żółtymi przewodami) napięcie generowane jest między fazami w układzie gwiazdy lub trójkąta. Żadne uzwojenie stojana roboczego nie może mieć kontaktu z masą (karterem!). Wskutek wibracji i temperatury lakier izolacyjny na jednym z karkasów przeciera się i dotyka żelaznego rdzenia stojana. Powoduje to zwarcie jednej trzeciej mocy prądnicy i przegrzewanie regulatora napięcia."],

function pinKey(d){
  if(d==='⌫'){ pinEntry = pinEntry.slice(0,-1); showLock(); return; }
  pinEntry = (pinEntry + d).slice(0,4);
  if(pinSetupStep==='new'){
    if(pinEntry.length===4){ pinSetupFirst=pinEntry; pinEntry=''; pinSetupStep='confirmNew'; }

let _vinScanStream = null;
let _vinScanAnimFrame = null;
let _vinScanActiveTargetId = null;

  }

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

        <div style="position:absolute;top:20%;left:8%;right:8%;bottom:20%;border:2px dashed #00e5ff;border-radius:6px;pointer-events:none;box-shadow:0 0 10px rgba(0,229,255,0.4)">
          <div style="width:100%;height:2px;background:#ff0055;position:absolute;top:50%;box-shadow:0 0 8px #ff0055"></div>
        </div>
      </div>
      <div id="vinScanStatus" style="font-size:12px;text-align:center;color:var(--hero);min-height:20px;margin-bottom:10px">Uruchamianie aparatu...</div>
      <div style="display:flex;gap:8px">
        <label class="btn" style="flex:1;margin:0;font-size:12px;text-align:center;padding:8px;background:#222;border-color:var(--border);cursor:pointer">
          📁 Wybierz zdjęcie
          <input type="file" accept="image/*" capture="camera" style="display:none" onchange="scanVinFromFileInput(this)">
        </label>
        <button type="button" class="btn" style="flex:1;margin:0;font-size:12px;padding:8px;border-color:#ff6b6b;color:#ff6b6b" onclick="closeVinScanModal()">Zamknij</button>
      </div>
    </div>
  `;
  modal.style.display = 'flex';

  const video = document.getElementById('vinScanVideo');
  const status = document.getElementById('vinScanStatus');

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(status) status.innerHTML = '⚠️ Brak bezpośredniego dostępu do kamery w przeglądarce. Użyj przycisku „Wybierz zdjęcie”.';
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      _vinScanStream = stream;
      if(video){
        video.srcObject = stream;
        video.play();
        if(status) status.textContent = 'Nakieruj czerwoną linię na kod kreskowy lub VIN...';
        initBarcodeScanLoop(video, status);
      }
    })
    .catch(err => {
      console.warn('Camera access rejected or unavailable:', err);
      if(status) status.innerHTML = '⚠️ Nie uzyskano uprawnień do kamery. Kliknij „Wybierz zdjęcie” poniżej.';
    });
}

function initBarcodeScanLoop(video, statusEl){
  if(!('BarcodeDetector' in window)){
    if(statusEl) statusEl.innerHTML = 'Wskazówka: skieruj na kod lub użyj „Wybierz zdjęcie”.';
    return;
  }
  const detector = new window.BarcodeDetector({ formats: ['code_39', 'code_128', 'qr_code', 'ean_13', 'data_matrix'] });

  async function scanFrame(){
    if(!_vinScanStream || !video || video.readyState < 2){
      _vinScanAnimFrame = requestAnimationFrame(scanFrame);
      return;
    }
    try{
      const barcodes = await detector.detect(video);
      if(barcodes && barcodes.length > 0){
        for(const b of barcodes){
          const raw = (b.rawValue || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
          if(raw.length >= 6){
            onVinDetected(raw);
            return;
          }
        }
      }
    }catch(_){}
    _vinScanAnimFrame = requestAnimationFrame(scanFrame);
  }
  _vinScanAnimFrame = requestAnimationFrame(scanFrame);
}

function scanVinFromFileInput(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const status = document.getElementById('vinScanStatus');
  if(status) status.textContent = 'Przetwarzanie zdjęcia...';
  const reader = new FileReader();
  reader.onload = async (e) => {
    const img = new Image();
    img.onload = async () => {
      if('BarcodeDetector' in window){
        try{
          const detector = new window.BarcodeDetector({ formats: ['code_39', 'code_128', 'qr_code', 'ean_13', 'data_matrix'] });
          const barcodes = await detector.detect(img);
          if(barcodes && barcodes.length > 0){
            for(const b of barcodes){
              const raw = (b.rawValue || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
              if(raw.length >= 6){
                onVinDetected(raw);
                return;
              }
            }
          }
        }catch(_){}
      }
      const manual = prompt('Wpisz lub potwierdź numer VIN ze zdjęcia:', '');
      if(manual){
        onVinDetected(manual.trim().toUpperCase());
      } else {
        if(status) status.textContent = 'Nie odnaleziono kodu. Wpisz numer ręcznie.';
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function onVinDetected(val){
  const clean = val.replace(/[^A-Z0-9]/g, '').slice(0, 17);
  if(_vinScanActiveTargetId){
    const inp = document.getElementById(_vinScanActiveTargetId);
    if(inp){
      inp.value = clean;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }
  try{
    if(navigator.vibrate) navigator.vibrate([80, 40, 80]);
  }catch(_){}
  closeVinScanModal();
}

function closeVinScanModal(){
  if(_vinScanAnimFrame){
    cancelAnimationFrame(_vinScanAnimFrame);
    _vinScanAnimFrame = null;
  }
  if(_vinScanStream){
    try{
      _vinScanStream.getTracks().forEach(t => t.stop());
    }catch(_){}
    _vinScanStream = null;
  }
  const modal = document.getElementById('vinScanModal');
  if(modal) modal.style.display = 'none';
}

function calcJettingUI(){
  const disp = document.getElementById('jetDisp')?.value || '50_oem';
  const size = parseFloat(document.getElementById('jetCarbSize')?.value) || 17.5;
  const filter = document.getElementById('jetAirFilter')?.value || 'box_mod';
  const exh = document.getElementById('jetExhaust')?.value || 'sport';
  const temp = document.getElementById('jetTemp')?.value || 'normal';

  const isProFeature = disp !== '50_oem' || size > 17.5 || filter === 'cone' || exh === 'racing';
  const lockNotice = document.getElementById('jettingLockedNotice');
  if(lockNotice) lockNotice.style.display = (isProFeature && !hasPlan('pro')) ? 'block' : 'none';

  let baseJet = 68;
  if(disp === '50_sport') baseJet = 76;
  else if(disp === '70_street') baseJet = 86;
  else if(disp === '70_racing') baseJet = 94;
  else if(disp === 'gy6_4t') baseJet = 82;

  if(size >= 19) baseJet += 4;
  if(size >= 21) baseJet += 6;
  if(filter === 'box_mod') baseJet += 4;
  if(filter === 'cone') baseJet += 12;
  if(exh === 'sport') baseJet += 6;
  if(exh === 'racing') baseJet += 10;
  if(temp === 'cold') baseJet += 4;
  if(temp === 'hot') baseJet -= 3;

  const minJet = Math.round(baseJet - 2);
  const maxJet = Math.round(baseJet + 2);

  const mainEl = document.getElementById('jetMainDisplay');
  const pilotEl = document.getElementById('jetPilotDisplay');
  const needleEl = document.getElementById('jetNeedleDisplay');
  const screwEl = document.getElementById('jetAirScrewDisplay');

  if(mainEl) mainEl.textContent = `#${minJet} – #${maxJet}`;
  if(pilotEl) pilotEl.textContent = (size >= 19 || filter === 'cone') ? '#38 – #42' : '#32 – #36';
  if(needleEl) needleEl.textContent = filter === 'cone' ? '2. rowek od dołu (bogatszy dół)' : 'Środkowy rowek (3. od góry)';
  if(screwEl) screwEl.textContent = '1.5 – 1.75 obrotu od pełnego wkręcenia';
}

function calcCvtUI(){
  const eng = document.getElementById('cvtEngine')?.value || 'minarelli';
  const exh = document.getElementById('cvtExhaust')?.value || 'sport';
  const rider = document.getElementById('cvtRider')?.value || 'medium';

  let baseWeight = 6.0;
  if(eng === 'piaggio') baseWeight = 6.8;
  else if(eng === 'gy6_50') baseWeight = 5.5;

  if(exh === 'sport') baseWeight -= 1.3;
  else if(exh === 'racing') baseWeight -= 2.2;
  if(rider === 'heavy') baseWeight -= 0.4;
  else if(rider === 'light') baseWeight += 0.3;

  const minW = (Math.round((baseWeight - 0.3) * 10) / 10).toFixed(1);
  const maxW = (Math.round((baseWeight + 0.3) * 10) / 10).toFixed(1);

  const rollEl = document.getElementById('cvtRollersDisplay');
  const sprEl = document.getElementById('cvtSpringDisplay');
  const cluEl = document.getElementById('cvtClutchDisplay');

  if(rollEl) rollEl.textContent = `${minW}g – ${maxW}g`;
  if(sprEl) sprEl.textContent = exh === 'racing' ? 'Twarda (np. czerwona Malossi / +30%)' : (exh === 'sport' ? 'Średnia (żółta / +15%)' : 'Miękka OEM (biała / seria)');
  if(cluEl) cluEl.textContent = exh === 'racing' ? 'Twarde (start przy 6500+ RPM)' : (exh === 'sport' ? 'Średnie (start przy ~5000 RPM)' : 'Miękkie seryjne (start przy ~3500 RPM)');
}

// --- MODUŁ E: POWIADOMIENIA KLIENTA WHATSAPP / SMS (WARSZTAT) ---
function sendCustomerNotification(orderId, channel, type){
  if(!hasPlan('warsztat')){ renderLocked('warsztat', 'Powiadomienia klienta WhatsApp / SMS', 'renderOrderDetail(\"' + orderId + '\")'); return; }
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  const rawPhone = (o.customerPhone || '').replace(/[^0-9+]/g, '');
  if(!rawPhone){
    alert('Podaj numer telefonu w zleceniu, aby wysłać powiadomienie.');
    return;
  }
  let cleanPhone = rawPhone.replace(/^0+/, '');
  if(!cleanPhone.startsWith('+') && !cleanPhone.startsWith('48') && cleanPhone.length === 9){
    cleanPhone = '48' + cleanPhone;
  }
  cleanPhone = cleanPhone.replace('+', '');

  const w = workshopInfo();
  const wName = w.name || 'Nasz Warsztat';
  const wPhone = w.phone || '';
  const total = o.totalCost || 0;
  const veh = (o.vehicleMake ? o.vehicleMake + ' ' : '') + (o.vehicleModel || 'Pojazd');

  let text = '';
  if(type === 'ready'){
    text = `Dzień dobry! Zlecenie nr ${o.number} dotyczące pojazdu ${veh} zostało zakończone i pojazd jest gotowy do odbioru w warsztacie ${wName}. Łączna kwota do zapłaty: ${total} zł. ${wPhone ? 'Tel: ' + wPhone : ''} Zapraszamy!`;
  } else if(type === 'quote'){
    text = `Dzień dobry! Przygotowaliśmy wycenę dla zlecenia ${o.number} (${veh}). Szacowany łączny koszt naprawy i części wynosi ${total} zł. Zakres: ${o.faultDesc || 'Przegląd i naprawa'}. Prosimy o potwierdzenie akceptacji. Pozdrawiamy, ${wName}.`;
  } else if(type === 'received'){
    text = `Dzień dobry! Potwierdzamy przyjęcie pojazdu ${veh} na serwis pod numerem zlecenia ${o.number}. Poinformujemy o postępach prac. ${wName}.`;
  }

  if(channel === 'whatsapp'){
    const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  } else {
    const url = `sms:${cleanPhone}?body=${encodeURIComponent(text)}`;
    window.location.href = url;
  }
}

// --- MODUŁ G: EKSPORT ZLECEŃ DO CSV / EXCEL DLA KSIĘGOWOŚCI (WARSZTAT) ---
function exportOrdersCsv(){
  if(!hasPlan('warsztat')){ renderLocked('warsztat', 'Eksport zleceń do CSV / Excel', 'renderOrders()'); return; }
  if(!orders || !orders.length){ alert('Brak zleceń do wyeksportowania.'); return; }

  const headers = ['Numer zlecenia', 'Data przyjęcia', 'Klient', 'Telefon', 'Pojazd', 'VIN', 'Przebieg', 'Status', 'Części hurt zł', 'Części klient zł', 'Robocizna zł', 'Łączny koszt zł', 'Zysk warsztatu zł', 'Marża %'];
  
  const rows = orders.map(o => {
    const partsSell = (o.partsList || []).reduce((acc, p) => acc + (Number(p.total) || 0), 0);
    const partsBuy = (o.partsList || []).reduce((acc, p) => acc + (Number(p.totalCost) || (Number(p.costPrice || 0) * (Number(p.qty) || 1))), 0);
    const labor = Number(o.laborCost) || 0;
    const laborBuy = Number(o.laborInternalCost) || 0;
    const total = Number(o.totalCost) || (partsSell + labor);
    const totalInternal = partsBuy + laborBuy;
    const profit = Math.round((total - totalInternal) * 100) / 100;
    const margin = total > 0 ? Math.round((profit / total) * 1000) / 10 : 0;

    return [
      o.number || '',
      o.dateIn || '',
      o.customerName || '',
      o.customerPhone || '',
      `${o.vehicleMake || ''} ${o.vehicleModel || ''}`.trim(),
      o.vin || '',
      o.mileage || '',
      o.status || '',
      partsBuy.toFixed(2),
      partsSell.toFixed(2),
      labor.toFixed(2),
      total.toFixed(2),
      profit.toFixed(2),
      margin.toFixed(1)
    ].map(val => '"' + String(val).replace(/"/g, '""') + '"').join(';');
  });

  const csvContent = '\uFEFF' + headers.join(';') + '\r\n' + rows.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `naprawnik_zlecenia_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// --- MODUŁ H: DYKTOWANIE GŁOSOWE (WEB SPEECH API / ZERO-COST) ---
let _voiceRecognition = null;
function initVoiceDictation(targetInputId){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert('Twoja przeglądarka nie obsługuje bezpośredniego dyktowania mowy. Użyj mikrofonu klawiatury ekranowej.');
    return;
  }
  const target = document.getElementById(targetInputId);
  if(!target) return;

  if(_voiceRecognition){
    try{ _voiceRecognition.stop(); }catch(_){}
    _voiceRecognition = null;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'pl-PL';
  recognition.continuous = false;
  recognition.interimResults = false;

  const prevPlaceholder = target.placeholder;
  target.placeholder = '🎙️ Mów teraz... (trwa nasłuchiwanie)';

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    if(transcript){
      target.value = (target.value ? target.value + ' ' : '') + transcript;
      target.dispatchEvent(new Event('input', { bubbles: true }));
      target.dispatchEvent(new Event('change', { bubbles: true }));
    }
  };

  recognition.onerror = () => {
    target.placeholder = prevPlaceholder;
  };

  recognition.onend = () => {
    target.placeholder = prevPlaceholder;
  };

  recognition.start();
  _voiceRecognition = recognition;
}

        <th style="text-align:right;padding:4px;width:55px" title="Koszt hurt/zakup">Hurt</th>
        <th style="text-align:right;padding:4px;width:55px">Cena</th>
        <th style="text-align:right;padding:4px;width:60px">Razem</th>

    <tbody>
      ${o.partsList.map((p, idx) => `
      <tr style="border-bottom:1px solid rgba(255,255,255,0.05)">
        <td style="padding:6px 4px">${escapeHtml(p.name)}</td>

        <td style="text-align:right;padding:6px 4px">${p.unitPrice} zł</td>
        <td style="text-align:right;padding:6px 4px;font-weight:700">${p.total} zł</td>

      </tr>`).join('')}

function addPartToOrder(orderId){
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  const name = document.getElementById('newPartName').value.trim();
  const qty = parseInt(document.getElementById('newPartQty').value, 10) || 1;
  const costPrice = parseFloat(document.getElementById('newPartCost')?.value) || 0;
  const unitPrice = parseFloat(document.getElementById('newPartPrice').value) || 0;
  if(!name){ alert('Wpisz nazwę części.'); return; }
  if(!Array.isArray(o.partsList)) o.partsList = [];
  const total = Math.round(qty * unitPrice * 100) / 100;
  const totalCost = Math.round(qty * costPrice * 100) / 100;
  o.partsList.push({ name, qty, costPrice, unitPrice, total, totalCost });
  recalculateOrderTotal(o);
  save('naprawnik_orders', orders);
  renderOrderDetail(orderId);
}

function updateOrderLaborCost(orderId, val){
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  o.laborInternalCost = Math.max(0, parseFloat(val) || 0);
  recalculateOrderTotal(o);
  save('naprawnik_orders', orders);
  renderOrderDetail(orderId);
}

function removeOrderPart(orderId, index){
  const o = orders.find(x => x.id === orderId);
  if(!o || !o.partsList) return;
  o.partsList.splice(index, 1);
  recalculateOrderTotal(o);
  save('naprawnik_orders', orders);
  renderOrderDetail(orderId);
}

function recalculateOrderTotal(o){
  const partsSellSum = (o.partsList || []).reduce((acc, p) => acc + (Number(p.total) || 0), 0);
  const partsBuySum = (o.partsList || []).reduce((acc, p) => acc + (Number(p.totalCost) || (Number(p.costPrice || 0) * (Number(p.qty) || 1))), 0);
  const laborSell = Number(o.laborCost) || 0;
  const laborBuy = Number(o.laborInternalCost) || 0;

  o.totalCost = Math.round((partsSellSum + laborSell) * 100) / 100;
  o.totalInternalCost = Math.round((partsBuySum + laborBuy) * 100) / 100;
  o.grossProfit = Math.round((o.totalCost - o.totalInternalCost) * 100) / 100;
  o.marginPercent = o.totalCost > 0 ? Math.round((o.grossProfit / o.totalCost) * 1000) / 10 : 0;
  o.markupPartsPercent = partsBuySum > 0 ? Math.round(((partsSellSum - partsBuySum) / partsBuySum) * 1000) / 10 : 0;
}

function updateOrderLabor(orderId, val){
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  o.laborCost = Math.max(0, parseFloat(val) || 0);
  recalculateOrderTotal(o);
  save('naprawnik_orders', orders);
  document.getElementById('ordTotalDisplay').textContent = o.totalCost + ' zł';
}

function updateOrderStatus(orderId){

function deleteOrder(orderId){

  orders = orders.filter(x => x.id !== orderId);
  save('naprawnik_orders', orders);

function attachOrderPhoto(orderId, photoField, event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  compressImageToDataUrl(file, 1000, 0.75, function(dataUrl){
    if(!Array.isArray(o[photoField])) o[photoField] = [];
    o[photoField].push(dataUrl);
    save('naprawnik_orders', orders);
    renderOrderDetail(orderId);
  });
}

function delOrderPhoto(orderId, photoField, index){
  const o = orders.find(x => x.id === orderId);
  if(!o || !Array.isArray(o[photoField])) return;
  o[photoField].splice(index, 1);
  save('naprawnik_orders', orders);
  renderOrderDetail(orderId);
}

function compressImageToDataUrl(file, maxDimension, quality, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > maxDimension || h > maxDimension){
        if(w > h){ h = Math.round((h * maxDimension) / w); w = maxDimension; }
        else { w = Math.round((w * maxDimension) / h); h = maxDimension; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

let signaturePadActive = false;
function initSignaturePad(){
  const canvas = document.getElementById('ordSignCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#00f57a';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  let drawing = false;

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function start(e){ drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function draw(e){ if(!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
  function end(){ drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', end);
}

function transferOrderToRepairs(orderId){
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  let targetVehicleId = o.vehicleId;
  if(!targetVehicleId){
    const found = vehicles.find(v => (o.vin && v.vin === o.vin) || (o.vehicleMake && v.brand === o.vehicleMake && v.model === o.vehicleModel));
    if(found) targetVehicleId = found.id;
  }
  if(!targetVehicleId){
    if(vehicles.length >= vehicleLimit()){
      alert('Osiągnięto limit pojazdów. Dodaj pojazd do kartoteki przed powiązaniem.');
      return;
    }
    const newVeh = {
      id: uid(),
      brand: o.vehicleMake || 'Pojazd',
      model: o.vehicleModel || '',
      year: o.year || '',
      engine: o.engineCc || '',
      vin: o.vin || '',
      mileage: o.mileage || '',
      ownerName: o.customerName || '',
      ownerPhone: o.customerPhone || '',
      createdAt: new Date().toISOString()
    };
    vehicles.push(newVeh);
    save('naprawnik_vehicles', vehicles);
    targetVehicleId = newVeh.id;
    o.vehicleId = targetVehicleId;
    save('naprawnik_orders', orders);
  }

  const partsText = (o.partsList || []).map(p => p.name + ' (' + p.qty + 'x)').join(', ');
  const repairRecord = {
    id: uid(),
    vehicleId: targetVehicleId,
    date: new Date().toLocaleDateString('pl-PL'),
    symptom: o.faultDesc || '',
    diagnosis: o.diagnosis || '',
    repair: o.workDone || ('Realizacja zlecenia ' + o.number),
    parts: partsText,
    cost: String(o.totalCost || 0),
    mileage: o.mileage || ''
  };
  repairs.push(repairRecord);
  save('naprawnik_repairs', repairs);
  alert('✅ Zlecenie zostało pomyślnie dodane do historii napraw pojazdu w Kartotece.');
  selectedVehicleId = targetVehicleId;
  nav('vehicleDetail');

function evaluateLabStatus(val, min, max){
  const num = parseFloat(val);
  if(isNaN(num) || isNaN(min) || isNaN(max)) return { code: 'unknown', label: 'Brak danych referencyjnych', color: '#a0a0b8' };
  if(num >= min && num <= max) return { code: 'ok', label: '🟢 W normie (OK)', color: '#00f57a' };
  const tolerance = (max - min) * 0.15 || min * 0.1 || 0.5;
  if(num >= (min - tolerance) && num <= (max + tolerance)) {
    return { code: 'suspect', label: '🟡 Na granicy tolerancji (Podejrzany)', color: '#ffe066' };
  }
  return { code: 'bad', label: '🔴 Poza zakresem (Usterka)', color: '#ff6b6b' };
}

function applyLabPreset(){
  const idx = document.getElementById('labPresetSel')?.value;
  if(idx === '' || idx === undefined) return;
  const p = LAB_SYSTEM_PRESETS[parseInt(idx, 10)];
  if(!p) return;
  document.getElementById('labLabel').value = p.name;
  document.getElementById('labUnit').value = p.unit;
  document.getElementById('labMin').value = p.min;
  document.getElementById('labMax').value = p.max;
  document.getElementById('labPresetTip').textContent = 'ℹ️ ' + p.tip;
  previewLabEval();
}

function previewLabEval(){
  const val = document.getElementById('labValue')?.value;
  const min = parseFloat(document.getElementById('labMin')?.value);
  const max = parseFloat(document.getElementById('labMax')?.value);
  const el = document.getElementById('labEvalPreview');
  if(!el) return;
  if(!val){ el.innerHTML = ''; return; }
  const st = evaluateLabStatus(val, min, max);
  el.innerHTML = '<span style="color:' + st.color + '">Ocena stanu: ' + st.label + '</span>';
}

function saveLabMeasurement(){
  const label = document.getElementById('labLabel').value.trim();
  const measuredValue = parseFloat(document.getElementById('labValue').value);
  if(!label || isNaN(measuredValue)){
    alert('Wpisz nazwę pomiaru oraz zmierzoną wartość liczbową.');
    return;
  }
  const maxMeas = measurementLimit();
  if(measurements.length >= maxMeas){
    renderLocked(curPlan()==='amator'?'pro':'warsztat', 'Więcej pomiarów w Elektronicznym Laboratorium (limit: ' + maxMeas + ')', 'nav(\'lab\')');
    return;
  }
  const item = {
    id: 'meas_' + uid(),
    label,
    measuredValue,
    unit: document.getElementById('labUnit').value.trim() || '',
    refMin: parseFloat(document.getElementById('labMin').value),
    refMax: parseFloat(document.getElementById('labMax').value),
    vehicleId: document.getElementById('labVehSel').value || null,
    notes: document.getElementById('labNotes').value.trim(),
    date: new Date().toLocaleString('pl-PL')
  };
  measurements.push(item);
  save('naprawnik_measurements', measurements);
  alert('✅ Pomiar został pomyślnie zapisany w Elektronicznym Laboratorium.');
  renderElectronicLab(item.vehicleId);
}

function deleteLabMeasurement(measId){

    <p style="font-size:12px;line-height:1.5">Inteligentny harmonogram czynności serwisowych bazujący na przebiegu w kilometrach oraz upływie czasu. Automatyczne obliczanie terminów dla 2T, 4T i napędów CVT.</p>
    
    <label>Wybierz pojazd z kartoteki:</label>
    <select id="servVehSelect" onchange="renderAutomatedServicePlan(this.value)" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);margin-bottom:8px">
      ${vehicles.map(item => `<option value="${item.id}" ${v && v.id === item.id ? 'selected' : ''}>${escapeHtml(item.brand||'')} ${escapeHtml(item.model||'')} (${escapeHtml(item.vin||'bez VIN')}) · ${item.mileage||0} km</option>`).join('')}
    </select>
  </div>
  ${!v ? '<div class="card empty">Dodaj pojazd w Kartotece, aby uruchomić plan serwisowy.</div>' : renderVehicleServiceSchedule(v)}`;
}

function renderVehicleServiceSchedule(v){
  const curKm = parseInt(v.mileage, 10) || 0;
  const is2T = String(v.engine || '').toUpperCase().includes('2T');
  const applicable = STANDARD_SERVICE_INTERVALS.filter(s => {
    if(is2T && s.engineType === '4T') return false;
    return true;
  });

  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Harmonogram: ${escapeHtml(v.brand||'')} ${escapeHtml(v.model||'')}</h2>
      <b style="color:var(--hero);font-size:14px">${curKm} km</b>
    </div>
    <div style="font-size:12px;color:var(--dim);margin-bottom:10px">Aktualizuj przebieg po wykonaniu czynności:</div>

    <div style="display:flex;flex-direction:column;gap:8px">
      ${applicable.map(item => {
        const nextKm = Math.ceil((curKm + 1) / item.km) * item.km;
        const diffKm = nextKm - curKm;
        const isDue = diffKm <= 300;
        const isOverdue = diffKm <= 0;
        const statusColor = isOverdue ? '#ff6b6b' : (isDue ? '#ffe066' : '#00f57a');
        const statusLabel = isOverdue ? '⚠️ WYMAGA WYKONANIA' : (isDue ? '🟡 Zbliża się termin' : '🟢 W normie');

        return `
        <div class="entry" style="border-left:4px solid ${statusColor}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <b>${escapeHtml(item.name)}</b>
            <span style="font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid ${statusColor};color:${statusColor}">${statusLabel}</span>
          </div>
          <small>${escapeHtml(item.desc)}</small>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px">
            <span>Interwał: <b>co ${item.km} km</b> (lub ${item.months} mies.)</span>
            <span style="color:var(--hero)">Następny przy: <b>${nextKm} km</b> (za ${diffKm} km)</span>
          </div>
          <button class="btn" style="margin-top:6px;font-size:11px;padding:4px 8px;border-color:#00f57a;color:#00f57a" onclick="completeServiceInterval('${v.id}', '${item.id}')">✓ Oznacz jako wykonane teraz</button>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function completeServiceInterval(vehId, intervalId){
  const v = vehicles.find(x => x.id === vehId);
  const item = STANDARD_SERVICE_INTERVALS.find(x => x.id === intervalId);
  if(!v || !item) return;

  const currentKm = prompt('Potwierdź aktualny przebieg licznika (km):', v.mileage || '0');
  if(currentKm === null) return;
  v.mileage = String(parseInt(currentKm, 10) || v.mileage || 0);
  save('naprawnik_vehicles', vehicles);

  const newRepair = {
    id: uid(),
    vehicleId: v.id,
    date: new Date().toLocaleDateString('pl-PL'),
    symptom: 'Planowa obsługa serwisowa',
    diagnosis: 'Obsługa wg harmonogramu interwałów',
    repair: item.name,
    parts: item.desc,
    cost: '',
    mileage: v.mileage
  };
  repairs.push(newRepair);
  save('naprawnik_repairs', repairs);

  alert('✅ Zarejestrowano wykonanie: ' + item.name + ' przy przebiegu ' + v.mileage + ' km. Wpis dodany do Historii Napraw.');
  renderAutomatedServicePlan(v.id);
}

function zoomPhoto(dataUrl){
  const overlay = document.createElement('div');
  overlay.style.position = 'fixed';
  overlay.style.top = '0';
  overlay.style.left = '0';
  overlay.style.width = '100vw';
  overlay.style.height = '100vh';
  overlay.style.background = 'rgba(0,0,0,0.92)';
  overlay.style.zIndex = '99999';
  overlay.style.display = 'flex';
  overlay.style.flexDirection = 'column';
  overlay.style.justifyContent = 'center';
  overlay.style.alignItems = 'center';
  overlay.style.cursor = 'zoom-out';
  overlay.innerHTML = '<img src="' + dataUrl + '" style="max-width:95vw;max-height:85vh;border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,0.8)"><div style="color:#fff;margin-top:12px;font-size:13px">Kliknij w dowolnym miejscu, aby zamknąć</div>';
  overlay.onclick = function(){ document.body.removeChild(overlay); };
  document.body.appendChild(overlay);
}
