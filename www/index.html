  ];
  const groups={
    spark:['Silnik wyłączony i zabezpieczony: sprawdź pęknięcia, osad i zużycie świecy.','Nie wykonuj testu iskry w pobliżu paliwa ani jego oparów.','Potwierdź typ świecy, szczelinę i moment montażu w dokumentacji.'],
    electrical:['Odłącz zasilanie przed rozpinaniem złącza, jeśli procedura tego wymaga.','Sprawdź korozję, nadtopienia, luźne styki i uszkodzoną izolację.','Pomiar wykonaj właściwym miernikiem i porównaj z DTR konkretnego modelu.'],
    fuel:['Przy wycieku zamknij dopływ paliwa, usuń źródła zapłonu i nie uruchamiaj silnika.','Sprawdź przewody, opaski i widoczne ślady wycieku bez rozbierania pod ciśnieniem.','Ustawienia gaźnika i poziom pływaka potwierdź w instrukcji konkretnego gaźnika.'],
    engine:['Nie uruchamiaj silnika, jeśli widać pęknięcie, blokowanie, duży wyciek lub luźny element.','Zapisz, czy objaw występuje na zimno, na ciepło, na postoju czy pod obciążeniem.','Potwierdź diagnozę pomiarem (np. kompresji/szczelności) zgodnie z instrukcją.'],
    leak:['Zlokalizuj najwyższy punkt mokrego śladu po ostygnięciu i oczyszczeniu elementu.','Nie odkręcaj korka gorącego układu chłodzenia i nie dotykaj gorących części.','Ustal rodzaj płynu i źródło wycieku przed wymianą części.'],
    part:['Odczytaj oznaczenia, numer odlewu lub numer OEM; zdjęcie samo nie potwierdza zgodności.','Porównaj mocowania, wymiary i złącza z katalogiem dokładnego rocznika/wariantu.','Nie zamawiaj części wyłącznie na podstawie podobnego wyglądu.'],
    other:['Zapisz dokładne warunki występowania objawu i od kiedy występuje.','Sprawdź najpierw czynności bezpieczne i odwracalne; nie wymieniaj części w ciemno.','Jeśli problem dotyczy hamulców, opon, kierownicy lub wycieku paliwa — nie kontynuuj jazdy.']
  };
  return [...common,...(groups[category]||groups.other)].map(label=>({label,done:false}));

let paPreviewUrls=[];
function paAddFiles(input){
  const incoming=Array.from(input.files||[]).filter(f=>f.type&&f.type.startsWith('image/'));
  if(incoming.length===0) alert('Wybierz plik obrazu, np. JPG, PNG lub WebP.');
  let dropped=0;
  for(const f of incoming){
    if(paSelectedFiles.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified)) continue;
    if(paSelectedFiles.length>=3){ dropped++; continue; }
    paSelectedFiles.push(f);
  }
  input.value='';
  paPreviewUrls.forEach(u=>URL.revokeObjectURL(u)); paPreviewUrls=[];
  const el=document.getElementById('paSelectedPreview');
  if(el) el.innerHTML=paSelectedFiles.length?`<div class="pa-photo-grid">${paSelectedFiles.map(f=>{const u=URL.createObjectURL(f);paPreviewUrls.push(u);return `<div><img class="pa-photo" src="${u}" alt="Podgląd zdjęcia"><div class="pa-small">${paEscape(f.name)}</div></div>`;}).join('')}</div><button class="btn" onclick="paSelectedFiles=[];renderPhotoAssistant()">Usuń zdjęcia i zacznij od nowa</button><div class="pa-small">Dodano ${paSelectedFiles.length}/3 zdjęcia.</div>`:'Nie dodano jeszcze zdjęć.';
  if(dropped) alert('Limit to 3 zdjęcia dla jednego przypadku. Pominięto: '+dropped+'.');
}
function paCompressImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{try{const max=1280,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(blob=>{if(!blob){reject(new Error('Nie udało się przygotować zdjęcia.'));return;}const r=new FileReader();r.onload=()=>resolve({name:file.name||'zdjecie.jpg',type:blob.type||'image/jpeg',dataUrl:r.result});r.onerror=()=>reject(new Error('Nie udało się odczytać zdjęcia.'));r.readAsDataURL(blob);},'image/jpeg',0.76);}catch(e){URL.revokeObjectURL(url);reject(e);}};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Nie można otworzyć jednego ze zdjęć.'));};img.src=url;
  });
}

async function paEditCase(id){const r=await paDbRequest('readonly','get',id);if(!r)return;const note=prompt('Dodaj notatkę do przypadku:',r.extra||'');if(note===null)return;try{await paUpdateCase(id,x=>{x.extra=note;});renderPhotoAssistantCase(id);}catch(e){alert('Nie udało się zapisać notatki: '+(e.message||e));}}
async function paDeleteCase(id){if(!confirm('Usunąć ten przypadek, wszystkie jego zdjęcia, wynik AI i checklistę z tego urządzenia?'))return;try{await paDbRequest('readwrite','delete',id);}catch(e){alert('Nie udało się usunąć: '+(e.message||e));}renderPhotoAssistant();}
function paBindPhotoLinks(r){document.querySelectorAll('.pa-photo-link').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();const p=(r.photos||[])[Number(a.dataset.i)];if(!p||!paSafeImageUrl(p.dataUrl))return;const url=URL.createObjectURL(paDataUrlToBlob(p.dataUrl));window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);}));}
function paDataUrlToBlob(dataUrl){const parts=dataUrl.split(',');const mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/jpeg';const binary=atob(parts[1]);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:mime});}
const paActive=new Set();
function paRefreshIfViewing(id){const m=document.getElementById('paCaseMarker');if(m&&m.dataset.case===id)renderPhotoAssistantCase(id);}
const PHOTO_AI_ENABLED = false;
async function paRunAI(id){
  if (!PHOTO_AI_ENABLED) { alert('Analiza zdjęć AI jest tymczasowo wyłączona. Zdjęcia, historia i checklisty nadal działają lokalnie.'); return; }
  if(paActive.has(id)) return;
  if(!hasPlan('pro')){ renderLocked('pro','Asystent AI — analiza zdjęć',"renderPhotoAssistantCase('"+id+"')"); return; }
  let fail=null;
  try{
    const r=await paDbRequest('readonly','get',id); if(!r) return;
    if(!paOnline()) throw new Error('Brak internetu. Przypadek i checklisty są zapisane offline; po powrocie sieci możesz ponowić analizę.');
    if(!r.photos||!r.photos.length) throw new Error('Ten przypadek nie ma zdjęcia. Dodaj zdjęcie w nowym przypadku, aby uruchomić analizę obrazową.');
    paActive.add(id);
    await paUpdateCase(id,x=>{x.analysisStatus='running';x.analysis='';});
    renderPhotoAssistantCase(id);
    const fd=new FormData();fd.append('symptoms',r.symptoms||'');fd.append('category',r.category||'other');fd.append('make',r.make||'');fd.append('model',r.model||'');fd.append('year',r.year||'');fd.append('engine',r.engine||'');fd.append('extra',r.extra||'');
    for(const p of r.photos){fd.append('photos',paDataUrlToBlob(p.dataUrl),p.name||'photo.jpg');}
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),60000); let data;
    try{
      if(typeof window.npPhotoDiagnosis!=='function') throw new Error('Brak modułu bezpiecznej analizy AI. Odśwież aplikację lub użyj najnowszej wersji.');
      data=await window.npPhotoDiagnosis(fd,{signal:ctl.signal});
    }
    catch(e){
      if(e&&e.name==='AbortError') throw new Error('Przekroczono czas oczekiwania na serwer analizy AI (60 s).');
      throw e;
    }
    finally{ clearTimeout(to); }
    if(!data.analysis||typeof data.analysis!=='string') throw new Error('Serwer nie zwrócił tekstowego wyniku analizy.');
    await paUpdateCase(id,x=>{x.analysis=data.analysis;x.analysisStatus='done';x.analysisAt=new Date().toISOString();x.aiModel=data.model||'AI (backend)';});
  }catch(e){ console.error('NAPRAWNIK AI:',e); fail=e; }
  paActive.delete(id);
  if(fail){
    if([401,402,403].includes(Number(fail.status)) && typeof licRefresh==='function') {
      try { await licRefresh(true); } catch (_) {}
    }
    const cfg=/skonfigurowana|OPENAI|rate limit|konfiguracj/i.test(String(fail.message||fail));
    const msg='Analiza AI nie została wykonana. '+(fail.message||fail)+'\n\nDane, zdjęcia i checklista pozostają zapisane lokalnie.'+(cfg?' Sprawdź konfigurację Workera i zmienne OPENAI_API_KEY / OPENAI_VISION_MODEL.':'');
    try{ await paUpdateCase(id,x=>{x.analysisStatus='error';x.analysis=msg;x.analysisAt=new Date().toISOString();}); }catch(se){ alert('Analiza AI nie powiodła się: '+(fail.message||fail)); }
  }
  paRefreshIfViewing(id);
}
async function paExportCases(){
  try{const rows=await paDbRequest('readonly','all');const payload={app:'NAPRAWNIK-photo-assistant',version:1,exportedAt:new Date().toISOString(),cases:rows};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='NAPRAWNIK-asystent-zdjecia-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('Wyeksportowano historię wraz ze zdjęciami. Plik może być duży i zawierać dane prywatne.');}catch(e){alert('Eksport nieudany: '+(e.message||e));}
}
async function paImportCases(event){
  const file=event.target.files&&event.target.files[0];if(!file)return;
  if(!confirm('Import dopisze przypadki do historii na tym urządzeniu; nie usunie istniejących danych. Kontynuować?')){event.target.value='';return;}
  try{const p=JSON.parse(await file.text());if(!p||p.app!=='NAPRAWNIK-photo-assistant'||p.version!==1||!Array.isArray(p.cases))throw new Error('Nieprawidłowy plik historii.');for(const r of p.cases){if(!r||typeof r.id!=='string'||!Array.isArray(r.photos)||typeof r.symptoms!=='string')continue;r.photos=r.photos.filter(p=>p&&typeof p.dataUrl==='string'&&paSafeImageUrl(p.dataUrl)&&p.dataUrl.length<1800000).slice(0,3);r.checklist=(Array.isArray(r.checklist)?r.checklist:[]).filter(c=>c&&typeof c.label==='string').map(c=>({label:c.label,done:!!c.done}));const existing=/^pa_[a-z0-9_]+$/i.test(r.id)?await paDbRequest('readonly','get',r.id):true;if(existing)r.id=paMakeId();await paDbRequest('readwrite','put',r);}alert('Import zakończony.');renderPhotoAssistant();}catch(e){alert('Nie udało się zaimportować historii: '+(e.message||e));}finally{event.target.value='';}
}

 {id:'overcharge',title:'Przeładowanie akumulatora',tags:'regulator napięcia ładowanie wysokie napięcie',areas:[['Możliwe przyczyny','Regulator-prostownik, złe połączenie masy/odniesienia, złącza, niezgodny regulator lub błędny pomiar.'],['Test','Zmierz ładowanie w warunkach wskazanych przez producenta, sprawdź masę i złącza oraz porównaj wynik z DTR.'],['Ryzyko','Przeładowanie może uszkodzić akumulator i elektronikę. Przy silnym wzroście napięcia przerwij test.']]},
 {id:'intermittent-lights',title:'Światła migają albo zmieniają jasność',tags:'oświetlenie masa regulator stator żarówka',areas:[['Zależność od obrotów','Ustal, czy światła są zasilane AC czy DC — zależy to od modelu.'],['Możliwe przyczyny','Masa, złącze, żarówka, regulator, stator lub przeciążenie instalacji dodatkowymi akcesoriami.'],['Test','Sprawdź napięcia i schemat konkretnego modelu. Nie zakładaj układu po samym kolorze przewodu.']]},
 {id:'weak-spark',title:'Iskra jest, ale zanika pod obciążeniem',tags:'iskra cewka wn świeca kompresja',areas:[['Możliwe przyczyny','Świeca o niewłaściwej specyfikacji, fajka/przewód WN, cewka, zapłon lub błędna szczelina.'],['Test','Użyj właściwego testera iskry i dokumentacji. Widoczna iskra poza cylindrem nie gwarantuje zapłonu pod ciśnieniem.'],['Uwaga','Nie wykonuj otwartych testów iskry w pobliżu wycieku paliwa.']]},
 {id:'oil-smoke',title:'4T: niebieski dym i ubytek oleju',tags:'4t dym niebieski olej pierścienie uszczelniacze',areas:[['Najpierw','Sprawdź właściwy poziom oleju i czy silnik nie został przepełniony.'],['Możliwe przyczyny','Pierścienie/cylinder, uszczelniacze zaworowe, odpowietrzenie skrzyni korbowej lub zużycie mechaniczne.'],['Potwierdzenie','Pomiar kompresji, próba szczelności i inspekcja mechaniczna według procedury producenta.']]},
 {id:'coolant-loss',title:'Ubywa płynu chłodniczego',tags:'płyn chłodniczy wyciek przegrzewanie pompa chłodnica',areas:[['Bezpieczeństwo','Nie odkręcaj korka gorącego układu. Przy przegrzaniu lub gwałtownym wycieku zatrzymaj silnik i poczekaj na ostygnięcie.'],['Kontrola','Po ostygnięciu sprawdź przewody, opaski, chłodnicę, pompę, korek i ślady wycieku.'],['Dalsze testy','Ciśnienie układu oraz podejrzenie przedostawania się płynu do cylindra sprawdź zgodnie z DTR.']]},
 {id:'fan-not-working',title:'Wentylator chłodnicy nie włącza się',tags:'wentylator bezpiecznik przekaźnik czujnik temperatury',areas:[['Warunki','Nie doprowadzaj celowo do przegrzania, aby wymusić test.'],['Kontrola','Bezpiecznik, zasilanie, masa, silnik wentylatora, przekaźnik i czujnik/ECU zależnie od konstrukcji.'],['Weryfikacja','Temperatura załączenia i procedura aktywacji muszą pochodzić z dokumentacji konkretnego modelu.']]},
 {id:'brakes-pull',title:'Motocykl ściąga podczas hamowania',tags:'hamulce ściąga zacisk opona łożysko',areas:[['Natychmiast','Jeśli hamowanie jest nierówne, dźwignia opada lub widać wyciek, nie kontynuuj jazdy.'],['Możliwe przyczyny','Zapieczony tłoczek, nierówne klocki/tarcza, zanieczyszczenie, opona/łożysko lub geometria.'],['Naprawa','Hamulce wymagają procedury i testu zgodnego z instrukcją; po ingerencji sprawdź działanie na bezpiecznym stanowisku.']]},
 {id:'brake-soft',title:'Dźwignia hamulca robi się miękka',tags:'hamulec powietrze wyciek płyn przewód',areas:[['Stop','Nie jeździj, jeśli siła hamowania spadła lub dźwignia wpada do końca.'],['Możliwe przyczyny','Powietrze, wyciek, uszkodzony przewód, uszczelnienia pompy lub zacisku.'],['Serwis','Odpowietrzanie, rodzaj płynu i momenty wyłącznie według procedury producenta.']]},
 {id:'chain-noise',title:'Łańcuch napędowy głośny lub nierówno napięty',tags:'łańcuch napęd naciąg zębatka smarowanie',areas:[['Kontrola','Zmierz luz w kilku położeniach koła, zużycie zębatek i stan ogniw według DTR.'],['Możliwe przyczyny','Za mały/duży luz, nierówne rozciągnięcie, suche ogniwa, nieosiowe koło lub zużyte zębatki.'],['Bezpieczeństwo','Nie obracaj napędu silnikiem przy rękach w pobliżu łańcucha. Wymieniaj zestaw zgodnie z zaleceniami producenta.']]},
 {id:'clutch-drag',title:'Sprzęgło ciągnie lub biegi ciężko wchodzą',tags:'sprzęgło linka kosz tarcze bieg',areas:[['Sprawdź','Luz linki/popychacza, prawidłowy olej, mechanizm regulacji i sposób rozłączania sprzęgła.'],['Możliwe przyczyny','Zła regulacja, tarcze odkształcone/zlepione, kosz z rowkami, niewłaściwy olej lub zużyte elementy.'],['Weryfikacja','Luz i grubość pakietu porównuj ze specyfikacją silnika.']]},
 {id:'gear-jumps',title:'Bieg wyskakuje podczas przyspieszania',tags:'skrzynia biegów widełki kły selektor',areas:[['Ryzyko','Nie kontynuuj jazdy, jeśli bieg wyskakuje lub napęd nagle się rozłącza.'],['Możliwe przyczyny','Zużyte kły zazębienia, widełki, bęben selektora, łożyska albo niepełny skok zmiany biegów.'],['Potwierdzenie','Sprawdź regulację i mechanizm zmiany, a jeśli problem pozostaje — inspekcja wewnętrzna skrzyni.']]},
 {id:'wheel-bearing',title:'Luz lub szum łożyska koła',tags:'łożysko koła luz szum kolo',areas:[['Bezpieczeństwo','Nie jeździj przy wyraźnym luzie, zacinaniu lub przegrzewaniu piasty.'],['Kontrola','Unieś pojazd w bezpieczny sposób, sprawdź luz/hałas i wyklucz tarcie hamulca oraz opony.'],['Naprawa','Typ łożyska, pasowanie i moment osi według DTR; po naprawie sprawdź swobodny obrót i mocowanie.']]},
 {id:'fork-leak',title:'Wyciek z lag przedniego widelca',tags:'widelec lagi uszczelniacz olej hamulec',areas:[['Bezpieczeństwo','Olej na tarczy, klockach lub oponie oznacza przerwanie jazdy do usunięcia usterki.'],['Możliwe przyczyny','Uszczelniacz, zabrudzenia, skorodowana/ryśnięta powierzchnia lub luz prowadzenia.'],['Serwis','Ilość/lepkość oleju i wysokość poziomu są modelowe; użyj procedury producenta.']]},
 {id:'steering-head',title:'Stuki lub przeskoki łożysk główki ramy',tags:'główka ramy łożysko kierownica luz',areas:[['Test','Sprawdź luz, gładkość skrętu i ewentualne zacięcia według procedury dla modelu.'],['Możliwe przyczyny','Łożyska, regulacja, zużyte bieżnie lub poluzowane mocowanie widelca.'],['Ryzyko','Luz układu kierowniczego wpływa na sterowność — przed jazdą napraw i sprawdź mocowania.']]},
 {id:'tire-pressure',title:'Nierówne zużycie opony',tags:'opona ciśnienie bieżnik geometria',areas:[['Najpierw','Sprawdź ciśnienie na zimnej oponie według tabliczki/instrukcji oraz zgodność opony.'],['Możliwe przyczyny','Ciśnienie, obciążenie, geometria, zawieszenie, łożyska lub uszkodzenie opony.'],['Naprawa','Nie używaj uniwersalnego ciśnienia. Uszkodzoną, wybrzuszoną lub przeciętą oponę wymień.']]},
 {id:'vibration-rpm',title:'Wibracje zmieniają się wraz z obrotami',tags:'wibracje silnik wał sprzęgło mocowanie',areas:[['Rozróżnij','Ustal, czy wibracja występuje na postoju, na biegu, tylko podczas jazdy czy po konkretnym zakresie obrotów.'],['Możliwe przyczyny','Mocowania silnika, nierównomierna praca, wał/łożyska, sprzęgło, koła lub napęd — zależnie od warunków.'],['Nie ignoruj','Nagłe silne wibracje, metaliczny hałas lub luz koła wymagają przerwania jazdy i inspekcji.']]},
 {id:'clutch-bell-blue',title:'Dzwon sprzęgła siny lub przegrzany',tags:'cvt sprzęgło dzwon przebarwienia szarpanie',areas:[['Możliwe przyczyny','Poślizg, zużyte okładziny, nieprawidłowe obroty załączania, przeciążenie albo zabrudzenie powierzchni.'],['Kontrola','Sprawdź zgodność dzwonu, bicie, powierzchnię, okładziny i swobodę mechanizmu.'],['Montaż','Nie smaruj powierzchni ciernych. Moment dokręcania i limity bicia/średnicy z DTR.']]},
 {id:'variator-flatspots',title:'Rolki wariatora mają płaskie ścięcia',tags:'cvt rolki wariator flat spot obroty',areas:[['Objawy','Obroty falują, przyspieszenie staje się nierówne, a zmiana przełożenia jest skokowa.'],['Kontrola','Sprawdź masę/wymiar rolek wymagany przez producenta, rampy, prowadnice, tuleję i powierzchnie talerzy.'],['Uwaga tuningowa','Lżejsze rolki nie dodają automatycznie mocy i mogą podnosić obroty oraz temperaturę. Dobór wymaga pomiaru i testów.']]},
 {id:'cvt-no-engage',title:'CVT nie przenosi mocy na koło',tags:'cvt pasek zerwany sprzęgło przekładnia koło',areas:[['Bezpiecznie','Nie uruchamiaj napędu z otwartą pokrywą i nie zbliżaj rąk do ruchomych talerzy.'],['Możliwe przyczyny','Zerwany/źle osadzony pasek, uszkodzone sprzęgło, przekładnia końcowa lub napęd rozrusznika.'],['Potwierdzenie','Po odłączeniu zapłonu/akumulatora obejrzyj elementy i sprawdź opory ręcznie zgodnie z instrukcją.']]},
 {id:'intake-high-idle',title:'2T: wysokie obroty po odjęciu gazu — kontrola dolotu',tags:'2t lewe powietrze króciec ssący membrana gaźnik wysokie obroty',areas:[['Najpierw','Sprawdź, czy manetka i linka wracają swobodnie oraz czy przepustnica zamyka się całkowicie. Nie reguluj gaźnika, dopóki nie wykluczysz mechanicznego zacinania.'],['Możliwe przyczyny','Pęknięty króciec, uszczelka, przewód podciśnienia, uszczelniacz wału lub nieszczelny zawór membranowy. Objaw nie wskazuje automatycznie na konkretną część.'],['Potwierdzenie','Wykonaj próbę szczelności dolotu i skrzyni korbowej metodą przewidzianą dla silnika. Nie używaj płomienia ani łatwopalnego aerozolu. Przy podejrzeniu lewego powietrza nie obciążaj silnika — uboga mieszanka może doprowadzić do uszkodzenia.']]},
 {id:'carb-overflow-detailed',title:'Gaźnik przelewa paliwo — iglica i pływak',tags:'gaźnik przelewa paliwo zaworek iglicowy pływak 4sb-we419-00',areas:[['Natychmiast','Zamknij dopływ paliwa, wytrzyj rozlane paliwo i usuń źródła zapłonu. Nie uruchamiaj silnika przy wycieku lub mokrym filtrze/komorze.'],['Kontrola','Sprawdź brud pod iglicą, stan stożka i gniazda, swobodę ruchu pływaka oraz ewentualne uszkodzenie pływaka. W Aerox Naked 2013 katalog wskazuje zestaw 4SB-WE419-00, ale wymianę uzasadnia dopiero test.'],['Regulacja','Poziom pływaka i szczelność sprawdź według instrukcji właściwego gaźnika. Nie wyginaj blaszki „na oko”; uszkodzone gniazdo może wymagać naprawy gaźnika, a nie tylko iglicy.']]},
 {id:'carb-bogging',title:'Gaźnik: silnik dławi się przy dodaniu gazu',tags:'gaźnik dławi się dysza główna dysza pilotowa filtr powietrza ssanie membrana',areas:[['Podstawy','Sprawdź świecę, wkład filtra, przepływ paliwa, odpowietrzenie zbiornika, linkę/przepustnicę i nieszczelności dolotu. Ustal, czy objaw występuje na zimno, na ciepło, na postoju czy pod obciążeniem.'],['Gaźnik','Zweryfikuj drożność dysz i kanałów, poziom paliwa, iglicę oraz membranę gaźnika podciśnieniowego, jeśli występuje. Numery dysz i ustawienia dobieraj z diagramu/DTR dokładnej wersji, nie z podobnego skutera.'],['Nie stroić w ciemno','Nie zwiększaj dyszy tylko na podstawie „dziury” w przyspieszeniu. Najpierw wyklucz nieszczelność, zatkanie i problem z dopływem; błędna mieszanka może przegrzać silnik 2T.']]}

{id:'ignition-kickback',title:'Odbijanie kopniaka — sprawdź zgodność zapłonu',tags:'kickback kopniak CDI stator magneto zapłon',category:'Elektryka i zapłon',evidence:'partial',related:['no_start','weak-spark','intake-backfire','exhaust-backfire'],areas:[['Potwierdzenie','Nie potwierdzono, że każdy kickback wynika z uszkodzonego CDI.'],['Kontrola','Sprawdź zgodność CDI, statora i koła magnesowego oraz kąt zapłonu według dokumentacji modelu. Przy silnym odbijaniu przerwij próby.']]},
{id:'peugeot-aec400',title:'Peugeot AEC400 / immobilizer — sprawdź wersję',tags:'Peugeot AEC400 immobilizer immo CDI iskra',category:'Elektryka i zapłon',evidence:'unlinked',related:['no_start','weak-spark','intermittent-lights'],areas:[['Status źródła','Nie znalazłem instrukcji OEM potwierdzającej jako regułę objaw „jedna lub dwie iskry” jako pewną awarię AEC400.'],['Diagnostyka','Ustal model, rocznik i wersję modułu; użyj właściwego schematu. Nie obchodź immobilizera na podstawie samego objawu.']]},
{id:'peugeot-oil-pump-limp',title:'Peugeot: ograniczenie obrotów a pompa oleju — hipoteza',tags:'Peugeot pompa oleju ECU CDI obroty',category:'Paliwo i sterowanie',evidence:'unlinked',related:['low_power','no_start','carb-bogging'],areas:[['Status źródła','Nie potwierdziłem, że odłączenie pompy zawsze ogranicza obroty do 3500–4000 obr./min ani że uniwersalnym rozwiązaniem jest rezystor.'],['Bezpieczeństwo','Nie obchodź monitorowania smarowania; odczytaj błędy i sprawdź schemat konkretnej wersji.']]},
{id:'purejet-emulsion',title:'PureJet / DiTech: emulsja w przewodzie powietrznym',tags:'PureJet DiTech kompresor powietrze emulsja woda olej',category:'Wtrysk 2T / PureJet',evidence:'partial',related:['purejet-air-pressure-loss','low_power','no_start','fuel-starvation'],areas:[['Co potwierdza instrukcja','Serwisówka Piaggio NRG Power PureJet opisuje kontrolę ciśnienia, przewodów i uszczelnień.'],['Czego nie potwierdza','Nie znalazłem potwierdzenia, że biały osad jest typową przyczyną zatkania wtryskiwacza ani zalecenia montażu odwadniacza.']]},
{id:'purejet-air-pressure-loss',title:'PureJet: spadek ciśnienia / nieszczelność przy wtryskiwaczu',tags:'Piaggio NRG Power PureJet kompresor O-ring powietrze',category:'Wtrysk 2T / PureJet',evidence:'confirmed',source:{label:'Piaggio NRG Power PureJet Workshop Manual (2007), INJ PJ 48–49',url:'https://www.49ccscoot.com/manuals/Piaggio-NRG-Power-Purejet_Shop_Manual.pdf'},related:['purejet-emulsion','low_power','no_start','fuel-starvation'],areas:[['Procedura z serwisówki','Dla tego układu instrukcja podaje co najmniej 4 bar po 15 s kręcenia (minimum 500 obr./min) oraz 5–5,5 bar podczas pracy. Wartości dotyczą tej wersji układu.'],['Co sprawdzić','Skontroluj nieszczelność wtryskiwacza, O-ring przy wsporniku i uszczelnienie węża kompresora. Nie rozpinaj przewodów pod ciśnieniem.']]},
{id:'piston-reversed-yq50',title:'Montaż tłoka 2T: strzałka i zamki pierścieni',tags:'2T tłok pierścienie montaż cylinder wydech',category:'Silnik 2T',evidence:'confirmed',source:{label:'Yamaha YQ50 5BS-AE2 Service Manual (1997), ENG 4-37',url:'https://scootergrisen.org/scooterhjemmeside/download/yamaha_aerox_servicemanual.pdf'},related:['two-stroke-seizure','no_start','low_power'],areas:[['Potwierdzone dla YQ50','Serwisówka wymaga, aby strzałka tłoka wskazywała stronę wydechu i zamki pierścieni trafiały na kołki ustalające.'],['Ograniczenie','Sprawdź instrukcję konkretnego silnika i tłoka.']]},
{id:'sparkplug-reach-squish',title:'Świeca, zasięg gwintu i squish — potwierdź przed montażem',tags:'świeca BR8HS BR8ES szczelina gwint squish tłok',category:'Elektryka i zapłon',evidence:'partial',source:{label:'Yamaha YQ50 5BS-AE2 Service Manual (1997), ELEC 8-7–8-9',url:'https://scootergrisen.org/scooterhjemmeside/download/yamaha_aerox_servicemanual.pdf'},related:['weak-spark','no_start','two-stroke-seizure','ignition-kickback'],areas:[['Potwierdzone dla YQ50','Instrukcja podaje świecę NGK BR8HS i szczelinę 0,5–0,7 mm — tylko dla tej wersji.'],['Ograniczenie','Nie potwierdzono całej tezy o kontakcie tłoka z elektrodą przy konkretnym squish. Dobierz świecę według instrukcji silnika i cylindra.']]},
{id:'cvt-yq50-inspection',title:'CVT: pasek i sprzęgło — kontrola według serwisówki',tags:'CVT pasek wariator sprzęgło szczęki sprężyna',category:'CVT i napęd',evidence:'confirmed',source:{label:'Yamaha YQ50 5BS-AE2 Service Manual (1997), CVT',url:'https://scootergrisen.org/scooterhjemmeside/download/yamaha_aerox_servicemanual.pdf'},related:['revs_no_speed','belt_break','cvt-no-engage','clutch-bell-blue','variator-flatspots','vibration_noise'],areas:[['Dane dla YQ50','Instrukcja podaje szerokość paska 16,5 mm i limit 15,7 mm oraz limit grubości szczęki sprzęgła 1,0 mm.'],['Ograniczenie','Nie przenoś tych wartości na inny silnik lub wariator.']]},
{id:'dellorto-ecs',title:'Dell’Orto ECS: sterownik gaźnika elektronicznego',tags:'Dellorto ECS CLC_V504 elektroniczny gaźnik ECU Euro 4',category:'Paliwo i sterowanie',evidence:'partial',source:{label:'Dell’Orto E.C.S. EURO 4 short user manual (2024)',url:'https://www.immo-tools.lt/site/files/failai/ASW-NEXT/DELLORTO_ECS_UM.pdf'},related:['carb-bogging','fuel-starvation','low_power'],areas:[['Co potwierdza dokument','Instrukcja narzędzia potwierdza rodzinę sterowników ECS i ograniczenie pinoutu do danego wariantu; nie zastępuje serwisówki pojazdu.'],['Czego nie zakładać','Objaw braku mocy sam nie potwierdza uszkodzenia sondy lambda ani zalewania przez ECU. Najpierw odczytaj błędy i zidentyfikuj moduł.']]}

, {"id":"charging-no-rise","title":"Akumulator się rozładowuje — ładowanie nie rośnie","tags":"ładowanie akumulator regulator stator alternator napięcie","areas":[["Akumulator i połączenia","Sprawdź stan naładowania i kondycję akumulatora, klemy, przewód masowy, bezpiecznik główny i złącza ładowania. Korozja lub luźny styk może naśladować awarię regulatora."],["Układ ładowania","Porównaj napięcie akumulatora przy wyłączonym silniku i podczas pracy na obrotach wskazanych w instrukcji pojazdu. Jeśli napięcie nie zmienia się prawidłowo, zmierz wyjście statora i sprawdź regulator według schematu konkretnej wersji."],["Ważne","Nie podawaj uniwersalnych wartości dla każdego modelu. Użyj zakresu i obrotów z serwisówki. Nie odłączaj akumulatora przy pracującym silniku."]]},
 {"id":"charging-overvoltage","title":"Akumulator się przeładowuje lub przepalają się żarówki","tags":"przeładowanie regulator napięcia światła żarówki","areas":[["Pierwszy trop","Sprawdź masę regulatora, stan złączy, pinout i zgodność regulatora ze statorem oraz instalacją AC/DC. Nie zakładaj automatycznie, że winny jest sam regulator."],["Pomiary","Zmierz napięcie bezpośrednio na akumulatorze i w punktach instalacji zgodnie z serwisówką. Porównaj przy właściwych obrotach i obciążeniu."],["Bezpieczeństwo","Nie używaj pojazdu z potwierdzonym przeładowaniem: może uszkodzić akumulator i elektronikę. Nie zwieraj przewodów statora ani nie testuj pinów na chybił trafił."]]},
 {"id":"starter-clicks","title":"Słychać kliknięcie, ale rozrusznik nie kręci","tags":"rozrusznik klik przekaźnik akumulator masa","areas":[["Zasilanie","Naładuj i obciążeniowo sprawdź akumulator. Obejrzyj klemy, masę silnika, przewód dodatni oraz bezpiecznik główny."],["Przekaźnik i rozrusznik","Sprawdź, czy przekaźnik otrzymuje sygnał sterujący i czy napięcie pojawia się na jego wyjściu podczas próby. Zmierz spadki napięcia i sprawdź rozrusznik według schematu."],["Rozróżnienie","Pojedynczy klik może oznaczać słaby akumulator, słabe połączenie, uszkodzony przekaźnik, rozrusznik albo mechanicznie zablokowany silnik. Nie mostkuj przekaźnika bez procedury i zabezpieczenia pojazdu."]]},
 {"id":"starter-spins-no-crank","title":"Rozrusznik słychać, ale wał silnika się nie obraca","tags":"rozrusznik sprzęgło jednokierunkowe bendiks zębatka","areas":[["Napęd rozrusznika","Sprawdź sprzęgło jednokierunkowe, bendiks lub przekładnię, zęby i poprawność zazębienia — konstrukcja różni się zależnie od silnika."],["Mechanika","Przed rozbieraniem sprawdź, czy wał obraca się ręcznie zgodnie z procedurą serwisową. Jeżeli jest zablokowany, nie wymuszaj obrotu rozrusznikiem."],["Ograniczenie","Nie zakładaj jednej konstrukcji bendiksa dla wszystkich skuterów; porównaj schemat części konkretnego wariantu."]]},
 {"id":"carb-fuel-overflow","title":"Gaźnik przelewa paliwo lub benzyna kapie z przelewu","tags":"gaźnik przelewanie pływak iglica kranik paliwo","areas":[["Zamknij paliwo","Wyłącz silnik, odsuń źródła zapłonu i przewietrz miejsce pracy. Nie uruchamiaj pojazdu z wyciekiem paliwa."],["Gaźnik","Sprawdź szczelność iglicy zaworu pływakowego, swobodę ruchu pływaka, uszkodzenie pływaka, zabrudzenie gniazda i poziom pływaka według danych dla konkretnego gaźnika."],["Dopływ paliwa","Sprawdź kranik podciśnieniowy i przewody. Paliwo w przewodzie podciśnienia może wskazywać na uszkodzoną membranę kranika. Po naprawie sprawdź szczelność na postoju, zanim odpalisz silnik."]]},
 {"id":"fuel-starvation-high-rpm","title":"Silnik dławi się na wysokich obrotach lub pod obciążeniem","tags":"brak paliwa gaźnik filtr kranik odpowietrzenie zbiornika","areas":[["Zasilanie paliwem","Sprawdź odpowietrzenie zbiornika, filtr, przewody, kranik/pompę i swobodny przepływ. Objaw zanikający po odpuszczeniu gazu może wynikać z niedostatecznego uzupełniania paliwa."],["Gaźnik / EFI","W gaźniku sprawdź czystość dysz i poziom paliwa; w EFI odczytaj kody, sprawdź ciśnienie paliwa i parametry zgodnie z procedurą producenta."],["Nie zmieniaj od razu dyszy","Dławienie może też wynikać z zapłonu pod obciążeniem, nieszczelności, wydechu albo kompresji. Zmieniaj kalibrację tylko po ustaleniu przyczyny."]]},
 {"id":"idle-hangs-two-stroke","title":"W silniku 2T obroty pozostają wysokie po puszczeniu gazu","tags":"2T wysokie obroty lewe powietrze króciec uszczelniacz","areas":[["Najpierw bezpieczeństwo","Nie wykonuj długich prób drogowych. W 2T nieszczelność dolotu lub skrzyni korbowej może powodować ubogą mieszankę i ryzyko zatarcia."],["Kontrola","Sprawdź linkę i przepustnicę, króciec, opaski, uszczelki, przewody podciśnienia i uszczelniacze wału. Test szczelności skrzyni korbowej wykonuj odpowiednim przyrządem i ciśnieniem z procedury serwisowej."],["Gaźnik","Sprawdź ustawienie przepustnicy, dysze obwodu wolnych obrotów i mieszankę według konkretnego modelu. Nie traktuj wkrętu mieszanki jako uniwersalnej regulacji dla każdego gaźnika."]]},
 {"id":"two-stroke-overheat","title":"Silnik 2T mocno się grzeje, traci moc lub zaczyna przycierać","tags":"2T temperatura zatarcie tłok mieszanka zapłon chłodzenie","areas":[["Przerwij jazdę","Jeśli pojawia się nagły spadek mocy, metaliczny dźwięk, blokowanie koła lub ślady przycierania, wyłącz silnik i nie próbuj go wielokrotnie odpalać."],["Możliwe przyczyny","Sprawdź smarowanie, drożność chłodzenia, szczelność dolotu i skrzyni korbowej, dobór dyszy, zapłon, drożność wydechu oraz stan tłoka/cylindra."],["Potwierdzenie","Po ostygnięciu sprawdź kompresję, szczelność i ślady na tłoku. Nie wyciągaj wniosków wyłącznie z koloru świecy; parametry mieszanki i zapłonu potwierdź pomiarami i dokumentacją danego silnika."]]},
 {"id":"four-stroke-hard-start-valves","title":"Silnik 4T ciężko odpala na ciepło — podejrzenie luzów zaworowych","tags":"4T ciepły rozruch luzy zaworowe kompresja","areas":[["Kontrola zaworów","Za mały luz zaworowy może pogarszać rozruch i szczelność po rozgrzaniu. Zmierz luzy na zimnym silniku w położeniu wymaganym przez serwisówkę."],["Nie reguluj w ciemno","Wartości i temperatura pomiaru zależą od kodu silnika. Nie stosuj liczb z innego rocznika ani modelu."],["Dalsza diagnostyka","Jeżeli luzy są prawidłowe, sprawdź akumulator/rozrusznik, kompresję, układ paliwowy, iskrę na gorąco i poprawność ustawienia rozrządu."]]},
 {"id":"lights-intermittent","title":"Światła migają lub gasną po poruszeniu kierownicą","tags":"światła wiązka masa stacyjka złącze kierownica","areas":[["Wiązka i złącza","Sprawdź przewody przy główce ramy, stacyjce, manetkach, złącza reflektora i punkty masowe. Szukaj przetarć, napiętej wiązki i śladów wilgoci."],["Pomiary","Sprawdź spadki napięcia na zasilaniu i masie, a następnie ciągłość przewodu w bezpiecznych warunkach. Rozróżnij instalację oświetlenia AC i DC."],["Bezpieczeństwo","Usterka oświetlenia może być niebezpieczna po zmroku. Nie zwieraj przewodów i nie dobieraj pinów tylko po kolorach izolacji."]]},
 {"id":"spark-intermittent-bumps","title":"Iskra zanika na wybojach lub przy poruszaniu wiązką","tags":"iskra przerywa masa fajka cewka CDI wiązka","areas":[["Zacznij od podstaw","Sprawdź fajkę, przewód WN, połączenie cewki, masę silnika, złącza CDI/ECU i przewód gaszenia."],["Lokalizacja","Użyj testera iskry i schematu. Poruszaj wiązką ostrożnie na postoju, nie dotykaj przewodu WN i elementów ruchomych."],["Interpretacja","Nagłe zaniki mogą pochodzić z luźnego styku, przewodu przetartego do masy, uszkodzonej fajki albo elementu zapłonu. Nie wymieniaj CDI przed sprawdzeniem zasilania i impulsatora."]]},
 {"id":"rear-wheel-binding","title":"Tylne koło obraca się ciężko po naprawie CVT lub hamulca","tags":"tylne koło opór łożysko hamulec CVT sprzęgło","areas":[["Nie jedź próbnie","Jeśli koło mocno się blokuje, hamulec grzeje się lub słychać tarcie, nie używaj pojazdu do czasu ustalenia przyczyny."],["Wyklucz błędy montażu","Sprawdź poprawne ułożenie tulei, podkładek, dystansów, nakrętki, przekładni, bębna/tarczy i zacisku. Moment dokręcania bierz wyłącznie z instrukcji modelowej."],["Oddziel układy","Wykonuj kontrolę zgodnie z procedurą serwisową, rozróżniając opór przekładni/CVT od hamulca i łożysk. Nie uruchamiaj silnika ze zdjętą pokrywą napędu."]]},
 {"id":"brake-overheating","title":"Hamulec grzeje się, trze lub koło nie zwalnia","tags":"hamulec tarcie zacisk tłoczek przewód linka","areas":[["Przerwij użytkowanie","Nadmierne grzanie, spadek skuteczności lub blokowanie hamulca oznacza ryzyko utraty kontroli. Nie dotykaj gorącej tarczy/bębna."],["Kontrola mechaniczna","Sprawdź swobodę ruchu linki/dźwigni, powrót tłoczka, prowadnice zacisku, ułożenie klocków/szczęk, bicie tarczy i uszkodzenia przewodu."],["Układ hydrauliczny","Jeżeli podejrzewasz zatrzymane ciśnienie, diagnostykę wykonuj według procedury serwisowej. Po każdej naprawie sprawdź hamowanie w bezpiecznych, kontrolowanych warunkach."]]},
 {"id":"coolant-overheating","title":"Silnik 4T z chłodzeniem cieczą przegrzewa się","tags":"chłodzenie cieczą temperatura wentylator termostat pompa","areas":[["Przerwij jazdę","Nie otwieraj korka gorącego układu chłodzenia. Poczekaj aż silnik ostygnie; przegrzewanie może prowadzić do poważnych uszkodzeń."],["Po ostygnięciu","Sprawdź poziom i stan płynu, wycieki, chłodnicę, działanie wentylatora, bezpiecznik, czujnik i przepływ układu zgodnie z instrukcją."],["Dalsze tropy","Możliwe są termostat, pompa, zapowietrzenie, zator chłodnicy lub przedmuch do układu. Testy ciśnienia i obecności spalin wykonuj odpowiednim wyposażeniem."]]},
 {"id":"oil-leak-crankcase","title":"Wyciek oleju z silnika lub przekładni","tags":"wyciek olej uszczelniacz korek uszczelka przekładnia","areas":[["Zidentyfikuj źródło","Oczyść zewnętrzną powierzchnię, osusz i ustal miejsce początku wycieku. Sprawdź korek spustowy, pokrywę, uszczelniacze, uszczelki i odpowietrzenie."],["Oddziel oleje","W skuterze silnik i przekładnia końcowa mogą mieć osobne smarowanie. Zidentyfikuj dokładnie, skąd ubywa płyn, zanim go uzupełnisz."],["Nie maskuj objawu","Kontroluj poziom zgodnie z procedurą. Jeśli poziom jest poniżej minimum, olej trafia na oponę/hamulec lub wyciek jest znaczny, nie używaj pojazdu."]]},
 {"id":"fuel-smell-leak","title":"Czuć benzynę przy skuterze lub w garażu","tags":"benzyna wyciek zapach paliwa przewód zbiornik gaźnik","areas":[["Natychmiast","Nie uruchamiaj silnika, nie pal, nie przełączaj urządzeń mogących iskrzyć przy silnym zapachu. Zamknij dopływ paliwa, jeśli można to zrobić bezpiecznie, i przewietrz miejsce."],["Kontrola po zabezpieczeniu","Sprawdź przewody, opaski, zbiornik, kranik, filtr, gaźnik i przelew. Ślady paliwa w oleju silnikowym wymagają wyjaśnienia przed kolejnym uruchomieniem."],["Potwierdzenie","Nie sprawdzaj szczelności płomieniem ani przez długie uruchamianie. Po naprawie wykonaj kontrolę szczelności na postoju."]]},
 {"id":"efi-idle-surge","title":"Obroty w silniku EFI falują na biegu jałowym","tags":"EFI wtrysk falowanie obrotów TPS MAP sonda lambda","areas":[["Odczyt błędów","Zacznij od kodów usterek i danych bieżących sterownika, jeśli są dostępne. Zapisz kody przed ich kasowaniem."],["Kontrole podstawowe","Sprawdź szczelność dolotu, filtr, przewody podciśnienia, zasilanie/masę ECU, złącza czujników i stan przepustnicy zgodnie z instrukcją."],["Uwaga","Nie wymieniaj TPS, MAP ani sondy lambda tylko na podstawie falowania. Wartości graniczne, procedura adaptacji i pinout są zależne od modelu."]]},
 {"id":"engine-noise-sudden","title":"Nagły metaliczny hałas z silnika","tags":"metaliczny stuk łożysko korbowód tłok rozrząd","areas":[["Przerwij pracę","Nagły twardy stuk, zatarcie, spadek ciśnienia oleju lub blokowanie wału wymaga wyłączenia silnika. Nie podnoś obrotów, by „sprawdzić, czy przejdzie”."],["Rozróżnij źródła","Sprawdź poziom oleju, luźne osłony, wydech i napęd zewnętrzny; następnie, zgodnie z procedurą, luz łożysk, rozrząd, zawory, tłok i wał."],["Potwierdzenie","Oceniaj hałas wraz z objawami, pomiarami i inspekcją. Sam dźwięk nagrania nie potwierdza konkretnej uszkodzonej części."]]},
 {"id":"compression-low","title":"Kompresja jest niska lub silnik nie trzyma ciśnienia","tags":"kompresja tester pierścienie zawory uszczelniacze 2T 4T","areas":[["Warunki pomiaru","Użyj właściwego testera, adaptera i procedury dla konkretnego silnika. Położenie przepustnicy, temperatura, prędkość rozrusznika i konstrukcja silnika wpływają na wynik."],["Możliwe przyczyny 4T","Nieszczelne zawory, niewłaściwe luzy, pierścienie/tłok, cylinder, uszczelka głowicy lub błąd rozrządu."],["Możliwe przyczyny 2T","Zużycie pierścieni/tłoka/cylindra, uszkodzenia gładzi albo problem z uszczelnieniem skrzyni korbowej. Sam test kompresji nie potwierdza szczelności skrzyni w 2T."],["Dalsze testy","Porównaj wynik z dokumentacją modelu. W razie potrzeby wykonaj leak-down lub test szczelności zgodnie z bezpieczną procedurą."]]},
 {"id":"engine-dies-after-wash","title":"Silnik nie odpala lub przerywa po myciu deszczem","tags":"wilgoć zapłon złącza fajka cewka woda","areas":[["Osusz","Nie rób kolejnych prób, jeśli woda mogła dostać się do dolotu, złączy lub osprzętu elektrycznego. Zabezpiecz zapłon i sprawdź filtr powietrza."],["Elektryka","Obejrzyj fajkę, przewód WN, cewkę, złącza CDI/ECU, wtyczki czujników i masy; osusz i sprawdź korozję lub pęknięte osłony."],["Dopiero po kontroli","Jeśli objaw pozostaje, sprawdź iskrę, paliwo i kompresję w standardowej kolejności. Nie rozłączaj wtyczek przy włączonym zapłonie, jeżeli instrukcja tego zabrania."]]}
 ,{"id":"auto-choke-ptc-fault","title":"Ssanie automatyczne (PTC): zalewanie na ciepło lub trudny rozruch na zimno","tags":"ssanie automatyczne elektrozawór PTC gaźnik zalewa zimny rozruch grzałka","category":"Paliwo i gaźnik","evidence":"partial","related":["carb-bogging","stall_hot","no_start","fuel-starvation"],"areas":[["Jak działa ssanie PTC","W większości gaźników skuterowych 2T i 4T elektrozawór ssania jest domyślnie otwarty na zimnym silniku (iglica cofnięta). Po uruchomieniu prąd ze statora AC lub po stacyjce DC nagrzewa element PTC, wosk pęcznieje i w ciągu kilku minut wysuwa iglicę, zamykając kanał wzbogacania."],["Objawy awarii","Jeśli do ssania nie dociera napięcie lub grzałka PTC ma przerwę, ssanie pozostaje stale otwarte: zimny silnik odpala od razu, ale po rozgrzaniu dusi się, kopci, pali znacznie więcej i gaśnie na wolnych obrotach. Jeśli tłoczek zaciął się w pozycji wysuniętej — zimny silnik bardzo ciężko odpala."],["Diagnostyka i bezpieczeństwo","Zmierz rezystancję zimnego ssania multimetrem (przerwa OL oznacza uszkodzenie) oraz napięcie na wtyczce przy pracującym silniku zgodnie ze schematem DTR. Sprawdź też O-ring obudowy ssania i drożność dyszy rozruchowej w komorze pływakowej."]]}
 ,{"id":"vacuum-petcock-diaphragm","title":"Kranik podciśnieniowy: brak podawania paliwa lub benzyna w wężyku podciśnienia","tags":"kranik podciśnieniowy membrana paliwo podciśnienie króciec zalewanie","category":"Paliwo i gaźnik","evidence":"partial","related":["carb-fuel-overflow","fuel-starvation","no_start","fuel-smell-leak"],"areas":[["Brak podawania paliwa","Pęknięty lub zsunięty wężyk podciśnienia, zatkane sitko w zbiorniku albo sklejona membrana uniemożliwiają otwarcie kranika podczas kręcenia rozrusznikiem. W silniku 2T zbyt słaby impuls podciśnienia może też wynikać z nieszczelnych uszczelniaczy wału."],["Pęknięta membrana (zalewanie)","Gdy membrana wewnątrz kranika pęknie, benzyna przedostaje się dolnym wężykiem podciśnienia bezpośrednio do króćca ssącego, zalewając świecę, skrzynię korbową 2T lub rozrzedzając olej silnikowy w 4T."],["Kontrola na postoju","Przy wyłączonym silniku i zachowaniu zasad ppoż. odłącz przewody od gaźnika: z króćca paliwowego nie może płynąć paliwo samoczynnie, a wężyk podciśnienia musi być wewnątrz całkowicie suchy. W razie obecności paliwa w oleju 4T wymień olej przed uruchomieniem."]]}
 ,{"id":"cvk-diaphragm-tear","title":"Gaźnik podciśnieniowy (CVK 4T): brak reakcji po otwarciu gazu powyżej 1/3","tags":"gaźnik podciśnieniowy CVK membrana przepustnica 4T GY6 brak mocy iglica","category":"Paliwo i gaźnik","evidence":"partial","related":["low_power","carb-bogging","fuel-starvation-high-rpm"],"areas":[["Objaw charakterystyczny","Silnik odpala poprawnie, równo pracuje na wolnych obrotach i reaguje na delikatne muśnięcie manetki, ale po głębszym odkręceniu gazu buczy, nie wkręca się na obroty i nie przyspiesza."],["Przyczyna w gaźniku CVK","Pęknięta, sparciała lub źle ułożona pod pokrywką gumowa membrana przepustnicy podciśnieniowej, wypadnięta zapinka iglicy lub zatkany kanał podciśnieniowy w tłoczku. Bez szczelności nad membraną podciśnienie nie unosi przepustnicy z iglicą."],["Weryfikacja","Zdejmij górną pokrywkę gaźnika CVK (uważając na sprężynę), obejrzyj membranę pod światło, sprawdź osadzenie małego O-ringu kanału podciśnienia pod pokrywką oraz płynność ruchu tłoczka w korpusie."]]}
 ,{"id":"torque-driver-grooves","title":"Korektor momentu obrotowego CVT: dziura w przyspieszeniu i skokowa zmiana przełożenia","tags":"CVT korektor momentu talerze tylne kołki rowki sprężyna centralna szarpanie","category":"CVT i napęd","evidence":"partial","related":["revs_no_speed","vibration_noise","variator-flatspots","belt_break"],"areas":[["Rola korektora momentu","Tylne koło pasowe pod sprzęgłem (korektor momentu) współpracuje ze sprężyną centralną i kołkami prowadzącymi w skośnych rowkach, utrzymując napięcie paska i redukując przełożenie pod obciążeniem."],["Typowe zużycie","Wytarty smar pod tuleją osłonową, wyrobione progi w rowkach prowadzących kołki lub pęknięta sprężyna centralna powodują zacinanie się talerzy w jednym położeniu — skuter ma wyraźną „dziurę” przy 30–40 km/h lub nie redukuje przełożenia pod górę."],["Serwis i bezpieczeństwo","Demontaż nakrętki sprzęgła wykonuj z właściwym przyrządem przytrzymującym sprężynę centralną (wysokie napięcie wstępne sprężyny!). Używaj wyłącznie smaru wysokotemperaturowego wewnątrz rowków i uszczelnień, tak aby siła odśrodkowa nie wyrzuciła go na pasek i dzwon."]]}
 ,{"id":"cvt-clutch-bearing-noise","title":"Szum lub metaliczne tarcie z tyłu skutera na postoju (łożyska sprzęgła CVT)","tags":"CVT łożysko igiełkowe sprzęgło szum na postoju tylne koło korektor","category":"CVT i napęd","evidence":"partial","related":["vibration_noise","rear-wheel-binding","wheel-bearing"],"areas":[["Jak odróżnić od przekładni końcowej","Na postoju przy pracującym silniku pasek obraca korektor momentu ze sprzęgłem, podczas gdy dzwon i wałek przekładni końcowej stoją nieruchomo. Szum słyszalny na postoju i cichnący po zapięciu sprzęgła wskazuje na łożysko igiełkowe/kulkowe wewnątrz zespołu sprzęgła."],["Gdy hałas rośnie wraz z prędkością koła","Jeżeli wycie pojawia się dopiero podczas toczenia pojazdu (również po zgaszeniu silnika), sprawdź łożyska przekładni końcowej, poziom oleju przekładniowego i łożysko osi koła."],["Kontrola","Zdejmij pokrywę CVT i zespół sprzęgła, obróć palcami tuleję wewnętrzną korektora momentu i sprawdź stan łożysk oraz czy odkręcająca się nakrętka sprzęgła nie ociera o wnętrze dzwonu."]]}
 ,{"id":"final-drive-seal-leak","title":"Olej z przekładni końcowej na feldze lub szczękach/tarczy tylnego hamulca","tags":"wyciek olej przekładniowy uszczelniacz simering tylny hamulec szczęki przekładnia","category":"Smarowanie","evidence":"partial","related":["oil-leak-crankcase","brake-overheating","rear-wheel-binding"],"areas":[["Zagrożenie bezpieczeństwa","Olej przekładniowy wyciekający przez zużyty uszczelniacz osi tylnego koła lub wałka sprzęgłowego trafia bezpośrednio do bębna hamulcowego, na tarczę lub na oponę. Nie kontynuuj jazdy z zaolejonym hamulcem lub oponą!"],["Przyczyny wycieku","Wyrobiony uszczelniacz (simering), luz na łożysku osi koła, zatkany odpowietrznik skrzyni przekładniowej powodujący wzrost ciśnienia po nagrzaniu albo zalanie zbyt dużej ilości oleju."],["Naprawa","Sprawdź luz łożyska osi, udrożnij odpowietrznik przekładni, wymień uszczelniacz i uzupełnij olej przekładniowy ściśle wg DTR. Zaolejone szczęki lub klocki hamulcowe bezwzględnie wymień na nowe (samo odtłuszczenie nasączonej okładziny jest nieskuteczne)."]]}
 ,{"id":"crankcase-breather-oil","title":"Olej silnikowy w obudowie filtra powietrza (odma / przedmuchy 4T)","tags":"odma olej w filtrze powietrza 4T przedmuchy pierścienie odpowietrzenie skrzyni","category":"Smarowanie","evidence":"partial","related":["oil-smoke","compression-low","oil-leak-crankcase"],"areas":[["Skąd bierze się olej w airboxie","Wąż odpowietrzenia skrzyni korbowej (odma) w 4T jest połączony z obudową filtra powietrza. Niewielka mgiełka olejowa bywa normalna, ale kałuża oleju zalewająca wkład filtra oznacza usterkę."],["Główne przyczyny","1) Zbyt wysoki poziom oleju silnikowego (przelany ponad MAX lub rozrzedzony benzyną); 2) Nadciśnienie w karterze przez zużyte pierścienie tłokowe/cylinder (przedmuchy spalin); 3) Zatkany separator w pokrywie zaworów lub przewrócenie skutera."],["Kolejność diagnostyki","Sprawdź poziom i zapach oleju na bagnecie wg procedury DTR (wkręcany vs przykładany bagnet!), oczyść obudowę filtra i wężyk spustowy, a przy nawrocie wykonaj test kompresji i próbę szczelności cylindra (leak-down)."]]}
 ,{"id":"timing-chain-tensioner-4t","title":"Grzechotanie z silnika 4T przy schodzeniu z obrotów (łańcuch i napinacz rozrządu)","tags":"łańcuch rozrządu napinacz ślizgi 4T grzechotanie fazy rozrządu GY6","category":"Silnik 4T","evidence":"partial","related":["four-stroke-valves","engine-noise-sudden","intake-backfire"],"areas":[["Objaw","Metaliczny szelest lub klekot z bocznej części cylindra/głowicy, szczególnie wyraźny po odpuszczeniu gazu, gdy napięta gałąź łańcucha rozrządu luzuje się."],["Ryzyko przeskoczenia rozrządu","Wyciągnięty łańcuch rozrządu, pęknięta sprężyna zapadkowego napinacza lub wytarte ślizgi mogą doprowadzić do przeskoczenia łańcucha o ząb, utraty kompresji i kolizji tłoka z zaworami."],["Zasada montażu napinacza","Nigdy nie wkręcaj napinacza automatycznego z wysuniętym trzpieniem — przed montażem cofnij i zablokuj trzpień napinacza, przykręć korpus do cylindra z nową uszczelką i dopiero wtedy zwolnij sprężynę dociskową, po czym obróć wał ręcznie i sprawdź znaki rozrządu."]]}
 ,{"id":"burnt-exhaust-valve-4t","title":"Wypalone lub nieszczelne gniazdo zaworowe 4T — brak kompresji mimo ustawienia luzu","tags":"zawór wydechowy gniazdo zaworowe 4T brak kompresji luzy zaworowe gaśnie","category":"Silnik 4T","evidence":"partial","related":["four-stroke-valves","four-stroke-hard-start-valves","compression-low","stall_hot"],"areas":[["Dlaczego sama regulacja nie pomaga","Długotrwała jazda ze zbyt małym (podpartym) luzem zaworowym uniemożliwia oddawanie ciepła z grzybka zaworu do gniazda w głowicy. Prowadzi to do nadpalenia przylgni zaworu wydechowego lub osiadania gniazda."],["Objawy","Niska kompresja, trudny rozruch, niestabilny bieg jałowy i brak poprawy po ustawieniu prawidłowego luzu szczelinomierzem na zimnym silniku."],["Potwierdzenie","Wykonaj test szczelności cylindra sprężonym powietrzem w GMP suwu pracy (przy zablokowanym wale) — ucieczka powietrza do tłumika wskazuje na nieszczelny zawór wydechowy, a do króćca ssącego na zawór dolotowy. Wymaga demontażu głowicy i weryfikacji prowadnic oraz przylgni."]]}
 ,{"id":"exhaust-clogged-carbon-2t","title":"Zapchany nagarem wydech lub katalizator 2T — silnik odpala, ale dusi się i syczy","tags":"wydech 2T zapchany nagar katalizator dyfuzor brak mocy dusi się","category":"Silnik 2T","evidence":"partial","related":["low_power","two-stroke-overheat","carb-bogging"],"areas":[["Objawy zatkanego wydechu","Silnik 2T odpala i pracuje na niskich obrotach, ale po dodaniu gazu dławi się, nie osiąga obrotów mocy, mocno się grzeje, a z okolic połączenia cylindra z wydechem słychać głośne syczenie spalin."],["Przyczyny","Nadmiar oleju w mieszance, stosowanie niskiej jakości oleju mineralnego, jazda wyłącznie na krótkich odcinkach lub zapchanie wkładu katalizatora / rurki końcowej tłumika oraz okna wydechowego w cylindrze."],["Bezpieczna weryfikacja","Zdemontuj tłumik, sprawdź drożność przelotu i obejrzyj okno wydechowe cylindra (ustaw tłok w GMP, aby okruchy nagaru nie wpadły do cylindra!). Nigdy nie wlewaj benzyny ani rozpuszczalników do tłumika w celu wypalania!"]]}
 ,{"id":"reed-valve-petals-2t","title":"Uszkodzone listki zaworu membranowego 2T — cofanie mieszanki do filtra i słaby dół","tags":"zawór membranowy membrana 2T listki karbonowe mokry filtr powietrza brak mocy","category":"Silnik 2T","evidence":"partial","related":["low_power","no_start","two-stroke-air-leak","carb-bogging"],"areas":[["Zadanie zaworu membranowego","Zawór płatkowy (membranowy) między gaźnikiem a skrzynią korbową 2T działa jak zawór zwrotny — wpuszcza mieszankę przy ruchu tłoka w górę i zamyka się przy wstępnym sprężaniu w karterze."],["Objawy nieszczelności","Ciężki rozruch bez zatkania dolotu, zalewanie świecy na niskich obrotach, głośne „plucie” mieszanką z powrotem przez gaźnik (filtr powietrza mocno nasiąknięty benzyną z olejem) oraz ospała reakcja na gaz z dołu."],["Inspekcja","Wyjmij domek membranowy i obejrzyj listki pod światło — muszą przylegać równomiernie na całym obwodzie bez wyszczerbień i pęknięć. Uszkodzone metalowe listki należy bezwzględnie wymienić przed zassaniem odłamka do karteru."]]}
 ,{"id":"crankshaft-bearings-play","title":"Huczenie z dołu silnika rosnące z obrotami — zużyte łożyska wału korbowego","tags":"łożyska wału korbowego huczenie szum luz na wale uszczelniacze 2T 4T","category":"Diagnostyka ogólna","evidence":"partial","related":["engine-noise-sudden","vibration-rpm","two-stroke-air-leak"],"areas":[["Jak rozpoznać","Głęboki, metaliczny szum lub gruchotanie z karterów zmieniające częstotliwość ściśle z obrotami silnika (niezależnie od prędkości jazdy i również po zdjęciu paska CVT)."],["Konsekwencje w 2T i 4T","Promieniowy luz na czopach wału niszczy wargi uszczelniaczy (w 2T powoduje lewe powietrze i zatarcie tłoka!) oraz zmienia szczelinę między kołem magnesowym a impulsatorem/statorem, prowadząc do zaniku iskry lub tarcia magneta o cewki."],["Kontrola","Przy wyłączonym silniku zdejmij pokrywę CVT i pasek oraz osłonę wentylatora magneta. Chwyć za końcówkę wału od strony wariatora oraz za koło magnesowe i sprawdź wyczuwalny luz góra–dół (promieniowy)."]]}
 ,{"id":"flywheel-woodruff-key","title":"Zerwany klin koła magnesowego — przestawiony zapłon, strzały lub brak rozruchu mimo iskry","tags":"klin koła magnesowego magneto zapłon strzały w wydech brak rozruchu iskra jest","category":"Elektryka i zapłon","evidence":"partial","related":["no_start","ignition-kickback","intake-backfire","exhaust-backfire"],"areas":[["Dlaczego iskra jest, a silnik nie pali","Klin wpustowy na stożku wału korbowego ustala położenie koła magnesowego względem GMP tłoka. Jeśli koło obróci się na stożku po ścięciu klina, iskra nadal przeskakuje na świecy, ale w zupełnie niewłaściwym momencie suwu!"],["Typowe objawy","Głośne strzały w tłumik lub gaźnik podczas kręcenia, gwałtowne odbijanie kopniaka (kickback) albo całkowity brak zapłonu mieszanki mimo nowej świecy, sprawnego gaźnika i dobrej kompresji."],["Montaż stożka","Zdejmij koło magnesowe dedykowanym ściągaczem (nie podważaj łomem o karter!). Stożek wału i piastę magneta odtłuść do sucha — to zacisk stożka dokręconego momentem z DTR przenosi moment obrotowy, a klin służy wyłącznie do pozycjonowania."]]}
 ,{"id":"ignition-switch-short-rain","title":"Przepalanie bezpiecznika głównego po przekręceniu kluczyka lub po deszczu","tags":"bezpiecznik zwarcie stacyjka wiązka główka ramy deszcz brak prądu","category":"Elektryka i ładowanie","evidence":"partial","related":["lights-intermittent","engine-dies-after-wash","battery-drain"],"areas":[["Nie zakładaj większego bezpiecznika","Zastąpienie przepalonego bezpiecznika drutem lub wkładką o wyższym amperażu grozi stopieniem wiązki i pożarem pod osłonami."],["Kiedy przepala bezpiecznik","Jeżeli bezpiecznik pali się jeszcze przed przekręceniem kluczyka — zwarcie leży na linii stałego plusa (akumulator → regulator napięcia → stacyjka). Jeżeli pali się dopiero po przekręceniu kluczyka na ON — zwarcie jest w obwodzie po stacyjce (przetarta wiązka przy główce ramy, czujnik STOP, przerywacz, klakson, DC-CDI lub podgrzewacz)."],["Bezpieczne szukanie zwarcia","W miejsce bezpiecznika wepnij próbną żarówkę 12 V / 21 W (ogranicza prąd zwarcia): dopóki zwarcie trwa, żarówka świeci jasno. Odpinaj kolejne podzespoły i poruszaj wiązką przy kierownicy, aż żarówka przygaśnie."]]}
 ,{"id":"sidestand-switch-cutout","title":"Silnik przerywa lub gaśnie na wybojach — czujnik stopki bocznej (side-stand switch)","tags":"stopka boczna czujnik stopki gaśnie na dziurach brak iskry blokada rozruchu","category":"Elektryka i zapłon","evidence":"partial","related":["spark-intermittent-bumps","no_start","engine-dies-after-wash"],"areas":[["Mechanizm usterki","Czujnik przy stopce bocznej pracuje w strefie narażonej na wodę, błoto, sól i uderzenia kamieni. Osłabiona sprężyna stopki lub wytarty trzpień czujnika sprawia, że na nierównościach stopka drga i na ułamek sekundy odcina zapłon."],["Diagnostyka","Sprawdź naciąg sprężyny stopki bocznej, luz na sworzniu, czystość trzpienia wyłącznika oraz rezystancję styków multimetrem zgodnie z logiką schematu DTR."],["Bezpieczeństwo","W razie uszkodzenia czujnika wymień go na sprawny i napraw sprężynę stopki. Nie pozostawiaj zmostkowanego na stałe czujnika stopki bocznej — jazda z opuszczoną stopką w zakręcie w lewo grozi wywrotką."]]}
 ,{"id":"ballast-resistor-ac-lights","title":"Przepalanie żarówek lub przegrzewanie regulatora — opornik balastowy AC","tags":"rezystor opornik balastowy światła AC żarówki przepalają się regulator","category":"Elektryka i ładowanie","evidence":"partial","related":["charging-overvoltage","intermittent-lights","overcharge"],"areas":[["Po co w skuterze jest duży ceramiczny rezystor","W wielu instalacjach z oświetleniem AC przełącznik świateł w pozycji „OFF” (dzień) przełącza uzwojenie świetlne statora na rezystor mocy przykręcony do ramy, aby utrzymać obciążenie cewki i odciążyć regulator. Drugi mniejszy rezystor bywa stosowany w obwodzie ssania PTC."],["Typowe usterki","Urwany przewód przy rezystorze, pęknięty wkład ceramiczny, skorodowana masa regulatora albo montaż żarówek o niewłaściwej mocy (np. LED w obwodzie AC bez obciążenia) powodują skoki napięcia i palenie żarówek."],["Pomiary","Zmierz rezystancję opornika na odłączonej wtyczce po ostygnięciu (uwaga: po pracy silnika rezystor jest bardzo gorący!) i porównaj z DTR modelu."]]}
 ,{"id":"seized-variator-rear-spline","title":"Zapieczony wielowypust wału lub osi tylnego koła — trudny demontaż wariatora lub koła","tags":"zapieczony wielowypust wariator tuleja oś tylnego koła wydech wahacz demontaż","category":"CVT i napęd","evidence":"partial","related":["rear-wheel-binding","vibration_noise","wheel-bearing"],"areas":[["Skąd problem z demontażem","Korozja cierna na suchym wielowypuście osi tylnego koła (szczególnie w skuterach z dodatkowym łożyskiem w pokrywie CVT lub prawym wahaczem) oraz zadziory na wielowypuście wału korbowego po pracy z poluzowaną nakrętką wariatora."],["Czego NIE robić","Nie uderzaj młotkiem bezpośrednio w gwint czopa wału korbowego ani osi koła i nie podważaj aluminiowych talerzy wariatora śrubokrętami o karter — skrzywisz wał lub wyłamiesz karter."],["Prawidłowe postępowanie","Stosuj penetrator odrdzewiający i ściągacz trójramienny oparty o piastę (z nakręconą nakrętką chroniącą gwint). Przed ponownym montażem oczyść wielowypust szczotką, sprawdź pasowanie na sucho, nałóż cienką warstwę pasty montażowej tylko na wielowypust osi koła (z dala od hamulca i paska CVT!) i dokręć nakrętkę kluczem dynamometrycznym wg DTR."]]}
 ,{"id":"speedometer-drive-vss","title":"Licznik nie pokazuje prędkości — ślimak mechaniczny lub czujnik Halla / VSS","tags":"prędkościomierz licznik nie działa ślimak linka czujnik prędkości VSS Halla","category":"Elektryka i ładowanie","evidence":"partial","related":["wheel-bearing","lights-intermittent"],"areas":[["Napęd mechaniczny (linka + ślimak)","Wykręć dolną końcówkę linki przy przednim kole: jeśli wkład linki jest ukręcony — wymień linkę; jeśli linka obraca licznik, a ślimak przy obrocie koła stoi — sprawdź wygięte blaszki zabieraka w piaście koła lub wytarte zęby plastikowej przekładni ślimaka (częsty skutek złego ułożenia wypustów przy montażu koła)."],["Napęd elektroniczny (czujnik VSS / Halla)","Sprawdź przewód czujnika przy goleni widelca (często łamie się wewnątrz izolacji od pracy zawieszenia), oczyść czoło czujnika i magnesy w piaście oraz zweryfikuj napięcie zasilania i impulsy wg DTR."],["Po serwisie koła","Upewnij się, że wypusty obudowy ślimaka trafiły w zderzak na goleni widelca przed dokręceniem osi koła."]]}
 ,{"id":"warped-brake-disc-pulsing","title":"Pulsowanie klamki hamulca i szarpanie przy dohamowywaniu — bicie tarczy hamulcowej","tags":"tarcza hamulcowa krzywa bicie pulsowanie klamki hamulec szarpie zacisk","category":"Hamulce i bezpieczeństwo","evidence":"partial","related":["brake-overheating","brakes-pull","brake-soft"],"areas":[["Objaw","Rytmiczne wypychanie dźwigni hamulca (pulsowanie na klamce) i drgania przodu przy lekkim i średnim hamowaniu, o częstotliwości zależnej od prędkości obrotu koła."],["Przyczyny","Przegrzana i zwichrowana tarcza hamulcowa, odkształcenie tarczy po próbie ruszenia z założoną blokadą tarczy (disc-lock), zabrudzona płaszczyzna osadzenia tarczy na piaście lub zapieczone prowadnice zacisku pływającego."],["Kontrola i naprawa","Zmierz bicie boczne tarczy czujnikiem zegarowym oraz jej grubość minimalną (limit MIN TH wytłoczony na tarczy lub w DTR). Oczyść piastę przed montażem nowej tarczy, dokręć śruby na krzyż momentem z DTR i użyj zabezpieczenia gwintu wskazanego przez producenta."]]}
 ,{"id":"gearbox-oil-emulsion","title":"Mleczna emulsja („masło”) w oleju przekładniowym lub silnikowym po deszczu / myciu","tags":"emulsja woda w oleju mleczny olej przekładnia pompa wody odpowietrznik","category":"Smarowanie","evidence":"partial","related":["oil-leak-crankcase","coolant-loss","coolant-overheating"],"areas":[["W przekładni końcowej skutera","Biało-kremowy olej po spuszczeniu ze skrzyni przekładniowej oznacza dostanie się wody — najczęściej przez pęknięty lub brakujący wężyk odpowietrznika przekładni (woda z tylnego koła lub myjki ciśnieniowej trafia prosto do karteru)."],["W silniku 4T chłodzonym cieczą (LC)","Jeśli mleczna emulsja pojawiła się w oleju silnikowym 4T LC, a jednocześnie ubywa płynu chłodniczego — sprawdź uszczelniacz wałka pompy wody oraz uszczelkę pod głowicą. Przy krótkich zimowych przejazdach niewielki osad pod samym korkiem wlewu bywa kondensacją pary wodnej."],["Działanie","Nie jeździj na zemulgowanym oleju (traci własności smarne i niszczy łożyska). Usuń przyczynę dostawania się wody/płynu, przepłucz układ świeżym olejem i zalej właściwą ilość wg DTR."]]}
 ,{"id":"decompressor-4t-hot-crank","title":"Rozrusznik 4T blokuje się w pierwszym obrocie na gorąco — automatyczny dekompresator","tags":"dekompresator wałek rozrządu 4T rozrusznik staje na ciepło GMP luzy zaworowe","category":"Silnik 4T","evidence":"partial","related":["starter-clicks","four-stroke-valves","four-stroke-hard-start-valves"],"areas":[["Jak działa automatyczny dekompresator","W wielu silnikach 4T 125–250 cm³ na wałku rozrządu znajduje się odśrodkowy mechanizm dekompresatora, który przy niskich obrotach rozrusznika minimalnie uchyla zawór wydechowy w suwie sprężania, ułatwiając pokonanie GMP."],["Objaw usterki lub złego luzu","Rozrusznik zatrzymuje się przed GMP jakby akumulator był rozładowany, a po drugiej próbie lub przejściu tłoka przez GMP kręci normalnie. Często przyczyną jest zbyt duży luz zaworu wydechowego, zacięty ciężarek odśrodkowy lub pęknięta sprężynka dekompresatora na wałku rozrządu."],["Weryfikacja","Najpierw sprawdź akumulator pod obciążeniem i spadki napięcia na rozruszniku, następnie ustaw dokładnie luz zaworowy na zimnym silniku wg DTR i oceń swobodę ruchu krzywki dekompresatora."]]}
 ,{"id":"kickstarter-ratchet-jam","title":"Kopniak nie wraca, ślizga się lub blokuje po naciśnięciu (półksiężyc i zabierak)","tags":"kopniak kickstarter półksiężyc zabierak sprężyna pokrywa CVT nie wraca","category":"CVT i napęd","evidence":"partial","related":["starter-spins-no-crank","cvt-no-engage","rear-wheel-binding"],"areas":[["Kopniak zostaje w dolnym położeniu","Pył z paska CVT i zaschnięty smar zacierają oś wałka półksiężyca w tulei pokrywy przekładni. Nie zostawiaj opuszczonego kopniaka przy pracującym silniku — wysunięty zabierak będzie ocierał o obracający się przeciwtalerz wariatora!"],["Kopniak przeskakuje z trzaskiem","Wytarte zęby zabieraka (bendixa kopniaka), wyrobiona korona na przeciwtalerzu wariatora, pęknięta sprężynka cierna zabieraka albo brak tulejek ustalających pokrywę CVT (pokrywa przekoszona względem osi wału)."],["Serwis","Oczyść mechanizm, nasmaruj wyłącznie oś półksiężyca i wielowypust zabieraka minimalną ilością smaru, upewnij się, że w pokrywie są obie tulejki ustalające (kołki centrujące) i dokręć śruby pokrywy równomiernie."]]}
 ,{"id":"oil-pump-2t-air-bubble","title":"Zapowietrzony dozownik oleju 2T lub pęknięty wężyk olejowy po serwisie gaźnika","tags":"dozownik oleju 2T pompa oleju wężyk olejowy zapowietrzenie zatarcie smarowanie","category":"Silnik 2T","evidence":"partial","related":["two-stroke-seizure","two-stroke-overheat","peugeot-oil-pump-limp"],"areas":[["Krytyczne ryzyko zatarcia","Po czyszczeniu gaźnika, wymianie króćca lub całkowitym wyjeżdżeniu oleju ze zbiorniczka w cienkim przewodzie od pompy oleju do gaźnika/króćca mogą pozostać pęcherze powietrza. Pompa oleju 2T podaje mikroskopijne dawki i potrzebuje wielu minut, aby przepchnąć powietrze — w tym czasie silnik pracuje bez smarowania!"],["Prawidłowa procedura po rozpięciu układu","1) Sprawdź elastyczność cienkiego wężyka olejowego i opaski; 2) Odpowietrz pompę oleju śrubką odpowietrzającą (jeśli występuje wg DTR) i napełnij cienki wężyk do gaźnika olejem 2T za pomocą strzykawki; 3) Na pierwsze uruchomienie po ingerencji w dozownik zastosuj bezpieczną mieszankę w baku, dopóki nie potwierdzisz przesuwania się słupka oleju w przezroczystym wężyku."],["Regulacja linki pompy","Jeżeli pompa oleju jest sterowana linką z rozdzielacza gazu, sprawdź zgodność znaków na dźwigni pompy zgodnie z instrukcją serwisową konkretnego silnika."]]}
 ,{"id":"lean-angle-sensor-no-start","title":"Skuter lub motocykl EFI nie odpala po wywrotce lub transporcie — czujnik przechyłu","tags":"czujnik przechyłu tilt sensor bank angle EFI wywrotka pompa paliwa nie działa","category":"Paliwo i sterowanie","evidence":"partial","related":["no_start","efi-idle-surge","spark-intermittent-bumps"],"areas":[["Zadanie czujnika przechyłu","W nowoczesnych skuterach i motocyklach EFI czujnik przechyłu (bank angle / tilt sensor) odcina przekaźnik pompy paliwa, wtryskiwacz i cewkę zapłonową, gdy pojazd przechyli się powyżej kąta granicznego (np. podczas parkingowej wywrotki)."],["Typowa pułapka po serwisie","1) Po podniesieniu pojazdu konieczne jest wyłączenie stacyjki na OFF i ponowne włączenie na ON, aby zresetować blokadę w ECU; 2) Podczas składania owiewek czujnik został przykręcony do góry nogami (napis „UP” skierowany w dół) lub spadł z gumowego uchwytu i wisi bokiem na wiązce."],["Kontrola","Zlokalizuj czujnik przechyłu wg DTR, sprawdź jego pionowe osadzenie strzałką „UP” ku górze i zresetuj zapłon kluczykiem."]]}
 ,{"id":"flasher-relay-led-hyperflash","title":"Kierunkowskazy świecą światłem ciągłym lub migają za szybko (przerywacz / LED)","tags":"kierunkowskazy przerywacz LED migają szybko świecą stale żarówka masa","category":"Elektryka i ładowanie","evidence":"partial","related":["lights-intermittent","intermittent-lights"],"areas":[["Szybkie miganie tylko jednej strony","Gdy lewa lub prawa strona miga dwa razy szybciej niż zwykle, w klasycznym układzie najczęściej przepaliła się jedna z żarówek (przednia lub tylna) albo zaśniedziała jej oprawka/masa, co zmniejszyło obciążenie przerywacza."],["Świecenie ciągłe lub brak reakcji po montażu LED","Fabryczny przerywacz bimetaliczny wymaga prądu żarówek (np. 2 × 10 W lub 2 × 21 W), aby nagrzać bimetal i rozewrzeć styk. Kierunkowskazy LED pobierają zbyt mały prąd — rozwiązaniem jest wymiana przerywacza na elektroniczny przerywacz LED (zwróć uwagę na układ pinów B/L/E we wtyczce!)."],["Pojedyncza kontrolka w liczniku (efekt 4 kierunkowskazów)","W skuterach z jedną wspólną żarówką kontrolki kierunkowskazów w liczniku (włączoną między lewy a prawy obwód) założenie LED powoduje świecenie wszystkich 4 kierunkowskazów jednocześnie — wymaga to separacji kontrolki za pomocą dwóch diod prostowniczych zgodnie ze schematem."]]}
,
  {"id":"idle_drops_lights_on","title":"Obroty biegu jałowego gwałtownie spadają po włączeniu świateł","tags":"wolne obroty światła stator regulator akumulator opór","areas":[["Elektryka / obciążenie alternatora","Włączenie świateł powoduje pobór 35–55 W prądu zmiennego ze statora. Wirnik magneta stawia wówczas zauważalny opór elektromagnetyczny na wale korbowym. Jeśli obroty jałowe są ustawione za nisko (< 1500 RPM) lub mieszanka jałowa jest zbyt uboga, silnik natychmiast zgaśnie."],["Sprawdzenie regulatora i masy","Zmierz spadek napięcia między karterem silnika a masą regulatora przy włączonych światłach. Jeśli przekracza 0.2 V, oczyść złącze masy silnik-rama. Sprawdź, czy regulator nie ma przebitej diody ograniczającej napięcie świateł (AC limiter)."],["Krok naprawczy","Wyreguluj obroty biegu jałowego na rozgrzanym silniku przy WŁĄCZONYCH światłach mijania do wartości zalecanej przez producenta (zwykle 1600–1800 obr./min dla 50cc i 1500–1700 dla 125cc). Wyreguluj śrubę składu mieszanki wolnych obrotów."]]},
  {"id":"hard_start_cold_gy6","title":"Silnik 4T GY6 ciężko odpala na zimno, po odpaleniu gaśnie","tags":"gy6 4t ssanie bistarter elektrozawór zimny rozruch","areas":[["Automatyczne ssanie (Elektrozawór / Bi-starter)","W skuterach GY6 4T ssanie elektryczne jest fabrycznie OTWARTE na zimnym silniku (wysunięta iglica cofa się po ostygnięciu). Po uruchomieniu prąd ze statora zasila element grzejny woskowy, który w ciągu 2-3 minut wysuwa iglicę i zamyka dodatkowy kanał paliwa. Jeśli iglica zacięła się w pozycji zamkniętej lub kanał ssania w gaźniku jest zatkany, zimny silnik nie otrzyma wzbogaconej mieszanki."],["Luz zaworowy (kluczowy trop 4T)","W silnikach GY6 zawór wydechowy i ssący mają tendencję do \"wklepywania się\" w gniazda zaworowe, co prowadzi do skasowania luzu (luz 0.00 mm). Na zimnym silniku zawór może być minimalnie niedomknięty, powodując utratę kompresji poniżej 7 barów. Po kilku próbach kręcenia olej minimalnie uszczelnia cylinder i silnik załapuje."],["Procedura diagnostyczna","1) Zmierz luz zaworowy na zimnym silniku (musi wynosić min. 0.05 mm ssący, 0.07 mm wydech). 2) Wyjmij elektrozawór ssania, zmierz długość iglicy, podłącz pod 12V na 3 minuty i sprawdź, czy iglica wysuwa się o ok. 3-4 mm. 3) Przedmuchaj zmywaczem kanał ssania w gaźniku."]]},
  {"id":"bogging_wot","title":"Dławienie i \"buczenie\" przy pełnym otwarciu gazu (WOT)","tags":"gaźnik dysza główna uboga bogata stożek lewe powietrze wot","areas":[["Zbyt uboga mieszanka na dyszy głównej","Gdy manetka jest otwarta w zakresie 3/4 do 100%, o składzie decyduje wyłącznie dysza główna (Main Jet). Jeśli silnik buczy głuchym dźwiękiem (\"buuu\"), a lekkie przymknięcie gazu lub zaciągnięcie ssania poprawia przyspieszenie — dysza główna jest zdecydowanie za mała (lub założono filtr stożkowy bez wymiany dyszy)."],["Zbyt bogata mieszanka (zalewanie)","Jeśli przy pełnym gazie silnik gwałtownie szarpie, przerywa, \"czwórkuje\" (jakby miał odcinkę zapłonu) i pluje czarnym dymem — mieszanka jest za bogata, dysza główna za duża lub filtr powietrza jest skrajnie zabrudzony/zaolejony."],["Płytka i iglica","W zakresie 1/4 do 3/4 manetki za dawkę odpowiada profil i wysokość iglicy. Przestawienie zawleczki o 1 ząbek w dół (podniesienie iglicy) wzbogaca mieszankę, a opuszczenie iglicy zuboża."]]},
  {"id":"cvt_slipping_oil","title":"Pasek CVT ślizga się, silnik wyje, wyciek z karteru","tags":"pasek olej uszczelniacz simering wariator przekładnia","areas":[["Uszkodzenie uszczelniacza wału (Simering)","Za wariatorem znajduje się uszczelniacz lewego czopa wału korbowego. Gdy stwardnieje, zużyje się lub zostanie wypchnięty przez ciśnienie skrzyni korbowej, gorący olej (lub mieszanka 2T) jest rozbryzgiwany wprost na bieżnie wariatora i pasek napędowy. Zaolejony pasek natychmiast traci przyczepność i ulega poślizgowi pod obciążeniem."],["Wyciek z uszczelniacza przekładni tylnej","Również wałek wejściowy tylnej przekładni (za sprzęgłem) posiada simering. Wyciekający olej przekładniowy zanieczyszcza okładziny sprzęgła i dzwon, powodując drastyczne szarpanie przy ruszaniu."],["Naprawa","1) Zdemontuj wariator i sprzęgło. 2) Dokładnie odtłuść bieżnie zmywaczem do hamulców. 3) Wymień simering wału (wbijaj równomiernie, wargę nasmaruj olejem). 4) Zaolejony pasek napędowy nadaje się WYŁĄCZNIE do wymiany — guma pęcznieje pod wpływem oleju i mycie zmywaczem jej nie uratuje."]]},
  {"id":"spark_outside_no_start","title":"Iskra jest na świecy wyjętej na zewnątrz, ale silnik nie odpala","tags":"iskra kompresja świeca cewka wn fajka kompresja ciśnienie","areas":[["Różnica warunków: atmosfera a kompresja","Świeca na wolnym powietrzu potrzebuje zaledwie 2–3 kV napięcia, aby wytworzyć widoczną iskrę. Pod kompresją w cylindrze (8–12 barów) gęstość gazu drastycznie zwiększa opór dielektryczny — do przeskoku iskry potrzeba wówczas 12–18 kV! Osłabiona cewka WN, pęknięta fajka, przebity kabel lub słaby kondensator w CDI dadzą iskrę na powietrzu, ale zgasną pod ciśnieniem w komorze spalania."],["Test warsztatowy","Użyj nastawnego testera iskry (Spark Gap Tester) i ustaw przerwę na 7–8 mm na powietrzu. Zdrowy układ zapłonowy musi bez trudu przebić 8 mm grubą, niebieską iskrą. Jeśli iskra ginie powyżej 3 mm — cewka, świeca lub zasilanie CDI są uszkodzone."],["Świeca z przebiciem wewnętrznym","Zabrudzona nagarem lub zawilgocona świeca zapłonowa pod ciśnieniem odprowadza iskrę po izolatorze zamiast między elektrodami. Zawsze w pierwszej kolejności zamontuj NOWĄ fabryczną świecę o zalecanej ciepłocie (np. NGK BR8HS / CR7HSA)."]]},
  {"id":"stator_loss_high_rpm","title":"Silnik odpala i jedzie na wolnych, ale odcina zapłon przy wysokich obrotach","tags":"stator odcina przerywa wysokie obroty cewka cdi impulsator","areas":[["Przebicie cewki ładującej statora przy wysokim napięciu","W instalacjach AC-CDI cewka ładująca statora generuje napięcie rosnące wraz z obrotami — od 40 V AC na wolnych obrotach aż do 150–250 V AC przy 8000 RPM. Jeśli uzwojenie ma mikropęknięcie izolacji lakierowej, przy wysokim napięciu dochodzi do przebicia międzyzwojowego. Iskra zanika natychmiast po przekroczeniu pewnych obrotów."],["Kształt i amplituda sygnału impulsatora","Zbyt duża szczelina między wypustem koła magnesowego a czujnikiem impulsatora (powinno być 0.5–0.7 mm) powoduje rozmycie sygnału wyzwalającego przy wysokiej prędkości kątowej wału."],["Kontrola multimetrem","Zmierz rezystancję cewki zasilającej statora i impulsatora zarówno na zimnym silniku, jak i bezpośrednio po rozgrzaniu. Jeśli rezystancja rośnie o więcej niż 20% lub gwałtownie spada — stator wymaga wymiany."]]},
  {"id":"starter_clicks_no_crank","title":"Rozrusznik tylko cicho \"klika\" (stycznik), wał w ogóle nie kręci","tags":"rozrusznik przekaźnik elektromagnes szczotki masa akumulator","areas":[["Spadek napięcia na klemach / rozładowany akumulator","Kliknięcie to dźwięk kotwicy przekaźnika rozrusznika (stycznika). Jeśli akumulator ma zbyt małą wydajność prądową (wysoka rezystancja wewnętrzna, zasiarczenie), pod obciążeniem 30–40 A napięcie spada poniżej 8 V i rozrusznik nie ruszy."],["Wypalone styki przekaźnika lub zużyte szczotki","Zewrzyj na 1 sekundę dwa grube zaciski śrubowe na przekaźniku rozrusznika grubym śrubokrętem z izolowaną rączką (uwaga na iskry!). Jeśli rozrusznik energicznie zakręci — uszkodzony jest sam przekaźnik. Jeśli nadal cisza — zużyły się szczotki rozrusznika, zawiesił się wirnik lub urwał się gruby przewód zasilający/masa silnika."],["Zablokowany silnik lub bendix","Zdejmij pokrywę napędu lub obróć wał kluczem za koło magnesowe/wariator. Jeśli wał stoi w miejscu — silnik uległ zatarciu mechanicznemu lub zakleszczył się zębaty bendix rozrusznika."]]},
  {"id":"reed_valve_damage","title":"Silnik 2T pluje paliwem w filtr, brak mocy z dołu, zalewa świecę","tags":"2t membrana zawór płytkowy listki karbon króciec dolot","areas":[["Wyszczerbione lub odgięte listki zaworu membranowego","Zawór membranowy (Reed Valve) pełni rolę zaworu zwrotnego w silnikach 2-suwowych. Podczas ruchu tłoka w dół w karterze powstaje ciśnienie wstępne. Jeśli listki są wyszczerbione, pęknięte lub odstają od korpusu, mieszanka paliwowo-powietrzna zamiast do cylindra jest wypychana z powrotem przez gaźnik do puszki filtra powietrza."],["Weryfikacja organoleptyczna","Wyjmij zawór membranowy z karteru. Spójrz przez niego pod silne światło. Pomiędzy listkami a gumowanym korpusem NIE MOŻE być widoczna żadna szczelina świetlna! Płytki muszą idealnie przylegać na całej długości."],["Zalecenie materiałowe","W silnikach po tuningu lub eksploatowanych sportowo wymień fabryczne listki metalowe na płytki karbonowe/węglowe (np. Polini / Malossi 0.30–0.35 mm). W razie pęknięcia karbon ulega zmieleniu i nie niszczy cylindra ani tłoka, w przeciwieństwie do stali."]]},
  {"id":"liquid_coolant_pressurized","title":"Wyrzuca płyn chłodniczy ze zbiorniczka, twarde węże (Silnik LC)","tags":"chłodzenie uszczelka głowicy kompresja przedmuch termostat płyn","areas":[["Przedmuch uszczelki pod głowicą (Head Gasket Failure)","Gdy uszczelka głowicy lub gumowy O-ring komory spalania ulegnie przerwaniu, potężne ciśnienie suwu pracy (30–60 barów) przedostaje się wprost do płaszcza wodnego cylindra. Płyn chłodniczy jest wypychany przez korek ciśnieniowy, a węże robią się nienaturalnie twarde natychmiast po uruchomieniu silnika."],["Zacięty termostat w pozycji zamkniętej","Jeśli termostat nie otwiera się przy temperaturze 65–75°C, płyn krąży wyłącznie w małym obiegu silnika. Chłodnica pozostaje zimna, a silnik w kilka minut osiąga temperaturę wrzenia."],["Procedura weryfikacji","1) Odkręć korek zbiorniczka na ZIMNYM silniku i odpal. Jeśli natychmiast pojawiają się bąble gazu spalinowego pachnące spalinami — uszczelka pod głowicą jest przedmuchana. 2) Sprawdź płaskość głowicy na płycie traserskiej ze szczelinomierzem (dopuszczalne zwichrowanie < 0.05 mm)."]]},
  {"id":"spitting_backfire_exhaust","title":"Strzały i głośne \"strzelanie\" w tłumik przy hamowaniu silnikiem","tags":"wydech strzały uboga nieszczelność kolektor zawór aic","areas":[["Nieszczelność układu wydechowego (zasysanie tlenu)","Podczas zamykania gazu przy wysokich obrotach w wydechu powstaje podciśnienie. Jeśli uszczelka pod wydechem przy cylindrze jest wydmuchana lub rura pęknięta, do gorącego wydechu zasysane jest świeże powietrze z tlenem. Niespalone resztki paliwa natychmiast gwałtownie eksplodują w tłumiku."],["Zbyt uboga mieszanka biegu jałowego","Zbyt uboga mieszanka wolnych obrotów pali się bardzo wolno. Płomień nie gaśnie przed otwarciem okna wydechowego i zapala gazy w kolanku wydechowym."],["Rozwiązanie","Wymień miedzianą uszczelkę wydechu (dokręć równomiernie momentem 10–12 Nm dla M6). Wkręć lub wykręć śrubę składu mieszanki o 1/4 obrotu w stronę bogatszą."]]},
  {"id":"oil_diluted_gasoline","title":"Olej silnikowy pachnie benzyną i przybywa go na bagnecie (Silnik 4T)","tags":"4t olej benzyna kranik pływak iglica zaworek rozrzedzenie","areas":[["Przelewający się gaźnik i nieszczelny kranik podciśnieniowy","Gdy kranik podciśnieniowy nie zamyka paliwa na postoju, a w gaźniku zaworek iglicowy pływaka jest nieszczelny, benzyna grawitacyjnie przelewa się przez króciec ssący, otwarty zawór ssący i spływa po ściankach cylindra wprost do miski olejowej karteru."],["Zagrożenie dla silnika","Rozrzedzony benzyną olej traci film smarny! Jazda z takim olejem w ciągu kilkunastu kilometrów prowadzi do zatarcia panewek wału, zatarcia łożyska korbowodu i uszkodzenia krzywek wałka rozrządu!"],["Czynności natychmiastowe","1) Bezwzględnie NIE uruchamiaj silnika! 2) Wymień kranik paliwa lub membranę pompy. 3) Wyczyść i sprawdź zaworek iglicowy gaźnika. 4) Spuść zanieczyszczony olej i zalej świeży olej 10W-40 z nowym filtrem."]]},
  {"id":"fuel_pump_efi_dead","title":"Skuter z wtryskiem (EFI): Brak dźwięku pompy paliwa po stacyjce","tags":"wtrysk efi pompa paliwa przekaźnik bezpiecznik czujnik przechyłu","areas":[["Czujnik przechyłu (Bank Angle Sensor)","W nowoczesnych skuterach z wtryskiem (np. Honda PCX, Yamaha NMAX, Piaggio Beverly) zamontowany jest czujnik wykrywający upadek pojazdu. Jeśli czujnik poluzował się w uchwycie lub zawiesił, sterownik ECU odcina zasilanie pompy paliwa i wtryskiwacza ze względów bezpieczeństwa."],["Przekaźnik pompy paliwa i bezpiecznik EFI","Sprawdź bezpiecznik obwodu EFI (zwykle 10 A lub 15 A) oraz przekaźnik główny. Po przekręceniu kluczyka ECU powinno podać masę na przekaźnik pompy na 2–3 sekundy w celu wytworzenia ciśnienia wstępnego (zwykle 2.5–3.0 bara)."],["Pomiary na kostce pompy","Odłącz kostkę pompy w zbiorniku i zmierz napięcie multimetrem podczas włączania stacyjki. Jeśli jest 12 V, a pompa milczy — zatarty jest silnik elektryczny pompy paliwa lub zanieczyszczony filtr wstępny (sitko smoka)."]]},
